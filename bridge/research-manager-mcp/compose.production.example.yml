services:
  research-manager-mcp:
    image: "${MCP_IMAGE_REF:?set MCP_IMAGE_REF to an immutable MCP image tag or digest}"
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mcp_telemetry:/var/lib/site-control-mcp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    stop_grace_period: 15s

volumes:
  mcp_telemetry:
