services:
  research-manager-mcp:
    image: "${MCP_IMAGE_REF:?set MCP_IMAGE_REF to an immutable MCP image tag or digest}"
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mcp_telemetry:/var/lib/site-control-mcp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      - mcp_backend
    stop_grace_period: 15s

  ingress:
    image: "${MCP_INGRESS_IMAGE:?set MCP_INGRESS_IMAGE to an immutable Caddy tag or digest}"
    restart: unless-stopped
    depends_on:
      research-manager-mcp:
        condition: service_healthy
    environment:
      MCP_PUBLIC_HOST: "${MCP_PUBLIC_HOST:?set MCP_PUBLIC_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - mcp_backend
      - ingress_egress

networks:
  mcp_backend:
    internal: true
  ingress_egress:

volumes:
  mcp_telemetry:
  caddy_data:
  caddy_config:
