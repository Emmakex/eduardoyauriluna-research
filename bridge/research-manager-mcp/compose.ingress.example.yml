services:
  research-manager-mcp:
    image: "${MCP_IMAGE_REF:?set MCP_IMAGE_REF to an immutable MCP image tag or digest}"
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mcp_telemetry:/var/lib/site-control-mcp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      mcp_backend: {}
      public-edge:
        aliases:
          - kairoseth-mcp-runtime
    stop_grace_period: 15s

networks:
  mcp_backend:
    internal: true
  public-edge:
    name: kairoseth-public-edge
    external: true

volumes:
  mcp_telemetry:
