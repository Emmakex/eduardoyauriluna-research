name: Phase 2E Navigation Discovery

on:
  push:
    branches: [main]
    paths:
      - 'ops/phase2e/navigation-discovery.json'

permissions:
  contents: write

concurrency:
  group: phase2d-command-gateway
  cancel-in-progress: false

jobs:
  discover:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase2d-production
    env:
      PHASE2D_MCP_BASE_URL: https://mcp.kairoseth.com/mcp
      PHASE2D_MCP_TOKEN: ${{ secrets.PHASE2D_MCP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact read-only discovery request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('ops/phase2e/navigation-discovery.json').read_text(encoding='utf-8'))
          expected = {
              'version': '1',
              'tenant': 'eduardo-research',
              'action': 'inspect-current-navigation',
              'read_only': True,
          }
          if value != expected:
              raise SystemExit('Navigation discovery request does not match the reviewed read-only contract')
          print('NAVIGATION_DISCOVERY_REQUEST_OK')
          PY

      - name: Self-test read-only Navigation discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-navigation-discovery.py --self-test

      - name: Verify dedicated principal tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-command-guard.py isolation --tenant eduardo-research

      - name: Inspect current registered Theme navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-navigation-discovery.py \
            --output commands/phase2d/results/phase2e-navigation-discovery.json

      - name: Persist sanitized Navigation discovery
        shell: bash
        run: |
          set -euo pipefail
          result='commands/phase2d/results/phase2e-navigation-discovery.json'
          test -f "$result"
          cp "$result" /tmp/phase2e-navigation-discovery.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$result")"
          cp /tmp/phase2e-navigation-discovery.json "$result"
          git config user.name 'kairoseth-command-gateway[bot]'
          git config user.email 'kairoseth-command-gateway[bot]@users.noreply.github.com'
          git add "$result"
          if git diff --cached --quiet; then
            echo 'Navigation discovery result already persisted'
            exit 0
          fi
          git commit -m 'phase2e: record read-only navigation discovery'
          git push origin HEAD:main
