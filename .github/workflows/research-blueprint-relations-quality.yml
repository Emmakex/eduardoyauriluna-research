name: Research Blueprint Relations Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - 'config/research-site-blueprint.json'
      - '.github/workflows/research-blueprint-relations-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - 'config/research-site-blueprint.json'
      - '.github/workflows/research-blueprint-relations-quality.yml'

permissions:
  contents: read

jobs:
  relations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-blueprint-relations-wp
          mkdir -p /tmp/research-blueprint-relations-wp
          cd /tmp/research-blueprint-relations-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Blueprint Relations' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Resolve pair keys and language slugs into verified line IDs
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-blueprint-relations-wp
          wp eval '
          wp_set_current_user(1);
          $blueprint = json_decode((string) file_get_contents(getenv("GITHUB_WORKSPACE") . "/config/research-site-blueprint.json"), true);
          if (! is_array($blueprint)) { exit(1); }
          $blueprint["projects"][] = [
              "title"=>"CI Relation Project",
              "slug"=>"ci-relation-project",
              "language"=>"en",
              "status"=>"publish",
              "project_status"=>"planning",
              "question"=>"Can stable blueprint references resolve after Greenfield creation?",
              "role"=>"CI fixture",
              "methods"=>["Design Science Research"],
              "line_refs"=>["line-order-10","digital-transformation-ai-adoption-smes"],
              "evidence"=>["confirmed"=>true,"reference"=>"CI blueprint relation fixture"]
          ];

          $boot = Eduardo_Research_Manager::bootstrap()->apply($blueprint);
          if (is_wp_error($boot) || empty($boot["verified"]) || 9 !== (int) $boot["operation_count"]) {
              fwrite(STDERR, is_wp_error($boot) ? $boot->get_error_message() : wp_json_encode($boot)); exit(1);
          }
          if (! Eduardo_Research_Manager::blueprint_relations() instanceof Eduardo_Research_Manager_Blueprint_Relations) { exit(1); }

          $blocked = $blueprint;
          unset($blocked["projects"][0]["evidence"]);
          $blocked_preview = Eduardo_Research_Manager::blueprint_relations()->preview($blocked);
          if (is_wp_error($blocked_preview) || ! empty($blocked_preview["apply_allowed"]) || 1 !== (int) $blocked_preview["operation_count"]) {
              fwrite(STDERR, is_wp_error($blocked_preview) ? $blocked_preview->get_error_message() : wp_json_encode($blocked_preview)); exit(1);
          }

          $preview = Eduardo_Research_Manager::blueprint_relations()->preview($blueprint);
          if (is_wp_error($preview) || empty($preview["apply_allowed"]) || 1 !== (int) $preview["operation_count"] || ! empty($preview["requires_legacy_discovery"]) || ! empty($preview["requires_legacy_mapping"])) {
              fwrite(STDERR, is_wp_error($preview) ? $preview->get_error_message() : wp_json_encode($preview)); exit(1);
          }
          $operation = $preview["operations"][0];
          if (2 !== count($operation["line_ids"]) || "change" !== $operation["status"]) { exit(1); }

          $applied = Eduardo_Research_Manager::blueprint_relations()->apply($blueprint);
          if (is_wp_error($applied) || empty($applied["verified"]) || 1 !== (int) $applied["operation_count"] || 1 !== count($applied["snapshot_ids"])) {
              fwrite(STDERR, is_wp_error($applied) ? $applied->get_error_message() : wp_json_encode($applied)); exit(1);
          }
          $project = get_page_by_path("ci-relation-project", OBJECT, "research_project");
          if (! $project instanceof WP_Post) { exit(1); }
          $state = Eduardo_Research_Manager::projects()->inspect((int) $project->ID);
          if (is_wp_error($state) || 2 !== count($state["line_ids"])) { exit(1); }
          foreach ($state["line_ids"] as $line_id) {
              if (! eduardo_research_line_is_verified_public((int) $line_id, "en")) { exit(1); }
          }

          $second = Eduardo_Research_Manager::blueprint_relations()->preview($blueprint);
          if (is_wp_error($second) || 1 !== (int) $second["operation_count"] || "already-matching" !== $second["operations"][0]["status"]) { exit(1); }

          $invalid = $blueprint;
          $invalid["projects"][0]["line_refs"] = ["missing-line-reference"];
          $invalid_preview = Eduardo_Research_Manager::blueprint_relations()->preview($invalid);
          if (! is_wp_error($invalid_preview) || "research_manager_blueprint_relation_invalid" !== $invalid_preview->get_error_code()) { exit(1); }

          $rollback = Eduardo_Research_Manager::blueprint_relations()->rollback($applied["snapshot_ids"]);
          if (is_wp_error($rollback) || 1 !== (int) $rollback["snapshot_count"]) { exit(1); }
          $restored = Eduardo_Research_Manager::projects()->inspect((int) $project->ID);
          if (is_wp_error($restored) || ! empty($restored["line_ids"])) { exit(1); }
          ' --allow-root
