name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager files and version
        shell: bash
        run: |
          set -euo pipefail
          P=wordpress/plugins/eduardo-research-manager
          for f in \
            eduardo-research-manager.php \
            includes/class-research-manager-contract.php \
            includes/class-research-manager-diagnostics.php \
            includes/class-research-manager-plan.php \
            includes/class-research-manager-snapshots.php \
            includes/class-research-manager-executor.php \
            includes/class-research-manager-page-resource.php \
            includes/class-research-manager-insight-resource.php \
            includes/class-research-manager-output-resource.php \
            includes/class-research-manager-project-resource.php \
            includes/class-research-manager-software-resource.php \
            includes/class-research-manager-dataset-resource.php \
            includes/class-research-manager-rendered-verifier.php \
            includes/class-research-manager-remediation.php \
            includes/class-research-manager-admin.php \
            includes/class-research-manager.php; do
            test -s "$P/$f"
          done
          grep -F 'Version: 0.10.0' "$P/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install clean WordPress and verify plugin-only safety
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://manager.test --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"]) || (int) $report["summary"]["fail"] < 1) { exit(1); }
          if (! Eduardo_Research_Manager::remediation() instanceof Eduardo_Research_Manager_Remediation) { exit(1); }
          ' --allow-root

      - name: Activate Theme and verify clean readiness
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) {
              fwrite(STDERR, wp_json_encode($report)); exit(1);
          }
          ' --allow-root

      - name: Introduce deterministic and manual readiness drift
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $contact = get_page_by_path("contact");
          $about = get_page_by_path("about");
          $privacy = get_page_by_path("privacy-policy");
          if (! $contact instanceof WP_Post || ! $about instanceof WP_Post || ! $privacy instanceof WP_Post) { exit(1); }

          update_option("erm_ci_contact_id", (int) $contact->ID, false);
          update_option("erm_ci_about_id", (int) $about->ID, false);
          update_option("erm_ci_privacy_id", (int) $privacy->ID, false);
          update_option("erm_ci_original_languages", get_option("eduardo_research_native_languages"), false);
          update_option("erm_ci_original_show_on_front", get_option("show_on_front"), false);
          update_option("erm_ci_original_page_on_front", (int) get_option("page_on_front"), false);

          wp_delete_post($contact->ID, true);
          update_post_meta($about->ID, "_eduardo_research_role", "broken-role");
          update_post_meta($about->ID, "_eduardo_research_model", "broken-model");
          update_option("eduardo_research_native_languages", ["default"=>"es","enabled"=>["es"]], false);
          wp_update_post(["ID"=>$privacy->ID,"post_status"=>"draft"]);
          update_option("show_on_front", "posts");
          update_option("page_on_front", 0);
          ' --allow-root

      - name: Verify remediation catalog and safe batch Preview
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $remediation = Eduardo_Research_Manager::remediation();
          $catalog = $remediation->catalog();
          $by_id = [];
          foreach ($catalog["items"] as $item) { $by_id[$item["id"]] = $item; }

          foreach (["page-contact","page-about","language-contract","page-privacy-policy","front-page"] as $required) {
              if (! isset($by_id[$required])) { fwrite(STDERR, "Missing catalog item: $required\n"); exit(1); }
          }
          if (empty($by_id["page-contact"]["planable"]) || "create-resource" !== $by_id["page-contact"]["class"]) { exit(1); }
          if (empty($by_id["page-about"]["planable"]) || "auto-fix" !== $by_id["page-about"]["class"]) { exit(1); }
          if (empty($by_id["language-contract"]["planable"]) || "auto-fix" !== $by_id["language-contract"]["class"]) { exit(1); }
          if (! empty($by_id["page-privacy-policy"]["planable"]) || "manual-review" !== $by_id["page-privacy-policy"]["class"]) { exit(1); }
          if (! empty($by_id["front-page"]["planable"]) || "manual-review" !== $by_id["front-page"]["class"]) { exit(1); }

          $batch = $remediation->prepare_safe_batch();
          if (is_wp_error($batch) || ! is_array($batch["plan"] ?? null)) {
              fwrite(STDERR, is_wp_error($batch) ? $batch->get_error_message() : wp_json_encode($batch)); exit(1);
          }
          sort($batch["included"]);
          $expected = ["language-contract","page-about","page-contact"];
          sort($expected);
          if ($expected !== $batch["included"]) { fwrite(STDERR, wp_json_encode($batch)); exit(1); }
          $skipped = array_column($batch["skipped"], "check_id");
          if (! in_array("page-privacy-policy", $skipped, true) || ! in_array("front-page", $skipped, true)) { exit(1); }

          $preview = Eduardo_Research_Manager::executor()->preview($batch["plan"]);
          if (is_wp_error($preview) || empty($preview["apply_allowed"])) { exit(1); }
          if (get_page_by_path("contact") instanceof WP_Post) { fwrite(STDERR, "Preview recreated Contact\n"); exit(1); }
          $about = get_post((int) get_option("erm_ci_about_id"));
          if ("broken-role" !== get_post_meta($about->ID, "_eduardo_research_role", true)) { exit(1); }
          $langs = get_option("eduardo_research_native_languages");
          if ("es" !== ($langs["default"] ?? "")) { exit(1); }

          update_option("erm_ci_remediation_plan", $batch["plan"], false);
          update_option("erm_ci_remediation_included", $batch["included"], false);
          ' --allow-root

      - name: Apply batch and verify only deterministic checks were repaired
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $plan = get_option("erm_ci_remediation_plan");
          $included = get_option("erm_ci_remediation_included");
          $applied = Eduardo_Research_Manager::executor()->apply($plan);
          if (is_wp_error($applied) || "applied" !== ($applied["status"] ?? "") || empty($applied["snapshot_id"])) {
              fwrite(STDERR, is_wp_error($applied) ? $applied->get_error_message() : wp_json_encode($applied)); exit(1);
          }
          $verified = Eduardo_Research_Manager::remediation()->verify_after_apply($included);
          if (empty($verified["verified"])) { fwrite(STDERR, wp_json_encode($verified)); exit(1); }

          $contact = get_page_by_path("contact");
          $about = get_post((int) get_option("erm_ci_about_id"));
          $privacy = get_post((int) get_option("erm_ci_privacy_id"));
          if (! $contact instanceof WP_Post || "contact" !== get_post_meta($contact->ID, "_eduardo_research_role", true)) { exit(1); }
          if ("profile" !== get_post_meta($about->ID, "_eduardo_research_role", true) || "research-about-v1" !== get_post_meta($about->ID, "_eduardo_research_model", true)) { exit(1); }
          $langs = get_option("eduardo_research_native_languages");
          if ("en" !== ($langs["default"] ?? "") || ["en","es"] !== array_values($langs["enabled"] ?? [])) { exit(1); }
          if ("draft" !== $privacy->post_status) { fwrite(STDERR, "Manual-review Privacy was changed\n"); exit(1); }
          if ("posts" !== get_option("show_on_front") || 0 !== (int) get_option("page_on_front")) { fwrite(STDERR, "Manual-review routing was changed\n"); exit(1); }

          update_option("erm_ci_remediation_snapshot", $applied["snapshot_id"], false);
          ' --allow-root

      - name: Roll back batch and verify exact previous drift is restored
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $snapshot = (string) get_option("erm_ci_remediation_snapshot", "");
          $rolled = Eduardo_Research_Manager::executor()->rollback($snapshot);
          if (is_wp_error($rolled) || "rolled-back" !== ($rolled["status"] ?? "")) { exit(1); }
          if (get_page_by_path("contact") instanceof WP_Post) { fwrite(STDERR, "Rollback left recreated Contact\n"); exit(1); }
          $about_id = (int) get_option("erm_ci_about_id");
          if ("broken-role" !== get_post_meta($about_id, "_eduardo_research_role", true) || "broken-model" !== get_post_meta($about_id, "_eduardo_research_model", true)) { exit(1); }
          $langs = get_option("eduardo_research_native_languages");
          if ("es" !== ($langs["default"] ?? "") || ["es"] !== array_values($langs["enabled"] ?? [])) { exit(1); }
          if ("posts" !== get_option("show_on_front") || 0 !== (int) get_option("page_on_front")) { exit(1); }
          ' --allow-root

      - name: Verify single-check plan and evidence-store refusal
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $remediation = Eduardo_Research_Manager::remediation();
          $executor = Eduardo_Research_Manager::executor();

          $plan = $remediation->build_plan_for_check("page-about", "Repair About only");
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $applied = $executor->apply($plan); if (is_wp_error($applied)) { exit(1); }
          $verified = $remediation->verify_after_apply(["page-about"]);
          if (empty($verified["verified"])) { exit(1); }
          if (is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }

          update_option("eduardo_research_evidence", "corrupt-shape", false);
          $catalog = $remediation->catalog();
          $evidence = null;
          foreach ($catalog["items"] as $item) { if ("evidence-store" === $item["id"]) { $evidence = $item; break; } }
          if (! is_array($evidence) || "manual-review" !== ($evidence["class"] ?? "") || ! empty($evidence["planable"])) { exit(1); }
          $blocked = $remediation->build_plan_for_check("evidence-store");
          if (! is_wp_error($blocked) || "research_manager_remediation_not_planable" !== $blocked->get_error_code()) { exit(1); }
          update_option("eduardo_research_evidence", [], false);
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.10.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.10.0.zip
          unzip -t ../../dist/eduardo-research-manager-0.10.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.10.0
          path: dist/eduardo-research-manager-0.10.0.zip
          if-no-files-found: error
