name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager files and version
        shell: bash
        run: |
          set -euo pipefail
          P=wordpress/plugins/eduardo-research-manager
          for f in \
            eduardo-research-manager.php \
            includes/class-research-manager-contract.php \
            includes/class-research-manager-diagnostics.php \
            includes/class-research-manager-plan.php \
            includes/class-research-manager-snapshots.php \
            includes/class-research-manager-executor.php \
            includes/class-research-manager-page-resource.php \
            includes/class-research-manager-insight-resource.php \
            includes/class-research-manager-output-resource.php \
            includes/class-research-manager-project-resource.php \
            includes/class-research-manager-admin.php \
            includes/class-research-manager.php; do
            test -s "$P/$f"
          done
          grep -F 'Version: 0.6.0' "$P/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install clean WordPress and verify safe plugin-only state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://manager.test --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"]) || (int) $report["summary"]["fail"] < 1) { exit(1); }
          ' --allow-root

      - name: Activate Theme and verify services
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) { fwrite(STDERR, wp_json_encode($report)); exit(1); }
          if (! Eduardo_Research_Manager::pages() instanceof Eduardo_Research_Manager_Page_Resource) { exit(1); }
          if (! Eduardo_Research_Manager::insights() instanceof Eduardo_Research_Manager_Insight_Resource) { exit(1); }
          if (! Eduardo_Research_Manager::outputs() instanceof Eduardo_Research_Manager_Output_Resource) { exit(1); }
          if (! Eduardo_Research_Manager::projects() instanceof Eduardo_Research_Manager_Project_Resource) { exit(1); }
          ' --allow-root

      - name: Regression gate Pages Insights and Publications
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $executor = Eduardo_Research_Manager::executor();

          $page_plan = Eduardo_Research_Manager::pages()->build_hydration_plan("about", "en", ["eyebrow"=>"Regression profile"]);
          if (is_wp_error($page_plan)) { exit(1); }
          $page_apply = $executor->apply($page_plan);
          if (is_wp_error($page_apply) || is_wp_error($executor->rollback($page_apply["snapshot_id"]))) { exit(1); }

          $insight_plan = Eduardo_Research_Manager::insights()->build_creation_plan([
              "title"=>"Regression Insight","slug"=>"regression-insight","content"=>"<p>Regression.</p>","status"=>"publish"
          ]);
          if (is_wp_error($insight_plan)) { exit(1); }
          $insight_token = (string) $insight_plan["actions"][0]["creation_token"];
          $insight_apply = $executor->apply($insight_plan);
          if (is_wp_error($insight_apply) || Eduardo_Research_Manager::insights()->find_created_by_token($insight_token) <= 0) { exit(1); }
          if (is_wp_error($executor->rollback($insight_apply["snapshot_id"]))) { exit(1); }

          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Output line","post_name"=>"output-line"]);
          update_post_meta($line, "_research_language", "en");
          update_post_meta($line, "_research_evidence_status", "verified");
          $output_plan = Eduardo_Research_Manager::outputs()->build_creation_plan([
              "title"=>"Regression Output","slug"=>"regression-output","status"=>"publish","output_type"=>"technical_report",
              "review_status"=>"technical_output","publication_date"=>"2026","line_ids"=>[$line]
          ], "Create regression output", ["evidence_confirmed"=>true,"evidence_reference"=>"CI regression source"]);
          if (is_wp_error($output_plan)) { fwrite(STDERR, $output_plan->get_error_message()); exit(1); }
          $output_apply = $executor->apply($output_plan);
          if (is_wp_error($output_apply)) { fwrite(STDERR, $output_apply->get_error_message()); exit(1); }
          $output_token = (string) $output_plan["actions"][0]["creation_token"];
          if (Eduardo_Research_Manager::outputs()->find_created_by_token($output_token) <= 0) { exit(1); }
          if (is_wp_error($executor->rollback($output_apply["snapshot_id"]))) { exit(1); }
          wp_delete_post($line, true);
          ' --allow-root

      - name: Verify evidence gate and Research Project creation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $_GET = [];
          $projects = Eduardo_Research_Manager::projects();
          $executor = Eduardo_Research_Manager::executor();

          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Verified Project Line","post_name"=>"verified-project-line"]);
          update_post_meta($line, "_research_language", "en");
          update_post_meta($line, "_research_evidence_status", "verified");

          $data = [
              "title"=>"Verified Research Project",
              "slug"=>"verified-research-project",
              "excerpt"=>"Evidence-backed project fixture.",
              "content"=>"<p>Bounded project narrative.</p>",
              "language"=>"en",
              "status"=>"publish",
              "project_status"=>"active",
              "question"=>"How can evidence-aware digital systems improve scholarly discovery?",
              "role"=>"Principal researcher",
              "start_date"=>"2026-01-15",
              "end_date"=>"2026-12",
              "partner"=>"CI Research Lab",
              "funding"=>"Internal research programme",
              "project_url"=>"https://example.test/research-project",
              "methods"=>["Design science","Controlled evaluation"],
              "line_ids"=>[$line],
          ];

          $blocked_plan = $projects->build_creation_plan($data, "Preview verified project");
          if (is_wp_error($blocked_plan) || "evidence-required" !== $blocked_plan["risk"]) { exit(1); }
          $preview = $executor->preview($blocked_plan);
          if (is_wp_error($preview) || ! empty($preview["apply_allowed"])) { exit(1); }
          $blocked = $executor->apply($blocked_plan);
          if (! is_wp_error($blocked) || "research_manager_evidence_required" !== $blocked->get_error_code()) { exit(1); }

          $plan = $projects->build_creation_plan($data, "Create verified Research Project", [
              "evidence_confirmed"=>true,"evidence_reference"=>"CI project evidence record 2026-10-09"
          ]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message()); exit(1); }
          $id = $projects->find_created_by_token($token);
          if ($id <= 0) { exit(1); }
          $verified = $projects->verify($id, $data, $token);
          if (is_wp_error($verified) || empty($verified["verified"])) { fwrite(STDERR, wp_json_encode($verified)); exit(1); }
          $record = $projects->inspect($id);
          if (is_wp_error($record) || "active" !== $record["project_status"] || $data["methods"] !== $record["methods"] || [$line] !== array_map("intval", $record["line_ids"])) { fwrite(STDERR, wp_json_encode($record)); exit(1); }

          $_GET = ["project_status"=>"active"];
          $query = eduardo_research_collection_query("projects", "en");
          $ids = array_map("intval", wp_list_pluck($query->posts, "ID"));
          if (! in_array($id, $ids, true)) { fwrite(STDERR, "Managed Project missing from public collection\n"); exit(1); }
          wp_reset_postdata(); $_GET = [];

          update_option("erm_ci_project_id", $id, false);
          update_option("erm_ci_project_snapshot", $applied["snapshot_id"], false);
          update_option("erm_ci_project_line", $line, false);
          ' --allow-root

      - name: Verify Project validation update and rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $projects = Eduardo_Research_Manager::projects();
          $executor = Eduardo_Research_Manager::executor();
          $id = (int) get_option("erm_ci_project_id", 0);

          $bad_status = $projects->build_creation_plan(["title"=>"Bad","project_status"=>"invented"]);
          if (! is_wp_error($bad_status) || "research_manager_unknown_project_status" !== $bad_status->get_error_code()) { exit(1); }
          $bad_url = $projects->build_creation_plan(["title"=>"Bad URL","project_url"=>"javascript:alert(1)"]);
          if (! is_wp_error($bad_url) || "research_manager_invalid_project_url" !== $bad_url->get_error_code()) { exit(1); }

          $es_line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea ES","post_name"=>"linea-es"]);
          update_post_meta($es_line, "_research_language", "es"); update_post_meta($es_line, "_research_evidence_status", "verified");
          $cross = $projects->build_update_plan($id, ["line_ids"=>[$es_line]], "Cross-language relation", ["evidence_confirmed"=>true,"evidence_reference"=>"CI"]);
          if (! is_wp_error($cross) || "research_manager_unverified_line_relation" !== $cross->get_error_code()) { exit(1); }
          wp_delete_post($es_line, true);

          $changes = [
              "project_status"=>"completed",
              "end_date"=>"2026-10-09",
              "partner"=>"CI Research Lab + Archive",
              "methods"=>["Design science","Controlled evaluation","Reproducibility review"],
          ];
          $blocked_plan = $projects->build_update_plan($id, $changes, "Complete project");
          if (is_wp_error($blocked_plan) || "evidence-required" !== $blocked_plan["risk"]) { exit(1); }
          $blocked = $executor->apply($blocked_plan);
          if (! is_wp_error($blocked) || "research_manager_evidence_required" !== $blocked->get_error_code()) { exit(1); }

          $plan = $projects->build_update_plan($id, $changes, "Complete project", ["evidence_confirmed"=>true,"evidence_reference"=>"CI completion evidence"]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message()); exit(1); }
          $verified = $projects->verify($id, $changes);
          if (is_wp_error($verified) || empty($verified["verified"])) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled)) { exit(1); }
          $restored = $projects->inspect($id);
          if ("active" !== $restored["project_status"] || "2026-12" !== $restored["end_date"] || "CI Research Lab" !== $restored["partner"]) { fwrite(STDERR, wp_json_encode($restored)); exit(1); }
          ' --allow-root

      - name: Verify Spanish Project routing and creation rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $projects = Eduardo_Research_Manager::projects();
          $executor = Eduardo_Research_Manager::executor();
          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea proyecto ES","post_name"=>"linea-proyecto-es"]);
          update_post_meta($line, "_research_language", "es"); update_post_meta($line, "_research_evidence_status", "verified");
          $plan = $projects->build_creation_plan([
              "title"=>"Proyecto de investigación CI","slug"=>"proyecto-investigacion-ci","language"=>"es","status"=>"publish",
              "project_status"=>"planning","question"=>"¿Cómo validar sistemas digitales reproducibles?","role"=>"Investigador principal",
              "start_date"=>"2026-10","methods"=>["Evaluación controlada"],"line_ids"=>[$line]
          ], "Crear proyecto español", ["evidence_confirmed"=>true,"evidence_reference"=>"Evidencia CI ES"]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { exit(1); }
          $id = $projects->find_created_by_token($token);
          $record = $projects->inspect($id);
          if (is_wp_error($record) || false === strpos((string) $record["url"], "/es/proyectos/")) { fwrite(STDERR, wp_json_encode($record)); exit(1); }
          if (is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }
          if ($projects->find_created_by_token($token) > 0) { exit(1); }
          wp_delete_post($line, true);

          $main_id = (int) get_option("erm_ci_project_id", 0);
          $main_snapshot = (string) get_option("erm_ci_project_snapshot", "");
          if ($main_id <= 0 || "" === $main_snapshot) { exit(1); }
          if (is_wp_error($executor->rollback($main_snapshot))) { exit(1); }
          if (get_post($main_id) instanceof WP_Post) { fwrite(STDERR, "Project creation rollback left resource behind\n"); exit(1); }
          $main_line = (int) get_option("erm_ci_project_line", 0);
          if ($main_line > 0) { wp_delete_post($main_line, true); }
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.6.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.6.0.zip
          unzip -t ../../dist/eduardo-research-manager-0.6.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.6.0
          path: dist/eduardo-research-manager-0.6.0.zip
          if-no-files-found: error
