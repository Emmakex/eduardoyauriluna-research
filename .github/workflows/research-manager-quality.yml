name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager plugin files
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=wordpress/plugins/eduardo-research-manager
          test -s "$PLUGIN/eduardo-research-manager.php"
          test -s "$PLUGIN/includes/class-research-manager-contract.php"
          test -s "$PLUGIN/includes/class-research-manager-diagnostics.php"
          test -s "$PLUGIN/includes/class-research-manager-plan.php"
          test -s "$PLUGIN/includes/class-research-manager-snapshots.php"
          test -s "$PLUGIN/includes/class-research-manager-executor.php"
          test -s "$PLUGIN/includes/class-research-manager-page-resource.php"
          test -s "$PLUGIN/includes/class-research-manager-insight-resource.php"
          test -s "$PLUGIN/includes/class-research-manager-admin.php"
          test -s "$PLUGIN/includes/class-research-manager.php"
          grep -F 'Version: 0.4.0' "$PLUGIN/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install clean WordPress and activate Manager without Research Theme
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://manager.test --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root

      - name: Verify Manager remains safe without Theme
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"])) { exit(1); }
          if ((int) $report["summary"]["fail"] < 1) { exit(1); }
          if ("configuration-required" !== (string) $report["next_actions"][0]["action"]) { exit(1); }
          ' --allow-root

      - name: Activate Research Theme and verify readiness
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $contract = Eduardo_Research_Manager::contract()->snapshot();
          if (empty($contract["compatible"]) || "research" !== $contract["preset_id"] || (int) $contract["preset_version"] < 4) { exit(1); }
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) {
              fwrite(STDERR, wp_json_encode($report) . "\n"); exit(1);
          }
          if (! Eduardo_Research_Manager::insights() instanceof Eduardo_Research_Manager_Insight_Resource) { exit(1); }
          ' --allow-root

      - name: Verify core mutation lifecycle and evidence gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $about = get_page_by_path("about");
          if (! $about instanceof WP_Post) { exit(1); }
          $key = "_eduardo_research_manager_test";
          delete_post_meta($about->ID, $key);
          $plan = Eduardo_Research_Manager_Plan::create("Reversible mutation", [["type"=>"post_meta","post_id"=>$about->ID,"key"=>$key,"value"=>"alpha"]]);
          if (is_wp_error($plan)) { exit(1); }
          $preview = Eduardo_Research_Manager::executor()->preview($plan);
          if (is_wp_error($preview) || empty($preview["apply_allowed"]) || metadata_exists("post", $about->ID, $key)) { exit(1); }
          $applied = Eduardo_Research_Manager::executor()->apply($plan);
          if (is_wp_error($applied) || "alpha" !== get_post_meta($about->ID, $key, true)) { exit(1); }
          $rolled = Eduardo_Research_Manager::executor()->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || metadata_exists("post", $about->ID, $key)) { exit(1); }

          $output = wp_insert_post(["post_type"=>"research_output","post_status"=>"draft","post_title"=>"Evidence fixture"]);
          $sensitive = Eduardo_Research_Manager_Plan::create("Set peer review", [["type"=>"post_meta","post_id"=>$output,"key"=>"_research_review_status","value"=>"peer_reviewed"]]);
          $blocked = Eduardo_Research_Manager::executor()->apply($sensitive);
          if (! is_wp_error($blocked) || "research_manager_evidence_required" !== $blocked->get_error_code()) { exit(1); }
          ' --allow-root

      - name: Verify Page hydration still works
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $pages = Eduardo_Research_Manager::pages();
          $executor = Eduardo_Research_Manager::executor();
          $about = get_page_by_path("about");
          delete_option("eduardo_research_surface_about");
          $requested = ["eyebrow"=>"Managed research profile","lead"=>"Managed structured lead.","sections"=>["Profile","Evidence"]];
          $plan = $pages->build_hydration_plan("about", "en", $requested);
          if (is_wp_error($plan)) { exit(1); }
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { exit(1); }
          $verified = $pages->verify_hydration("about", "en", $requested);
          if (is_wp_error($verified) || empty($verified["verified"])) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || false !== get_option("eduardo_research_surface_about", false)) { exit(1); }
          ' --allow-root

      - name: Verify Page creation and provenance rollback still work
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $pages = Eduardo_Research_Manager::pages();
          $executor = Eduardo_Research_Manager::executor();
          $contact = get_page_by_path("contact");
          if (! $contact instanceof WP_Post) { exit(1); }
          wp_delete_post($contact->ID, true);
          $plan = $pages->build_creation_plan("contact");
          if (is_wp_error($plan)) { exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $preview = $executor->preview($plan);
          if (is_wp_error($preview) || get_page_by_path("contact") instanceof WP_Post) { exit(1); }
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { exit(1); }
          $verified = $pages->verify_creation("contact", $token);
          if (is_wp_error($verified) || empty($verified["verified"])) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || get_page_by_path("contact") instanceof WP_Post) { exit(1); }
          ' --allow-root

      - name: Verify bounded English Insight creation and rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $insights = Eduardo_Research_Manager::insights();
          $executor = Eduardo_Research_Manager::executor();
          $data = [
              "title"=>"CI Research Note",
              "slug"=>"ci-research-note",
              "excerpt"=>"A bounded research-note excerpt.",
              "content"=>"<p>Structured editorial body managed inside the Theme-owned Insight shell.</p>",
              "language"=>"en",
              "insight_type"=>"research_note",
              "status"=>"draft",
          ];
          $plan = $insights->build_creation_plan($data, "Create bounded EN Insight");
          if (is_wp_error($plan) || "editorial-review" !== $plan["risk"]) { exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $preview = $executor->preview($plan);
          if (is_wp_error($preview) || empty($preview["apply_allowed"]) || 0 !== $insights->find_created_by_token($token)) { exit(1); }
          $applied = $executor->apply($plan);
          if (is_wp_error($applied) || empty($applied["snapshot_id"])) { exit(1); }
          $id = $insights->find_created_by_token($token);
          if ($id <= 0) { exit(1); }
          $verified = $insights->verify($id, $data, $token);
          if (is_wp_error($verified) || empty($verified["verified"])) { fwrite(STDERR, wp_json_encode($verified) . "\n"); exit(1); }
          $record = $insights->inspect($id);
          if (is_wp_error($record) || "draft" !== $record["status"] || ! str_contains($record["url"], "/insights/ci-research-note/")) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || null !== get_post($id)) { exit(1); }
          ' --allow-root

      - name: Verify published Spanish Insight localization and query isolation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $_GET = [];
          $insights = Eduardo_Research_Manager::insights();
          $executor = Eduardo_Research_Manager::executor();
          $data = [
              "title"=>"Nota metodológica CI",
              "slug"=>"nota-metodologica-ci",
              "excerpt"=>"Resumen metodológico de prueba.",
              "content"=>"<p>Contenido metodológico de integración.</p>",
              "language"=>"es",
              "insight_type"=>"method_note",
              "status"=>"publish",
          ];
          $plan = $insights->build_creation_plan($data);
          if (is_wp_error($plan)) { exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message() . "\n"); exit(1); }
          $id = $insights->find_created_by_token($token);
          $record = $insights->inspect($id);
          if (is_wp_error($record) || "es" !== $record["language"] || "method_note" !== $record["insight_type"] || ! str_contains($record["url"], "/es/notas/nota-metodologica-ci/")) { exit(1); }

          $es_query = eduardo_research_insight_query("es");
          $es_ids = wp_list_pluck($es_query->posts, "ID");
          if (! in_array($id, array_map("intval", $es_ids), true)) { fwrite(STDERR, "Spanish query did not include Spanish Insight\n"); exit(1); }
          $en_query = eduardo_research_insight_query("en");
          $en_ids = wp_list_pluck($en_query->posts, "ID");
          if (in_array($id, array_map("intval", $en_ids), true)) { fwrite(STDERR, "English query exposed Spanish Insight\n"); exit(1); }
          wp_reset_postdata();

          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || null !== get_post($id)) { exit(1); }
          ' --allow-root

      - name: Verify Insight update Apply Verify Rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $insights = Eduardo_Research_Manager::insights();
          $executor = Eduardo_Research_Manager::executor();
          $create = $insights->build_creation_plan([
              "title"=>"Working Insight",
              "slug"=>"working-insight-ci",
              "excerpt"=>"Initial excerpt",
              "content"=>"<p>Initial content.</p>",
              "language"=>"en",
              "insight_type"=>"working_note",
              "status"=>"draft",
          ]);
          if (is_wp_error($create)) { exit(1); }
          $token = (string) $create["actions"][0]["creation_token"];
          $created = $executor->apply($create);
          if (is_wp_error($created)) { exit(1); }
          $id = $insights->find_created_by_token($token);
          $changes = [
              "title"=>"Updated Working Insight",
              "excerpt"=>"Updated excerpt",
              "content"=>"<p>Updated <strong>bounded</strong> content.</p>",
              "language"=>"es",
              "insight_type"=>"commentary",
          ];
          $update = $insights->build_update_plan($id, $changes, "Update Insight editorial fields");
          if (is_wp_error($update) || "editorial-review" !== $update["risk"]) { fwrite(STDERR, is_wp_error($update) ? $update->get_error_message() : wp_json_encode($update)); exit(1); }
          $applied = $executor->apply($update);
          if (is_wp_error($applied)) { exit(1); }
          $verified = $insights->verify($id, $changes, $token);
          if (is_wp_error($verified) || empty($verified["verified"])) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled)) { exit(1); }
          $restored = $insights->inspect($id);
          if (is_wp_error($restored) || "Working Insight" !== $restored["title"] || "en" !== $restored["language"] || "working_note" !== $restored["insight_type"]) { exit(1); }
          $deleted = $executor->rollback($created["snapshot_id"]);
          if (is_wp_error($deleted) || null !== get_post($id)) { exit(1); }
          ' --allow-root

      - name: Verify Insight validation collision and provenance protection
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $insights = Eduardo_Research_Manager::insights();
          $executor = Eduardo_Research_Manager::executor();

          $bad_type = $insights->build_creation_plan(["title"=>"Bad Type","insight_type"=>"peer_reviewed_magic"]);
          if (! is_wp_error($bad_type) || "research_manager_unknown_insight_type" !== $bad_type->get_error_code()) { exit(1); }
          $bad_lang = $insights->build_creation_plan(["title"=>"Bad Language","language"=>"fr"]);
          if (! is_wp_error($bad_lang) || "research_manager_unknown_language" !== $bad_lang->get_error_code()) { exit(1); }
          $too_large = $insights->build_creation_plan(["title"=>"Too Large","content"=>str_repeat("x", 60001)]);
          if (! is_wp_error($too_large) || "research_manager_insight_content_too_large" !== $too_large->get_error_code()) { exit(1); }

          $foreign_id = wp_insert_post(["post_type"=>"post","post_status"=>"publish","post_title"=>"Foreign Insight","post_name"=>"collision-insight"]);
          $collision_plan = $insights->build_creation_plan(["title"=>"Collision Insight","slug"=>"collision-insight"]);
          if (is_wp_error($collision_plan)) { exit(1); }
          $collision = $executor->apply($collision_plan);
          if (! is_wp_error($collision) || "research_manager_insight_creation_conflict" !== $collision->get_error_code()) { exit(1); }
          if ((int) get_page_by_path("collision-insight", OBJECT, "post")->ID !== (int) $foreign_id) { exit(1); }
          wp_delete_post($foreign_id, true);

          $plan = $insights->build_creation_plan(["title"=>"Protected Insight","slug"=>"protected-insight"]);
          if (is_wp_error($plan)) { exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { exit(1); }
          $id = $insights->find_created_by_token($token);
          update_post_meta($id, "_eduardo_research_manager_creation_token", "foreign-owner-token");
          $protected = $executor->rollback($applied["snapshot_id"]);
          if (! is_wp_error($protected) || "research_manager_insight_rollback_conflict" !== $protected->get_error_code() || null === get_post($id)) { exit(1); }
          update_post_meta($id, "_eduardo_research_manager_creation_token", $token);
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || null !== get_post($id)) { exit(1); }
          ' --allow-root

      - name: Verify Home Page creation still restores routing
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $pages = Eduardo_Research_Manager::pages();
          $executor = Eduardo_Research_Manager::executor();
          $home = get_page_by_path("home");
          if (! $home instanceof WP_Post) { exit(1); }
          wp_delete_post($home->ID, true);
          $before_show = (string) get_option("show_on_front", "posts");
          $before_front = (int) get_option("page_on_front", 0);
          $plan = $pages->build_creation_plan("home");
          if (is_wp_error($plan)) { exit(1); }
          $applied = $executor->apply($plan);
          if (is_wp_error($applied)) { exit(1); }
          $rolled = $executor->rollback($applied["snapshot_id"]);
          if (is_wp_error($rolled) || get_page_by_path("home") instanceof WP_Post) { exit(1); }
          if ($before_show !== (string) get_option("show_on_front", "posts") || $before_front !== (int) get_option("page_on_front", 0)) { exit(1); }
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.4.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.4.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.4.0
          path: dist/eduardo-research-manager-0.4.0.zip
          if-no-files-found: error
