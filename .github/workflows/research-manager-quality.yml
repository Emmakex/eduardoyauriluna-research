name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager files and version
        shell: bash
        run: |
          set -euo pipefail
          P=wordpress/plugins/eduardo-research-manager
          for f in \
            eduardo-research-manager.php \
            includes/class-research-manager-contract.php \
            includes/class-research-manager-diagnostics.php \
            includes/class-research-manager-plan.php \
            includes/class-research-manager-snapshots.php \
            includes/class-research-manager-executor.php \
            includes/class-research-manager-page-resource.php \
            includes/class-research-manager-insight-resource.php \
            includes/class-research-manager-output-resource.php \
            includes/class-research-manager-project-resource.php \
            includes/class-research-manager-software-resource.php \
            includes/class-research-manager-dataset-resource.php \
            includes/class-research-manager-rendered-verifier.php \
            includes/class-research-manager-admin.php \
            includes/class-research-manager.php; do
            test -s "$P/$f"
          done
          grep -F 'Version: 0.9.0' "$P/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install WordPress and activate Manager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"]) || (int) $report["summary"]["fail"] < 1) { exit(1); }
          ' --allow-root

      - name: Activate Theme and verify all services
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) { fwrite(STDERR, wp_json_encode($report)); exit(1); }
          if (! Eduardo_Research_Manager::rendered() instanceof Eduardo_Research_Manager_Rendered_Verifier) { exit(1); }
          foreach ([Eduardo_Research_Manager::outputs(),Eduardo_Research_Manager::projects(),Eduardo_Research_Manager::software(),Eduardo_Research_Manager::datasets()] as $service) {
              if (! is_object($service)) { exit(1); }
          }
          ' --allow-root

      - name: Seed rendered fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $executor = Eduardo_Research_Manager::executor();
          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Rendered Verification Line","post_name"=>"rendered-verification-line"]);
          update_post_meta($line, "_research_language", "en"); update_post_meta($line, "_research_evidence_status", "verified");
          $ctx = ["evidence_confirmed"=>true,"evidence_reference"=>"CI rendered evidence"];

          $output_plan = Eduardo_Research_Manager::outputs()->build_creation_plan([
              "title"=>"Rendered Verified Publication","slug"=>"rendered-verified-publication","status"=>"publish",
              "output_type"=>"journal_article","review_status"=>"peer_reviewed","publication_date"=>"2026-10-09",
              "doi"=>"10.1234/rendered.output.1","line_ids"=>[$line]
          ], "Rendered output", $ctx);
          $out_apply = $executor->apply($output_plan); if (is_wp_error($out_apply)) { fwrite(STDERR, $out_apply->get_error_message()); exit(1); }
          $out_id = Eduardo_Research_Manager::outputs()->find_created_by_token((string) $output_plan["actions"][0]["creation_token"]);

          $dataset_plan = Eduardo_Research_Manager::datasets()->build_creation_plan([
              "title"=>"Rendered Dataset","slug"=>"rendered-dataset","status"=>"publish","version"=>"1.0",
              "publication_date"=>"2026-10-09","repository"=>"http://127.0.0.1:8080/dataset-repository/","doi"=>"10.1234/rendered.dataset.1",
              "license"=>"CC BY 4.0","access_level"=>"open","formats"=>["CSV"],"line_ids"=>[$line]
          ], "Rendered dataset", $ctx);
          $data_apply = $executor->apply($dataset_plan); if (is_wp_error($data_apply)) { fwrite(STDERR, $data_apply->get_error_message()); exit(1); }
          $data_id = Eduardo_Research_Manager::datasets()->find_created_by_token((string) $dataset_plan["actions"][0]["creation_token"]);

          $software_plan = Eduardo_Research_Manager::software()->build_creation_plan([
              "title"=>"Rendered Software","slug"=>"rendered-software","status"=>"publish","software_status"=>"active","version"=>"1.0.0",
              "repository_url"=>"http://127.0.0.1:8080/software-repository/","line_ids"=>[$line]
          ], "Rendered software", $ctx);
          $sw_apply = $executor->apply($software_plan); if (is_wp_error($sw_apply)) { exit(1); }
          $sw_id = Eduardo_Research_Manager::software()->find_created_by_token((string) $software_plan["actions"][0]["creation_token"]);

          $private = wp_insert_post(["post_type"=>"research_output","post_status"=>"publish","post_title"=>"Private Evidence Gate Fixture","post_name"=>"private-evidence-gate-fixture"]);
          update_post_meta($private, "_research_language", "en");
          update_post_meta($private, "_research_doi", "10.9999/private.render.leak");
          update_post_meta($private, "_research_doi_verified", "0");
          update_post_meta($private, "_research_review_status", "secret_review_state");
          update_post_meta($private, "_research_review_status_verified", "0");
          update_post_meta($private, "_research_output_type", "journal_article");
          update_post_meta($private, "_research_output_type_verified", "0");

          update_option("erm_render_line", $line, false);
          update_option("erm_render_output", $out_id, false);
          update_option("erm_render_dataset", $data_id, false);
          update_option("erm_render_software", $sw_id, false);
          update_option("erm_render_private", $private, false);
          ' --allow-root

      - name: Start public WordPress server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp server --host=127.0.0.1 --port=8080 --allow-root > /tmp/research-manager-server.log 2>&1 &
          echo $! > /tmp/research-manager-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/research-manager-server.log
          exit 1

      - name: Verify rendered Pages EN ES
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          $rendered = Eduardo_Research_Manager::rendered();
          $home = $rendered->verify_page("home", "en", ["Research profile"]);
          if (is_wp_error($home) || empty($home["verified"])) { fwrite(STDERR, is_wp_error($home) ? $home->get_error_message() : wp_json_encode($home["checks"])); exit(1); }
          $research = $rendered->verify_page("research", "es", ["Investigación"]);
          if (is_wp_error($research) || empty($research["verified"])) { fwrite(STDERR, is_wp_error($research) ? $research->get_error_message() : wp_json_encode($research["checks"])); exit(1); }
          if (empty($research["checks"]["hreflang_en"]) || empty($research["checks"]["hreflang_es"]) || empty($research["checks"]["hreflang_x_default"])) { exit(1); }
          ' --allow-root

      - name: Verify rendered research objects and evidence non-leak
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          $rendered = Eduardo_Research_Manager::rendered();
          $output = $rendered->verify_record((int) get_option("erm_render_output"), ["10.1234/rendered.output.1"]);
          if (is_wp_error($output) || empty($output["verified"]) || "ScholarlyArticle" !== $output["expected_schema_type"]) { fwrite(STDERR, is_wp_error($output) ? $output->get_error_message() : wp_json_encode($output)); exit(1); }
          $dataset = $rendered->verify_record((int) get_option("erm_render_dataset"), ["10.1234/rendered.dataset.1"]);
          if (is_wp_error($dataset) || empty($dataset["verified"]) || "Dataset" !== $dataset["expected_schema_type"]) { fwrite(STDERR, is_wp_error($dataset) ? $dataset->get_error_message() : wp_json_encode($dataset)); exit(1); }
          $software = $rendered->verify_record((int) get_option("erm_render_software"));
          if (is_wp_error($software) || empty($software["verified"]) || "SoftwareSourceCode" !== $software["expected_schema_type"]) { exit(1); }
          $private = $rendered->verify_record((int) get_option("erm_render_private"));
          if (is_wp_error($private) || empty($private["verified"]) || "CreativeWork" !== $private["expected_schema_type"]) { fwrite(STDERR, is_wp_error($private) ? $private->get_error_message() : wp_json_encode($private)); exit(1); }
          foreach ($private["checks"] as $key => $value) { if (str_starts_with($key, "forbidden_") && ! $value) { fwrite(STDERR, "Private evidence leaked: $key\n"); exit(1); } }
          ' --allow-root

      - name: Verify rendered Spanish Dataset route
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea Render ES","post_name"=>"linea-render-es"]);
          update_post_meta($line, "_research_language", "es"); update_post_meta($line, "_research_evidence_status", "verified");
          $plan = Eduardo_Research_Manager::datasets()->build_creation_plan([
              "title"=>"Datos renderizados ES","slug"=>"datos-renderizados-es","language"=>"es","status"=>"publish","access_level"=>"open","formats"=>["CSV"],"line_ids"=>[$line]
          ], "Dataset ES rendered", ["evidence_confirmed"=>true,"evidence_reference"=>"CI ES rendered evidence"]);
          $applied = Eduardo_Research_Manager::executor()->apply($plan); if (is_wp_error($applied)) { exit(1); }
          $id = Eduardo_Research_Manager::datasets()->find_created_by_token((string) $plan["actions"][0]["creation_token"]);
          $check = Eduardo_Research_Manager::rendered()->verify_record($id);
          if (is_wp_error($check) || empty($check["verified"]) || false === strpos((string) $check["url"], "/es/datos/")) { fwrite(STDERR, is_wp_error($check) ? $check->get_error_message() : wp_json_encode($check)); exit(1); }
          if (is_wp_error(Eduardo_Research_Manager::executor()->rollback($applied["snapshot_id"]))) { exit(1); }
          wp_delete_post($line, true);
          ' --allow-root

      - name: Stop public server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/research-manager-server.pid; then kill "$(cat /tmp/research-manager-server.pid)" || true; fi

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.9.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.9.0.zip
          unzip -t ../../dist/eduardo-research-manager-0.9.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.9.0
          path: dist/eduardo-research-manager-0.9.0.zip
          if-no-files-found: error
