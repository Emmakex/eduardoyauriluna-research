name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager files and version
        shell: bash
        run: |
          set -euo pipefail
          P=wordpress/plugins/eduardo-research-manager
          for f in \
            eduardo-research-manager.php \
            includes/class-research-manager-contract.php \
            includes/class-research-manager-diagnostics.php \
            includes/class-research-manager-plan.php \
            includes/class-research-manager-snapshots.php \
            includes/class-research-manager-executor.php \
            includes/class-research-manager-page-resource.php \
            includes/class-research-manager-insight-resource.php \
            includes/class-research-manager-output-resource.php \
            includes/class-research-manager-project-resource.php \
            includes/class-research-manager-software-resource.php \
            includes/class-research-manager-dataset-resource.php \
            includes/class-research-manager-frontend-verifier.php \
            includes/class-research-manager-admin.php \
            includes/class-research-manager.php; do
            test -s "$P/$f"
          done
          grep -F 'Version: 0.9.0' "$P/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install clean WordPress and verify Manager contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"]) || (int) $report["summary"]["fail"] < 1) { exit(1); }
          ' --allow-root
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) { fwrite(STDERR, wp_json_encode($report)); exit(1); }
          if (! Eduardo_Research_Manager::frontend() instanceof Eduardo_Research_Manager_Frontend_Verifier) { exit(1); }
          ' --allow-root

      - name: Regression gate mutation services and create HTTP fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $executor = Eduardo_Research_Manager::executor();
          $page = Eduardo_Research_Manager::pages()->build_hydration_plan("about", "en", ["eyebrow"=>"Frontend verification regression"]);
          $page_apply = $executor->apply($page);
          if (is_wp_error($page_apply) || is_wp_error($executor->rollback($page_apply["snapshot_id"]))) { exit(1); }

          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Rendered Verification Line","post_name"=>"rendered-verification-line"]);
          update_post_meta($line, "_research_language", "en");
          update_post_meta($line, "_research_evidence_status", "verified");
          $ctx = ["evidence_confirmed"=>true,"evidence_reference"=>"CI rendered frontend evidence"];

          $plans = [
              "output"=>Eduardo_Research_Manager::outputs()->build_creation_plan([
                  "title"=>"Rendered Technical Report","slug"=>"rendered-technical-report","status"=>"publish","output_type"=>"technical_report",
                  "review_status"=>"technical_output","publication_date"=>"2026-10-09","line_ids"=>[$line]
              ], "Create rendered output", $ctx),
              "project"=>Eduardo_Research_Manager::projects()->build_creation_plan([
                  "title"=>"Rendered Research Project","slug"=>"rendered-research-project","status"=>"publish","project_status"=>"active","line_ids"=>[$line]
              ], "Create rendered project", $ctx),
              "software"=>Eduardo_Research_Manager::software()->build_creation_plan([
                  "title"=>"Rendered Research Software","slug"=>"rendered-research-software","status"=>"publish","software_status"=>"active","version"=>"1.0.0","line_ids"=>[$line]
              ], "Create rendered software", $ctx),
              "dataset"=>Eduardo_Research_Manager::datasets()->build_creation_plan([
                  "title"=>"Rendered Research Dataset","slug"=>"rendered-research-dataset","status"=>"publish","version"=>"1.0",
                  "publication_date"=>"2026-10-09","access_level"=>"open","formats"=>["CSV"],"line_ids"=>[$line]
              ], "Create rendered dataset", $ctx),
          ];
          $ids = [];
          foreach ($plans as $key=>$plan) {
              if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
              $token = (string) $plan["actions"][0]["creation_token"];
              $applied = $executor->apply($plan);
              if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message()); exit(1); }
              $service = "output" === $key ? Eduardo_Research_Manager::outputs() : ("project" === $key ? Eduardo_Research_Manager::projects() : ("software" === $key ? Eduardo_Research_Manager::software() : Eduardo_Research_Manager::datasets()));
              $id = $service->find_created_by_token($token);
              if ($id <= 0) { exit(1); }
              $ids[$key] = $id;
          }

          $insight_plan = Eduardo_Research_Manager::insights()->build_creation_plan([
              "title"=>"Rendered Insight","slug"=>"rendered-insight","status"=>"publish","content"=>"<p>Rendered verification editorial fixture.</p>"
          ]);
          $insight_apply = $executor->apply($insight_plan);
          if (is_wp_error($insight_apply)) { exit(1); }
          $ids["insight"] = Eduardo_Research_Manager::insights()->find_created_by_token((string) $insight_plan["actions"][0]["creation_token"]);

          $es_line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea verificación renderizada","post_name"=>"linea-verificacion-renderizada"]);
          update_post_meta($es_line, "_research_language", "es"); update_post_meta($es_line, "_research_evidence_status", "verified");
          $es_plan = Eduardo_Research_Manager::datasets()->build_creation_plan([
              "title"=>"Datos renderizados ES","slug"=>"datos-renderizados-es","language"=>"es","status"=>"publish","version"=>"1.0",
              "publication_date"=>"2026-10","access_level"=>"open","formats"=>["CSV"],"line_ids"=>[$es_line]
          ], "Crear dataset renderizado ES", ["evidence_confirmed"=>true,"evidence_reference"=>"CI evidencia ES"]);
          if (is_wp_error($es_plan)) { exit(1); }
          $es_apply = $executor->apply($es_plan); if (is_wp_error($es_apply)) { exit(1); }
          $ids["dataset_es"] = Eduardo_Research_Manager::datasets()->find_created_by_token((string) $es_plan["actions"][0]["creation_token"]);

          foreach ($ids as $key=>$id) { update_option("erm_frontend_" . $key, (int) $id, false); }
          update_option("erm_frontend_line", (int) $line, false); update_option("erm_frontend_line_es", (int) $es_line, false);
          ' --allow-root

      - name: Verify real rendered frontend over HTTP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          php -S 127.0.0.1:8080 -t /tmp/research-manager-wp /tmp/research-manager-wp/index.php >/tmp/research-manager-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/research-manager-http.log; exit 1; fi

          wp eval '
          $frontend = Eduardo_Research_Manager::frontend();
          foreach ([["research","en"],["research","es"],["datasets","en"],["datasets","es"]] as [$surface,$language]) {
              $result = $frontend->verify_surface($surface, $language);
              if (is_wp_error($result) || empty($result["verified"])) { fwrite(STDERR, wp_json_encode($result)); exit(1); }
          }
          $resources = ["output","project","software","dataset","insight","dataset_es"];
          foreach ($resources as $key) {
              $id = (int) get_option("erm_frontend_" . $key, 0);
              $result = $frontend->verify_resource($id);
              if (is_wp_error($result) || empty($result["verified"])) { fwrite(STDERR, $key . ":" . wp_json_encode($result)); exit(1); }
              if (200 !== (int) $result["status"] || empty($result["checks"]["canonical_matches"]) || empty($result["checks"]["indexable"])) { exit(1); }
          }
          $dataset_es = $frontend->verify_resource((int) get_option("erm_frontend_dataset_es", 0));
          if (is_wp_error($dataset_es) || false === strpos((string) $dataset_es["url"], "/es/datos/")) { exit(1); }
          $blocked = $frontend->verify_url("https://example.com/");
          if (! is_wp_error($blocked) || "research_manager_frontend_url_not_allowed" !== $blocked->get_error_code()) { exit(1); }
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.9.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.9.0.zip
          unzip -t ../../dist/eduardo-research-manager-0.9.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.9.0
          path: dist/eduardo-research-manager-0.9.0.zip
          if-no-files-found: error
