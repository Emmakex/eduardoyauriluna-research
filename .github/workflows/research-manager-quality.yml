name: Research Manager Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-manager-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Manager files and version
        shell: bash
        run: |
          set -euo pipefail
          P=wordpress/plugins/eduardo-research-manager
          for f in \
            eduardo-research-manager.php \
            includes/class-research-manager-contract.php \
            includes/class-research-manager-diagnostics.php \
            includes/class-research-manager-plan.php \
            includes/class-research-manager-snapshots.php \
            includes/class-research-manager-executor.php \
            includes/class-research-manager-page-resource.php \
            includes/class-research-manager-insight-resource.php \
            includes/class-research-manager-output-resource.php \
            includes/class-research-manager-project-resource.php \
            includes/class-research-manager-software-resource.php \
            includes/class-research-manager-admin.php \
            includes/class-research-manager.php; do
            test -s "$P/$f"
          done
          grep -F 'Version: 0.7.0' "$P/eduardo-research-manager.php"
      - name: Lint Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -name '*.php' -print0 | xargs -0 -n1 php -l

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Install clean WordPress and activate Manager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-wp
          mkdir -p /tmp/research-manager-wp
          cd /tmp/research-manager-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://manager.test --title='Research Manager Test' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp plugin activate eduardo-research-manager --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (! empty($report["ready"]) || (int) $report["summary"]["fail"] < 1) { exit(1); }
          ' --allow-root

      - name: Activate Research Theme and verify service contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
          wp eval '
          $report = Eduardo_Research_Manager::diagnostics()->run();
          if (empty($report["ready"]) || (int) $report["summary"]["fail"] !== 0) { fwrite(STDERR, wp_json_encode($report)); exit(1); }
          foreach ([
              Eduardo_Research_Manager::pages(), Eduardo_Research_Manager::insights(), Eduardo_Research_Manager::outputs(),
              Eduardo_Research_Manager::projects(), Eduardo_Research_Manager::software()
          ] as $service) { if (! is_object($service)) { exit(1); } }
          ' --allow-root

      - name: Compact regression gate for previous resources
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $executor = Eduardo_Research_Manager::executor();
          $page = Eduardo_Research_Manager::pages()->build_hydration_plan("about", "en", ["eyebrow"=>"Regression profile"]);
          $applied = $executor->apply($page); if (is_wp_error($applied) || is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }

          $insight = Eduardo_Research_Manager::insights()->build_creation_plan(["title"=>"Regression Insight","slug"=>"regression-insight","content"=>"<p>Regression.</p>","status"=>"publish"]);
          $applied = $executor->apply($insight); if (is_wp_error($applied) || is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }

          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Regression Line","post_name"=>"regression-line"]);
          update_post_meta($line, "_research_language", "en"); update_post_meta($line, "_research_evidence_status", "verified");
          $ctx = ["evidence_confirmed"=>true,"evidence_reference"=>"CI regression evidence"];
          $output = Eduardo_Research_Manager::outputs()->build_creation_plan(["title"=>"Regression Output","slug"=>"regression-output","status"=>"publish","output_type"=>"technical_report","review_status"=>"technical_output","publication_date"=>"2026","line_ids"=>[$line]], "Regression output", $ctx);
          $applied = $executor->apply($output); if (is_wp_error($applied) || is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }
          $project = Eduardo_Research_Manager::projects()->build_creation_plan(["title"=>"Regression Project","slug"=>"regression-project","status"=>"publish","project_status"=>"active","line_ids"=>[$line]], "Regression project", $ctx);
          $applied = $executor->apply($project); if (is_wp_error($applied) || is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }
          wp_delete_post($line, true);
          ' --allow-root

      - name: Verify evidence-gated Research Software creation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1); $_GET = [];
          $software = Eduardo_Research_Manager::software(); $executor = Eduardo_Research_Manager::executor();
          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Verified Software Line","post_name"=>"verified-software-line"]);
          update_post_meta($line, "_research_language", "en"); update_post_meta($line, "_research_evidence_status", "verified");
          $data = [
              "title"=>"Reproducible Research Toolkit","slug"=>"reproducible-research-toolkit","excerpt"=>"Evidence-backed software fixture.",
              "content"=>"<p>Research software narrative.</p>","language"=>"en","status"=>"publish","software_status"=>"active",
              "version"=>"1.2.0","release_date"=>"2026-10-09","repository_url"=>"https://github.com/example/research-toolkit",
              "archive_url"=>"https://example.test/releases/1.2.0","license"=>"MIT","documentation_url"=>"https://example.test/docs",
              "doi"=>"https://doi.org/10.1234/software.2026.1","programming_languages"=>["PHP","Python"],"line_ids"=>[$line]
          ];
          $blocked_plan = $software->build_creation_plan($data, "Preview Research Software");
          if (is_wp_error($blocked_plan) || "evidence-required" !== $blocked_plan["risk"]) { exit(1); }
          $preview = $executor->preview($blocked_plan); if (is_wp_error($preview) || ! empty($preview["apply_allowed"])) { exit(1); }
          $blocked = $executor->apply($blocked_plan); if (! is_wp_error($blocked) || "research_manager_evidence_required" !== $blocked->get_error_code()) { exit(1); }

          $plan = $software->build_creation_plan($data, "Create verified Research Software", ["evidence_confirmed"=>true,"evidence_reference"=>"CI software release + repository evidence"]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan); if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message()); exit(1); }
          $id = $software->find_created_by_token($token); if ($id <= 0) { exit(1); }
          $verified = $software->verify($id, $data, $token); if (is_wp_error($verified) || empty($verified["verified"])) { fwrite(STDERR, wp_json_encode($verified)); exit(1); }
          $record = $software->inspect($id);
          if ("10.1234/software.2026.1" !== $record["doi"] || "1" !== $record["doi_verified"] || ["PHP","Python"] !== $record["programming_languages"]) { fwrite(STDERR, wp_json_encode($record)); exit(1); }

          $_GET = ["software_status"=>"active"];
          $query = eduardo_research_collection_query("software", "en");
          $ids = array_map("intval", wp_list_pluck($query->posts, "ID")); wp_reset_postdata(); $_GET = [];
          if (! in_array($id, $ids, true)) { fwrite(STDERR, "Managed software missing from public collection\n"); exit(1); }
          update_option("erm_ci_software_id", $id, false); update_option("erm_ci_software_snapshot", $applied["snapshot_id"], false); update_option("erm_ci_software_line", $line, false);
          ' --allow-root

      - name: Verify Software validation update and rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $software = Eduardo_Research_Manager::software(); $executor = Eduardo_Research_Manager::executor(); $id = (int) get_option("erm_ci_software_id", 0);
          $bad_status = $software->build_creation_plan(["title"=>"Bad","software_status"=>"invented"]);
          if (! is_wp_error($bad_status) || "research_manager_unknown_software_status" !== $bad_status->get_error_code()) { exit(1); }
          $bad_url = $software->build_creation_plan(["title"=>"Bad URL","repository_url"=>"javascript:alert(1)"]);
          if (! is_wp_error($bad_url) || "research_manager_invalid_software_url" !== $bad_url->get_error_code()) { exit(1); }
          $bad_doi = $software->build_creation_plan(["title"=>"Bad DOI","doi"=>"not-a-doi"]);
          if (! is_wp_error($bad_doi) || "research_manager_invalid_doi" !== $bad_doi->get_error_code()) { exit(1); }

          $es_line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea Software ES","post_name"=>"linea-software-es"]);
          update_post_meta($es_line, "_research_language", "es"); update_post_meta($es_line, "_research_evidence_status", "verified");
          $cross = $software->build_update_plan($id, ["line_ids"=>[$es_line]], "Cross-language software relation", ["evidence_confirmed"=>true,"evidence_reference"=>"CI"]);
          if (! is_wp_error($cross) || "research_manager_unverified_line_relation" !== $cross->get_error_code()) { exit(1); }
          wp_delete_post($es_line, true);

          $changes = ["software_status"=>"maintained","version"=>"1.3.0","release_date"=>"2026-10-10","programming_languages"=>["PHP","Python","TypeScript"],"doi"=>"10.1234/software.2026.2"];
          $blocked_plan = $software->build_update_plan($id, $changes, "Release software 1.3");
          if (is_wp_error($blocked_plan) || "evidence-required" !== $blocked_plan["risk"]) { exit(1); }
          $blocked = $executor->apply($blocked_plan); if (! is_wp_error($blocked) || "research_manager_evidence_required" !== $blocked->get_error_code()) { exit(1); }
          $plan = $software->build_update_plan($id, $changes, "Release software 1.3", ["evidence_confirmed"=>true,"evidence_reference"=>"CI software 1.3 release evidence"]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $applied = $executor->apply($plan); if (is_wp_error($applied)) { fwrite(STDERR, $applied->get_error_message()); exit(1); }
          $verified = $software->verify($id, $changes); if (is_wp_error($verified) || empty($verified["verified"])) { exit(1); }
          if (is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }
          $restored = $software->inspect($id);
          if ("active" !== $restored["software_status"] || "1.2.0" !== $restored["version"] || "10.1234/software.2026.1" !== $restored["doi"]) { fwrite(STDERR, wp_json_encode($restored)); exit(1); }
          ' --allow-root

      - name: Verify Spanish Software route and creation rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-wp
          wp eval '
          wp_set_current_user(1);
          $software = Eduardo_Research_Manager::software(); $executor = Eduardo_Research_Manager::executor();
          $line = wp_insert_post(["post_type"=>"research_line","post_status"=>"publish","post_title"=>"Línea Software Español","post_name"=>"linea-software-espanol"]);
          update_post_meta($line, "_research_language", "es"); update_post_meta($line, "_research_evidence_status", "verified");
          $plan = $software->build_creation_plan([
              "title"=>"Herramienta de investigación CI","slug"=>"herramienta-investigacion-ci","language"=>"es","status"=>"publish",
              "software_status"=>"experimental","version"=>"0.1.0","release_date"=>"2026-10","repository_url"=>"https://example.test/repos/herramienta",
              "license"=>"MIT","programming_languages"=>["Python"],"line_ids"=>[$line]
          ], "Crear software español", ["evidence_confirmed"=>true,"evidence_reference"=>"Evidencia CI Software ES"]);
          if (is_wp_error($plan)) { fwrite(STDERR, $plan->get_error_message()); exit(1); }
          $token = (string) $plan["actions"][0]["creation_token"];
          $applied = $executor->apply($plan); if (is_wp_error($applied)) { exit(1); }
          $id = $software->find_created_by_token($token); $record = $software->inspect($id);
          if (is_wp_error($record) || false === strpos((string) $record["url"], "/es/software/")) { fwrite(STDERR, wp_json_encode($record)); exit(1); }
          if (is_wp_error($executor->rollback($applied["snapshot_id"]))) { exit(1); }
          if ($software->find_created_by_token($token) > 0) { exit(1); }
          wp_delete_post($line, true);

          $main_id = (int) get_option("erm_ci_software_id", 0); $main_snapshot = (string) get_option("erm_ci_software_snapshot", "");
          if ($main_id <= 0 || "" === $main_snapshot || is_wp_error($executor->rollback($main_snapshot))) { exit(1); }
          if (get_post($main_id) instanceof WP_Post) { fwrite(STDERR, "Software creation rollback left resource behind\n"); exit(1); }
          $main_line = (int) get_option("erm_ci_software_line", 0); if ($main_line > 0) { wp_delete_post($main_line, true); }
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -r ../../dist/eduardo-research-manager-0.7.0.zip eduardo-research-manager -x '*/.DS_Store' '*.map'
          test -s ../../dist/eduardo-research-manager-0.7.0.zip
          unzip -t ../../dist/eduardo-research-manager-0.7.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-manager-0.7.0
          path: dist/eduardo-research-manager-0.7.0.zip
          if-no-files-found: error
