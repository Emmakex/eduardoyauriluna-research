name: Research Manager Remote Media Diagnostics Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-diagnostics.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-assignment-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-rest.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-metadata-operations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-metadata-rest.php'
      - '.github/scripts/test-remote-media-diagnostics.php'
      - '.github/workflows/research-manager-remote-media-diagnostics-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-diagnostics.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-assignment-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-rest.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-metadata-operations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-metadata-rest.php'
      - '.github/scripts/test-remote-media-diagnostics.php'
      - '.github/workflows/research-manager-remote-media-diagnostics-quality.yml'

permissions:
  contents: read

concurrency:
  group: p3-media-diagnostics-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-media-diagnostics:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Ensure WP-CLI
        shell: bash
        run: bash .github/scripts/ensure-wp-cli.sh

      - name: Lint P3.4 Media diagnostics
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-media-diagnostics.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-media-rest.php
          php -l .github/scripts/test-remote-media-diagnostics.php

      - name: Install clean Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-remote-media-diagnostics
          mkdir -p /tmp/research-manager-remote-media-diagnostics
          cd /tmp/research-manager-remote-media-diagnostics
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set WP_ENVIRONMENT_TYPE development --type=constant --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Manager Remote Media Diagnostics' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Verify bounded Media diagnostics and safe remediation delegation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-manager-remote-media-diagnostics
          wp eval-file "$GITHUB_WORKSPACE/.github/scripts/test-remote-media-diagnostics.php" --allow-root
