name: Hola Mundo Live Publish

on:
  push:
    branches: [main]
    paths:
      - 'ops/hola-mundo-live-publish.json'

permissions:
  contents: write

concurrency:
  group: phase2d-command-gateway
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase2d-production
    env:
      PHASE2D_MCP_BASE_URL: https://mcp.kairoseth.com/mcp
      PHASE2D_GATEWAY_GENERATION: phase2d-v2-20261019

    steps:
      - uses: actions/checkout@v4

      - name: Self-test exact publication helper
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hola-mundo-live-publish.py --self-test

      - name: Verify dedicated principal tenant isolation
        shell: bash
        env:
          PHASE2D_MCP_TOKEN: ${{ format('{0}.phase2d-v2-20261019', secrets.PHASE2D_MCP_TOKEN) }}
        run: |
          set -euo pipefail
          python3 scripts/phase2e-command-guard.py isolation --tenant eduardo-research

      - name: Publish exact Hola mundo Insight
        shell: bash
        env:
          PHASE2D_MCP_TOKEN: ${{ format('{0}.phase2d-v2-20261019', secrets.PHASE2D_MCP_TOKEN) }}
        run: |
          set -euo pipefail
          python3 scripts/hola-mundo-live-publish.py \
            --request ops/hola-mundo-live-publish.json \
            --evidence commands/phase2d/results/cmd-hola-mundo-publish-0001.json

      - name: Persist sanitized publication evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='commands/phase2d/results/cmd-hola-mundo-publish-0001.json'
          test -f "$evidence"
          cp "$evidence" /tmp/hola-mundo-publication.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$evidence")"
          cp /tmp/hola-mundo-publication.json "$evidence"
          git config user.name 'kairoseth-command-gateway[bot]'
          git config user.email 'kairoseth-command-gateway[bot]@users.noreply.github.com'
          git add "$evidence"
          if git diff --cached --quiet; then
            echo 'Publication evidence already persisted'
            exit 0
          fi
          git commit -m 'test: record Hola mundo publication evidence'
          git push origin HEAD:main
