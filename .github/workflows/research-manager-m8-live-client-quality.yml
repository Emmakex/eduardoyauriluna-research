name: Research Manager M8 Live Client Quality

on:
  push:
    paths:
      - 'scripts/m8-manager-client.php'
      - 'config/m8-live-acceptance.example.json'
      - 'docs/44-m8-live-site-acceptance.md'
      - '.github/workflows/research-manager-m8-live-client-quality.yml'
  pull_request:
    paths:
      - 'scripts/m8-manager-client.php'
      - 'config/m8-live-acceptance.example.json'
      - 'docs/44-m8-live-site-acceptance.md'
      - '.github/workflows/research-manager-m8-live-client-quality.yml'

jobs:
  m8-live-client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
      - name: Lint M8 client
        run: php -l scripts/m8-manager-client.php
      - name: Validate M8 client contract
        run: php scripts/m8-manager-client.php contract --config=config/m8-live-acceptance.example.json
      - name: Assert example config contains no credential
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'erm1_[0-9a-f]{16,}|"(token|authorization|password|secret)"[[:space:]]*:' config/m8-live-acceptance.example.json; then
            echo 'Secret-like material found in M8 example config.' >&2
            exit 1
          fi
      - name: Assert live evidence remains ignored
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore -q tmp/m8-live-acceptance-example.json
