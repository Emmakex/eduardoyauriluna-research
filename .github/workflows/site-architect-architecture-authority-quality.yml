name: Site Architect Architecture Authority Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-plan.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-resource-registry.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-object-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-output-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-project-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-software-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-dataset-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-v1-capabilities.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-relations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-hydrator.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-translation-pairing.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-contract.php'
      - '.github/workflows/site-architect-architecture-authority-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-plan.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-resource-registry.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-object-editor.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-output-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-project-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-software-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-dataset-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-v1-capabilities.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-relations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-hydrator.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-translation-pairing.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-contract.php'
      - '.github/workflows/site-architect-architecture-authority-quality.yml'

permissions:
  contents: read

jobs:
  authority-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Site Architect authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('wordpress/plugins/eduardo-research-manager/includes')
          plan = (root / 'class-research-manager-plan.php').read_text(encoding='utf-8')
          registry = (root / 'class-research-manager-resource-registry.php').read_text(encoding='utf-8')
          line_resource = (root / 'class-research-manager-line-resource.php').read_text(encoding='utf-8')
          line_editor = (root / 'class-research-manager-line-editor.php').read_text(encoding='utf-8')
          object_editor = (root / 'class-research-manager-object-editor.php').read_text(encoding='utf-8')
          object_resources = {
              'output': (root / 'class-research-manager-output-resource.php').read_text(encoding='utf-8'),
              'project': (root / 'class-research-manager-project-resource.php').read_text(encoding='utf-8'),
              'software': (root / 'class-research-manager-software-resource.php').read_text(encoding='utf-8'),
              'dataset': (root / 'class-research-manager-dataset-resource.php').read_text(encoding='utf-8'),
          }
          capabilities = (root / 'class-research-manager-v1-capabilities.php').read_text(encoding='utf-8')
          compiler = (root / 'class-research-manager-blueprint-compiler.php').read_text(encoding='utf-8')
          relations = (root / 'class-research-manager-blueprint-relations.php').read_text(encoding='utf-8')
          hydrator = (root / 'class-research-manager-blueprint-hydrator.php').read_text(encoding='utf-8')
          pairing = (root / 'class-research-manager-translation-pairing.php').read_text(encoding='utf-8')

          actions = ('create_line', 'create_output', 'create_project', 'create_software', 'create_dataset')

          risk = plan.split('public static function action_risk', 1)[1].split('private static function normalize_action', 1)[0]
          signature = plan.split('private static function target_signature', 1)[1].split('private static function checksum', 1)[0]
          normalizer = plan.split('private static function normalize_action', 1)[1].split('private static function normalize_page_creation', 1)[0]

          for section_name, section in (('action_risk', risk), ('target_signature', signature)):
              leaked = [action for action in actions if action in section]
              if leaked:
                  raise SystemExit(f'{section_name} duplicates Research creation taxonomy: {leaked}')
              if 'Resource_Registry::by_creation_action' not in section:
                  raise SystemExit(f'{section_name} must derive Research creation descriptors from Resource Registry')

          # The mutation dispatcher deliberately remains explicit and fail-closed.
          missing = [action for action in actions if action not in normalizer]
          if missing:
              raise SystemExit(f'Plan mutation dispatcher lost explicit fail-closed actions: {missing}')

          for method in ('by_creation_action', 'resource_fields', 'editable_fields', 'auxiliary_fields', 'resource_meta_fields', 'array_fields', 'defaults', 'blueprint_resource_label'):
              if f'public static function {method}' not in registry:
                  raise SystemExit(f'Resource Registry lost descriptive authority method: {method}')

          consumers = {
              'Line Resource': line_resource,
              'Line Editor': line_editor,
              'V1 Capabilities': capabilities,
          }
          for consumer_name, source in consumers.items():
              if "Resource_Registry::resource_fields('line')" not in source:
                  raise SystemExit(f'{consumer_name} must derive Research Line fields from Resource Registry')

          for consumer_name, source in (('Line Resource', line_resource), ('Line Editor', line_editor)):
              if "Resource_Registry::resource_meta_fields('line')" not in source:
                  raise SystemExit(f'{consumer_name} must derive Research Line meta storage from Resource Registry')

          for kind, source in object_resources.items():
              if f"Resource_Registry::editable_fields('{kind}')" not in source:
                  raise SystemExit(f'{kind} Resource must derive bounded Research Object fields from Resource Registry')

          for token, message in (
              ('Resource_Registry::editable_fields($kind)', 'Object Editor fields'),
              ('Resource_Registry::auxiliary_fields($kind)', 'Object Editor auxiliary fields'),
              ('Resource_Registry::array_fields($kind)', 'Object Editor array fields'),
          ):
              if token not in object_editor:
                  raise SystemExit(f'{message} must derive from Resource Registry')
          if "'fields'=>array('status','slug'" in object_editor:
              raise SystemExit('Object Editor must not restore literal Research Object field vocabularies')

          if 'Resource_Registry::blueprint_resource_label($resource_key)' not in compiler:
              raise SystemExit('Blueprint Compiler must derive Research resource intent labels from Resource Registry')
          if "array('insights'=>'insight','lines'=>'research line'" in compiler:
              raise SystemExit('Blueprint Compiler must not restore a literal Research resource label taxonomy')

          relation_specs = registry.split('public static function relation_blueprint_specs', 1)[1].split('public static function inventory_specs', 1)[0]
          if "'service'=>" in relation_specs:
              raise SystemExit('Resource Registry relation descriptors must not bind operational services')
          for token, message in (
              ('$service_key = sanitize_key((string) $resource)', 'derive relation service identity from the descriptive resource key'),
              ("'service'=>$service_key", 'preserve the relation operation service contract'),
              ('Eduardo_Research_Manager::research_services()', 'resolve operational relation services through Manager binding'),
              ('relation_blueprint_specs()[$name]', 'bound relation services to Registry relation-capable resource keys'),
          ):
              if token not in relations:
                  raise SystemExit(f'Blueprint Relations must {message}')
          if "$spec['service']" in relations:
              raise SystemExit('Blueprint Relations must not consume operational service binding from Resource Registry')

          if 'Resource_Registry::post_types()' not in pairing:
              raise SystemExit('Translation Pairing must derive structured Research post types from Resource Registry')
          if 'private static function structured_types' not in pairing or 'private static function supported_types' not in pairing:
              raise SystemExit('Translation Pairing lost its bounded Registry-derived type helpers')
          if "array_merge(self::structured_types(), array('post'))" not in pairing:
              raise SystemExit('Translation Pairing must keep Insight post as the sole explicit non-Registry supported type')
          for forbidden in ('private const SUPPORTED_TYPES', 'private const STRUCTURED_TYPES'):
              if forbidden in pairing:
                  raise SystemExit('Translation Pairing must not restore duplicated Research post-type constants')

          forbidden_hydrator = ("$slots['en']", "$slots['es']", "$seed['headline']", "$seed['headline_es']")
          leaked_hydrator = [token for token in forbidden_hydrator if token in hydrator]
          if leaked_hydrator:
              raise SystemExit('Blueprint Hydrator reconstructs language storage directly: ' + ', '.join(leaked_hydrator))
          if '$contract->identity_headline_field($language)' not in hydrator:
              raise SystemExit('Blueprint Hydrator must resolve Identity headline storage through Contract')
          PY

      - name: Verify Research descriptor semantics
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-resource-registry.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-resource.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-editor.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-object-editor.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-output-resource.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-project-resource.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-software-resource.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-dataset-resource.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-v1-capabilities.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-relations.php \
            wordpress/plugins/eduardo-research-manager/includes/class-research-manager-translation-pairing.php; do
            php -l "$file"
          done

          php <<'PHP'
          <?php
          define('ABSPATH', __DIR__);
          function sanitize_key($key) {
              return preg_replace('/[^a-z0-9_\-]/', '', strtolower((string) $key));
          }
          require 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-resource-registry.php';

          $expected_post_types = array(
              'research_line','research_output','research_project','research_software','research_dataset',
          );
          if (Eduardo_Research_Manager_Resource_Registry::post_types() !== $expected_post_types) {
              fwrite(STDERR, "Research post-type taxonomy drifted from the certified Registry contract.\n");
              exit(1);
          }

          $expected_fields = array(
              'status','slug','title','excerpt','content','language',
              'evidence_status','research_status','central_question','order','topics','methods',
          );
          $expected_meta = array(
              'language'=>'_research_language',
              'evidence_status'=>'_research_evidence_status',
              'research_status'=>'_research_status',
              'central_question'=>'_research_central_question',
              'order'=>'_research_order',
              'topics'=>'_research_topics',
              'methods'=>'_research_methods',
          );

          if (Eduardo_Research_Manager_Resource_Registry::resource_fields('line') !== $expected_fields) {
              fwrite(STDERR, "Research Line field vocabulary drifted from the certified contract.\n");
              exit(1);
          }
          if (Eduardo_Research_Manager_Resource_Registry::resource_meta_fields('line') !== $expected_meta) {
              fwrite(STDERR, "Research Line field-to-storage descriptor drifted from the certified contract.\n");
              exit(1);
          }
          if (Eduardo_Research_Manager_Resource_Registry::array_fields('line') !== array('topics','methods')) {
              fwrite(STDERR, "Research Line array-field descriptor drifted from the certified contract.\n");
              exit(1);
          }
          if (Eduardo_Research_Manager_Resource_Registry::defaults('line') !== array('evidence_status'=>'unverified','research_status'=>'planned')) {
              fwrite(STDERR, "Research Line defaults descriptor drifted from the certified contract.\n");
              exit(1);
          }

          $expected_editable = array(
              'output'=>array('status','slug','title','excerpt','content','language','output_type','review_status','publication_date','venue','doi','authors','line_ids'),
              'project'=>array('status','slug','title','excerpt','content','language','project_status','question','role','start_date','end_date','partner','funding','project_url','methods','line_ids'),
              'software'=>array('status','slug','title','excerpt','content','language','software_status','version','release_date','repository_url','archive_url','license','documentation_url','doi','programming_languages','line_ids'),
              'dataset'=>array('status','slug','title','excerpt','content','language','version','publication_date','repository','doi','license','access_level','methodology','provenance','size','documentation_url','ethics_notes','formats','line_ids'),
          );
          $expected_auxiliary = array(
              'output'=>array('output_type_verified','review_status_verified','doi_verified'),
              'project'=>array(),
              'software'=>array('doi_verified'),
              'dataset'=>array('doi_verified'),
          );
          foreach ($expected_editable as $kind => $fields) {
              if (Eduardo_Research_Manager_Resource_Registry::editable_fields($kind) !== $fields) {
                  fwrite(STDERR, "Research Object editable field vocabulary drifted for {$kind}.\n");
                  exit(1);
              }
              if (Eduardo_Research_Manager_Resource_Registry::auxiliary_fields($kind) !== $expected_auxiliary[$kind]) {
                  fwrite(STDERR, "Research Object auxiliary field vocabulary drifted for {$kind}.\n");
                  exit(1);
              }
          }

          $expected_labels = array(
              'insights'=>'insight',
              'lines'=>'research line',
              'outputs'=>'research output',
              'projects'=>'research project',
              'software'=>'research software',
              'datasets'=>'research dataset',
          );
          foreach ($expected_labels as $resource_key => $label) {
              if (Eduardo_Research_Manager_Resource_Registry::blueprint_resource_label($resource_key) !== $label) {
                  fwrite(STDERR, "Research blueprint descriptor label drifted for {$resource_key}.\n");
                  exit(1);
              }
          }

          $expected_relations = array(
              'outputs'=>array('post_type'=>'research_output'),
              'projects'=>array('post_type'=>'research_project'),
              'software'=>array('post_type'=>'research_software'),
              'datasets'=>array('post_type'=>'research_dataset'),
          );
          if (Eduardo_Research_Manager_Resource_Registry::relation_blueprint_specs() !== $expected_relations) {
              fwrite(STDERR, "Research relation Blueprint descriptors drifted from the certified contract.\n");
              exit(1);
          }
          PHP
