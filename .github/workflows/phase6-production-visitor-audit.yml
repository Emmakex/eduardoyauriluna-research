name: Phase 6 Production Visitor Audit

on:
  pull_request:
    paths:
      - '.github/scripts/phase6-production-visitor-audit.py'
      - '.github/scripts/phase6-production-legal-readback.py'
      - '.github/scripts/phase6-production-mobile-audit.mjs'
      - '.github/workflows/phase6-production-visitor-audit.yml'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/phase6-production-visitor-audit.py'
      - '.github/scripts/phase6-production-legal-readback.py'
      - '.github/scripts/phase6-production-mobile-audit.mjs'
      - '.github/workflows/phase6-production-visitor-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-production-visitor-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Phase 6 audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Python audits
        run: |
          python3 -m py_compile .github/scripts/phase6-production-visitor-audit.py
          python3 -m py_compile .github/scripts/phase6-production-legal-readback.py

      - name: Validate visitor parser contract
        run: python3 .github/scripts/phase6-production-visitor-audit.py --self-test

      - name: Validate mobile audit syntax
        run: node --check .github/scripts/phase6-production-mobile-audit.mjs

  production:
    name: Audit production visitor surfaces
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read all four public legal surfaces before the fail-closed visitor gate.
      # This preserves factual diagnostics even when the first legal page is incomplete.
      - name: Read back rendered legal copy
        run: python3 .github/scripts/phase6-production-legal-readback.py

      - name: Audit rendered legal, utility and accessibility surfaces
        run: python3 .github/scripts/phase6-production-visitor-audit.py

  production-404:
    name: Audit localized 404 recovery
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit English and Spanish 404 routes independently
        run: |
          python3 - <<'PY'
          import runpy
          auditor = runpy.run_path('.github/scripts/phase6-production-visitor-audit.py')
          auditor['audit_404']('en', '/phase6-not-found-acceptance/', 'Page not found')
          auditor['audit_404']('es', '/es/phase6-not-found-acceptance/', 'Página no encontrada')
          print('PASS: localized 404 routes and researcher recovery links')
          PY

  production-mobile:
    name: Audit production mobile independently
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Audit rendered mobile experience
        run: node .github/scripts/phase6-production-mobile-audit.mjs
