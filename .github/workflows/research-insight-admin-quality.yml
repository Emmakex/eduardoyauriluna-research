name: Research Insight Admin Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-insight-admin-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-insight-admin-quality.yml'

permissions:
  contents: read

jobs:
  insight-admin:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Lint Insight admin files
        run: |
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-insight-admin.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-insight-editor.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-insight-admin-wp
          mkdir -p /tmp/research-insight-admin-wp
          cd /tmp/research-insight-admin-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Insight Admin' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Render Research Insight authoring screen
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $_GET["erm_insight_language"] = "en";
          ob_start(); (new Eduardo_Research_Manager_Insight_Admin())->render(); $html = (string) ob_get_clean();
          foreach (["Research Insights","Structured editorial authoring","Create Research Insight","Preview new Insight","Existing Insights"] as $needle) {
              if (false === strpos($html, $needle)) { fwrite(STDERR, "missing marker: {$needle}\n"); exit(1); }
          }
          ' --allow-root

      - name: Preview Insight creation through admin action
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $_POST = [
              "editor_mode"=>"create",
              "title"=>"Admin Research Insight",
              "slug"=>"admin-research-insight",
              "language"=>"en",
              "insight_type"=>"research_note",
              "status"=>"publish",
              "excerpt"=>"Created from the structured Insight admin.",
              "content"=>"<p>Structured Insight body from the Manager.</p>",
              "_wpnonce"=>wp_create_nonce("erm_insight_preview")
          ];
          $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_preview();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $prepared = get_transient("eduardo_research_manager_insight_preview_1");
          if (! is_array($prepared) || "create" !== ($prepared["mode"] ?? "") || "create" !== ($prepared["status"] ?? "") || empty($prepared["apply_allowed"]) || empty($prepared["plan"]) || empty($prepared["creation_token"])) {
              fwrite(STDERR, wp_json_encode($prepared)); exit(1);
          }
          ' --allow-root

      - name: Apply Insight creation through admin action
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $_POST = ["_wpnonce"=>wp_create_nonce("erm_insight_apply")]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_apply();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $edit = get_transient("eduardo_research_manager_insight_edit_1");
          if (! is_array($edit) || "create" !== ($edit["mode"] ?? "") || empty($edit["post_id"]) || empty($edit["snapshot_id"])) { fwrite(STDERR, wp_json_encode($edit)); exit(1); }
          $post_id = (int) $edit["post_id"];
          $record = Eduardo_Research_Manager::insight_editor()->inspect($post_id);
          if (is_wp_error($record) || "Admin Research Insight" !== $record["title"] || "publish" !== $record["status"] || "research_note" !== $record["insight_type"] || "en" !== $record["language"]) { exit(1); }
          if (false !== get_transient("eduardo_research_manager_insight_preview_1")) { exit(1); }
          update_option("research_insight_admin_fixture_id", $post_id, false);
          $_GET["erm_insight_language"] = "en"; $_GET["erm_insight_id"] = $post_id;
          ob_start(); (new Eduardo_Research_Manager_Insight_Admin())->render(); $html = (string) ob_get_clean();
          foreach (["Admin Research Insight","Edit selected Insight","Permanent slug","Rollback latest Insight edit"] as $needle) {
              if (false === strpos($html, $needle)) { fwrite(STDERR, "missing post-create marker: {$needle}\n"); exit(1); }
          }
          if (false !== strpos($html, "name=\"status\" value=")) { exit(1); }
          ' --allow-root

      - name: Preview and apply Insight update through admin action
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $post_id = (int) get_option("research_insight_admin_fixture_id", 0);
          $_POST = [
              "editor_mode"=>"update",
              "post_id"=>$post_id,
              "title"=>"Admin Research Insight",
              "language"=>"en",
              "insight_type"=>"method_note",
              "excerpt"=>"Updated through the structured Insight admin.",
              "content"=>"<p>Updated structured Insight body.</p>",
              "_wpnonce"=>wp_create_nonce("erm_insight_preview")
          ];
          $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_preview();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $prepared = get_transient("eduardo_research_manager_insight_preview_1");
          if (! is_array($prepared) || "update" !== ($prepared["mode"] ?? "") || "change" !== ($prepared["status"] ?? "") || empty($prepared["apply_allowed"]) || empty($prepared["baseline_checksum"])) { fwrite(STDERR, wp_json_encode($prepared)); exit(1); }
          $_POST = ["_wpnonce"=>wp_create_nonce("erm_insight_apply")]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_apply();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $post_id = (int) get_option("research_insight_admin_fixture_id", 0);
          $record = Eduardo_Research_Manager::insight_editor()->inspect($post_id);
          $edit = get_transient("eduardo_research_manager_insight_edit_1");
          if (is_wp_error($record) || "method_note" !== $record["insight_type"] || "Updated through the structured Insight admin." !== $record["excerpt"]) { exit(1); }
          if (! is_array($edit) || "update" !== ($edit["mode"] ?? "") || empty($edit["snapshot_id"])) { exit(1); }
          ' --allow-root

      - name: Roll back Insight update through admin action
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $_POST = ["_wpnonce"=>wp_create_nonce("erm_insight_rollback")]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_rollback();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $post_id = (int) get_option("research_insight_admin_fixture_id", 0);
          $record = Eduardo_Research_Manager::insight_editor()->inspect($post_id);
          if (is_wp_error($record) || "research_note" !== $record["insight_type"] || "Created from the structured Insight admin." !== $record["excerpt"]) { exit(1); }
          if (false !== get_transient("eduardo_research_manager_insight_edit_1")) { exit(1); }
          ' --allow-root

      - name: Create and roll back a disposable Insight through admin actions
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-admin-wp
          wp eval '
          wp_set_current_user(1);
          $_POST = [
              "editor_mode"=>"create",
              "title"=>"Disposable Admin Insight",
              "slug"=>"disposable-admin-insight",
              "language"=>"es",
              "insight_type"=>"working_note",
              "status"=>"draft",
              "excerpt"=>"Temporal.",
              "content"=>"<p>Temporal.</p>",
              "_wpnonce"=>wp_create_nonce("erm_insight_preview")
          ]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_preview();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $_POST = ["_wpnonce"=>wp_create_nonce("erm_insight_apply")]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_apply();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $edit = get_transient("eduardo_research_manager_insight_edit_1");
          if (! is_array($edit) || "create" !== ($edit["mode"] ?? "") || empty($edit["post_id"]) || empty($edit["snapshot_id"])) { exit(1); }
          update_option("research_disposable_insight_id", (int) $edit["post_id"], false);
          $_POST = ["_wpnonce"=>wp_create_nonce("erm_insight_rollback")]; $_REQUEST = $_POST;
          (new Eduardo_Research_Manager_Insight_Admin())->handle_rollback();
          ' --allow-root
          wp eval '
          wp_set_current_user(1);
          $post_id = (int) get_option("research_disposable_insight_id", 0);
          if (get_post($post_id) instanceof WP_Post && "trash" !== get_post_status($post_id)) { exit(1); }
          delete_option("research_disposable_insight_id");
          delete_option("research_insight_admin_fixture_id");
          ' --allow-root
