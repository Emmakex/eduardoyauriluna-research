name: Phase 2E Translation Fixture Status 93

on:
  push:
    branches: [main]
    paths:
      - 'ops/phase2e/translation-fixture-status-93.json'

permissions:
  contents: write

concurrency:
  group: phase2d-command-gateway
  cancel-in-progress: false

jobs:
  execute:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase2d-production
    env:
      PHASE2D_MCP_BASE_URL: https://mcp.kairoseth.com/mcp
      PHASE2D_MCP_TOKEN: ${{ secrets.PHASE2D_MCP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Self-test bounded acceptance helper
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-translation-fixture-status-93.py --self-test

      - name: Verify dedicated principal tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2d-command-guard.py isolation --tenant eduardo-research

      - name: Prepare or restore exact Spanish translation fixture status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-translation-fixture-status-93.py \
            --request ops/phase2e/translation-fixture-status-93.json \
            --evidence commands/phase2d/results/cmd-phase2e-translation-fixture-status-93-0001.json \
            --restore-evidence commands/phase2d/results/cmd-phase2e-translation-fixture-status-93-0001-restore.json

      - name: Persist sanitized acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          action="$(python3 - <<'PY'
          import json
          print(json.load(open('ops/phase2e/translation-fixture-status-93.json', encoding='utf-8'))['action'])
          PY
          )"
          if [[ "$action" == 'prepare' ]]; then
            evidence='commands/phase2d/results/cmd-phase2e-translation-fixture-status-93-0001.json'
            message='phase2e: record Spanish translation fixture publication evidence'
          else
            evidence='commands/phase2d/results/cmd-phase2e-translation-fixture-status-93-0001-restore.json'
            message='phase2e: record Spanish translation fixture status restore'
          fi
          test -f "$evidence"
          cp "$evidence" /tmp/phase2e-translation-status-93.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$evidence")"
          cp /tmp/phase2e-translation-status-93.json "$evidence"

          git config user.name 'kairoseth-command-gateway[bot]'
          git config user.email 'kairoseth-command-gateway[bot]@users.noreply.github.com'
          git add "$evidence"
          if git diff --cached --quiet; then
            echo 'Acceptance evidence already persisted'
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:main
