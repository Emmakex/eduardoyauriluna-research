name: Research Page Editor Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-page-editor-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-page-editor-quality.yml'

permissions:
  contents: read

jobs:
  page-editor:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Lint Page editor service
        run: php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-page-editor.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-page-editor-wp
          mkdir -p /tmp/research-page-editor-wp
          cd /tmp/research-page-editor-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Page Editor' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root

      - name: Preview apply verify and rollback one Page slot
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-page-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::page_editor();
          if (! $editor instanceof Eduardo_Research_Manager_Page_Editor) { exit(1); }
          $before = $editor->inspect("home", "en");
          if (is_wp_error($before)) { fwrite(STDERR, $before->get_error_message()); exit(1); }
          $schema = Eduardo_Research_Manager::pages()->slot_schema("home", "en");
          $slot = "";
          foreach ($schema as $candidate => $default) {
              if (! is_array($default)) { $slot = (string) $candidate; break; }
          }
          if ("" === $slot) { fwrite(STDERR, "No scalar Page slot available\n"); exit(1); }
          $original = (string) ($before["effective_slots"][$slot] ?? "");
          $target = $original . " [CI structured edit]";
          $prepared = $editor->preview("home", "en", [$slot=>$target]);
          if (is_wp_error($prepared) || "change" !== ($prepared["status"] ?? "") || empty($prepared["apply_allowed"]) || empty($prepared["plan"])) {
              fwrite(STDERR, is_wp_error($prepared) ? $prepared->get_error_message() : wp_json_encode($prepared)); exit(1);
          }
          $applied = $editor->apply_preview($prepared);
          if (is_wp_error($applied) || empty($applied["verified"]) || empty($applied["snapshot_id"])) {
              fwrite(STDERR, is_wp_error($applied) ? $applied->get_error_message() : wp_json_encode($applied)); exit(1);
          }
          $after = $editor->inspect("home", "en");
          if (is_wp_error($after) || $target !== (string) ($after["effective_slots"][$slot] ?? "")) { exit(1); }
          $steady = $editor->preview("home", "en", [$slot=>$target]);
          if (is_wp_error($steady) || "already-matching" !== ($steady["status"] ?? "") || empty($steady["verification"]["verified"])) { exit(1); }
          $blocked = $prepared; $blocked["apply_allowed"] = false;
          $blocked_result = $editor->apply_preview($blocked);
          if (! is_wp_error($blocked_result) || "research_manager_page_editor_apply_blocked" !== $blocked_result->get_error_code()) { exit(1); }
          $rollback = $editor->rollback((string) $applied["snapshot_id"]);
          if (is_wp_error($rollback)) { fwrite(STDERR, $rollback->get_error_message()); exit(1); }
          $restored = $editor->inspect("home", "en");
          if (is_wp_error($restored) || $original !== (string) ($restored["effective_slots"][$slot] ?? "")) { exit(1); }
          ' --allow-root
