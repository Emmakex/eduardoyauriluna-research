name: Research Manager Remote M7 Design Readiness Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/test-remote-m7-design-readiness.php'
      - '.github/workflows/research-manager-remote-m7-design-readiness-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/test-remote-m7-design-readiness.php'
      - '.github/workflows/research-manager-remote-m7-design-readiness-quality.yml'

permissions:
  contents: read

jobs:
  remote-m7-design-readiness:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli
      - name: Ensure WP-CLI
        run: bash .github/scripts/ensure-wp-cli.sh
      - name: Lint final M7 aggregate design readiness
        run: |
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-design-readiness.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-design-readiness-rest.php
          php -l wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php
          php -l .github/scripts/test-remote-m7-design-readiness.php
      - name: Install clean Research WordPress
        run: |
          rm -rf /tmp/research-manager-remote-m7-design-readiness
          mkdir -p /tmp/research-manager-remote-m7-design-readiness
          cd /tmp/research-manager-remote-m7-design-readiness
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set WP_ENVIRONMENT_TYPE development --type=constant --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Manager Remote M7c' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root
      - name: Start representative rendered WordPress
        run: |
          cd /tmp/research-manager-remote-m7-design-readiness
          wp server --host=127.0.0.1 --port=8080 --allow-root > /tmp/research-manager-m7c-server.log 2>&1 &
          echo $! > /tmp/research-manager-m7c-server.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/research-manager-m7c-server.log
          exit 1
      - name: Verify final M7 design readiness loop
        run: |
          cd /tmp/research-manager-remote-m7-design-readiness
          wp eval-file "$GITHUB_WORKSPACE/.github/scripts/test-remote-m7-design-readiness.php" --allow-root
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/research-manager-m7c-server.log || true
