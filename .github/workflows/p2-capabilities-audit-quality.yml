name: Phase 2 Capabilities Audit Quality

on:
  pull_request:
    paths:
      - 'scripts/p2-capabilities-audit.php'
      - 'docs/15-production-operating-playbook.md'
      - '.github/workflows/p2-capabilities-audit-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/p2-capabilities-audit.php'
      - 'docs/15-production-operating-playbook.md'
      - '.github/workflows/p2-capabilities-audit-quality.yml'

permissions:
  contents: read

jobs:
  audit-harness:
    name: PHP ${{ matrix.php }} audit harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        run: php -l scripts/p2-capabilities-audit.php

      - name: CLI help smoke test
        run: php scripts/p2-capabilities-audit.php --help
