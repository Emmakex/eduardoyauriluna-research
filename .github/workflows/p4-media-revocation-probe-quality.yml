name: Phase 4 Media Revocation Probe Quality

on:
  pull_request:
    paths:
      - 'scripts/p4-media-revocation-probe.php'
      - '.github/workflows/p4-media-revocation-probe-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p4-media-revocation-probe.php'
      - '.github/workflows/p4-media-revocation-probe-quality.yml'

concurrency:
  group: p4-media-revocation-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revocation-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: PHP lint
        run: php -l scripts/p4-media-revocation-probe.php

      - name: Help path requires no credential
        run: php scripts/p4-media-revocation-probe.php --help

      - name: Enforce negative-authentication-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('scripts/p4-media-revocation-probe.php').read_text()
          required = [
              "P4_REVOKE_API_PREFIX . '/capabilities'",
              "CURLOPT_HTTPGET => true",
              "401 !== $status",
              "'authentication_failed' !== $code",
              "no_authenticated_data",
              "credential_material_recorded'] = false",
              "getenv('ERM_TOKEN')",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing revocation guard: {token}')
          forbidden = [
              'CURLOPT_POST', 'CURLOPT_POSTFIELDS', 'CURLOPT_CUSTOMREQUEST',
              '/apply', '/rollback', '/plan', '/upload', '/delete', '/wp/v2/',
              'wp_update_post(', 'update_post_meta(', 'update_option(',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden revocation mutation surface: {token}')
          dangerous = re.findall(r'(?<![A-Za-z0-9_])(shell_exec|exec|system|passthru|proc_open|popen)\s*\(', text)
          if dangerous:
              raise SystemExit(f'forbidden process call: {dangerous!r}')
          PY

      - name: Enforce transport and evidence secrecy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-revocation-probe.php').read_text()
          if "CURLOPT_FOLLOWLOCATION => false" not in text:
              raise SystemExit('redirect blocking missing')
          if "CURLOPT_SSL_VERIFYPEER => true" not in text or "CURLOPT_SSL_VERIFYHOST => 2" not in text:
              raise SystemExit('TLS verification contract missing')
          evidence_block = text[text.find("$evidence = array("):]
          if "'token' =>" in evidence_block or "'authorization' =>" in evidence_block:
              raise SystemExit('credential material must never be added to evidence')
          PY
