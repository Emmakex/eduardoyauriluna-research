name: Phase 2D Command Gateway Quality

on:
  pull_request:
    paths:
      - 'schemas/phase2d-command-v1.schema.json'
      - 'config/phase2d-command-registry.json'
      - 'scripts/phase2d-command-runner.py'
      - 'scripts/phase2d-command-runner-observable.py'
      - 'scripts/phase2d-command-guard.py'
      - 'scripts/phase2d-run-attempt-guard.py'
      - 'scripts/phase2d-provision-github-principal.py'
      - 'scripts/phase2e-expand-gateway-capabilities.py'
      - 'scripts/phase2e-page-acceptance-restore.py'
      - 'scripts/phase2e-harden-gateway-generation.py'
      - 'commands/phase2d/examples/*.json'
      - '.github/workflows/phase2d-command-gateway.yml'
      - '.github/workflows/phase2d-command-gateway-quality.yml'
      - '.github/workflows/phase2e-expand-gateway-capabilities.yml'
      - '.github/workflows/phase2e-page-acceptance-restore.yml'
      - '.github/workflows/phase2e-harden-gateway-generation.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/phase2d-command-v1.schema.json'
      - 'config/phase2d-command-registry.json'
      - 'scripts/phase2d-command-runner.py'
      - 'scripts/phase2d-command-runner-observable.py'
      - 'scripts/phase2d-command-guard.py'
      - 'scripts/phase2d-run-attempt-guard.py'
      - 'scripts/phase2d-provision-github-principal.py'
      - 'scripts/phase2e-expand-gateway-capabilities.py'
      - 'scripts/phase2e-page-acceptance-restore.py'
      - 'scripts/phase2e-harden-gateway-generation.py'
      - 'commands/phase2d/examples/*.json'
      - '.github/workflows/phase2d-command-gateway.yml'
      - '.github/workflows/phase2d-command-gateway-quality.yml'
      - '.github/workflows/phase2e-expand-gateway-capabilities.yml'
      - '.github/workflows/phase2e-page-acceptance-restore.yml'
      - '.github/workflows/phase2e-harden-gateway-generation.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python helpers
        run: |
          python3 -m py_compile scripts/phase2d-command-runner.py
          python3 -m py_compile scripts/phase2d-command-runner-observable.py
          python3 -m py_compile scripts/phase2d-command-guard.py
          python3 -m py_compile scripts/phase2d-run-attempt-guard.py
          python3 -m py_compile scripts/phase2d-provision-github-principal.py
          python3 -m py_compile scripts/phase2e-expand-gateway-capabilities.py
          python3 -m py_compile scripts/phase2e-page-acceptance-restore.py
          python3 -m py_compile scripts/phase2e-harden-gateway-generation.py

      - name: Run fail-closed self-tests
        run: |
          python3 scripts/phase2d-command-runner.py --self-test
          python3 scripts/phase2d-command-guard.py self-test
          python3 scripts/phase2d-run-attempt-guard.py --self-test
          python3 scripts/phase2d-provision-github-principal.py --self-test
          python3 scripts/phase2e-expand-gateway-capabilities.py --self-test
          python3 scripts/phase2e-page-acceptance-restore.py --self-test
          python3 scripts/phase2e-harden-gateway-generation.py --self-test

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('schemas/phase2d-command-v1.schema.json'),
              Path('config/phase2d-command-registry.json'),
              Path('commands/phase2d/examples/hola-mundo.json'),
              Path('commands/phase2d/examples/insight-update.json'),
              Path('commands/phase2d/examples/page-slot-update.json'),
              Path('commands/phase2d/examples/insight-translation-pair.json'),
              Path('commands/phase2d/examples/insight-translation-unpair.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON OK: {path}')
          PY

      - name: Validate bounded command surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"insight.create"' schemas/phase2d-command-v1.schema.json
          grep -F '"insight.update"' schemas/phase2d-command-v1.schema.json
          grep -F '"page.slot.update"' schemas/phase2d-command-v1.schema.json
          grep -F '"insight.translation.pair"' schemas/phase2d-command-v1.schema.json
          grep -F '"insight.translation.unpair"' schemas/phase2d-command-v1.schema.json
          grep -F '"const": "draft"' schemas/phase2d-command-v1.schema.json
          grep -F '"first_id"' schemas/phase2d-command-v1.schema.json
          grep -F '"second_id"' schemas/phase2d-command-v1.schema.json
          ! grep -F '"scheduled_at"' schemas/phase2d-command-v1.schema.json
          ! grep -F '"line_ids"' schemas/phase2d-command-v1.schema.json
          grep -F '"plan": "site_insight_create_plan"' config/phase2d-command-registry.json
          grep -F '"plan": "site_insight_update_plan"' config/phase2d-command-registry.json
          grep -F '"plan": "site_page_slots_plan"' config/phase2d-command-registry.json
          grep -F '"plan": "site_insight_pair_plan"' config/phase2d-command-registry.json
          grep -F '"plan": "site_insight_unpair_plan"' config/phase2d-command-registry.json
          grep -F '"apply": "site_insight_pairing_apply"' config/phase2d-command-registry.json
          grep -F '"verify": "site_insight_pairing_verify"' config/phase2d-command-registry.json
          grep -F '"rollback": "site_insight_pairing_rollback"' config/phase2d-command-registry.json
          grep -F '"translations.write"' config/phase2d-command-registry.json
          grep -F '"verify_rendered": false' config/phase2d-command-registry.json
          grep -F '"key": {"const": "contact"}' schemas/phase2d-command-v1.schema.json
          grep -F '"language": {"const": "en"}' schemas/phase2d-command-v1.schema.json
          grep -F '"slot": {"const": "eyebrow"}' schemas/phase2d-command-v1.schema.json
          grep -F '"pattern": "^[^<>]+$"' schemas/phase2d-command-v1.schema.json
          grep -F 'environment: phase2d-production' .github/workflows/phase2d-command-gateway.yml
          grep -F 'PHASE2D_GATEWAY_GENERATION: phase2d-v2-20261019' .github/workflows/phase2d-command-gateway.yml
          grep -F "PHASE2D_MCP_TOKEN: \${{ format('{0}.phase2d-v2-20261019', secrets.PHASE2D_MCP_TOKEN) }}" .github/workflows/phase2d-command-gateway.yml
          grep -F 'Reject historical workflow reruns' .github/workflows/phase2d-command-gateway.yml
          grep -F 'Guard command identity and replay' .github/workflows/phase2d-command-gateway.yml
          grep -F 'Verify dedicated principal tenant isolation' .github/workflows/phase2d-command-gateway.yml
          grep -F 'command_sha256' scripts/phase2d-command-guard.py
          grep -F 'DENIED_TENANT = "phase2d-denied-probe"' scripts/phase2d-command-guard.py
          grep -F 'historical workflow reruns are not permitted' scripts/phase2d-run-attempt-guard.py
          grep -F 'GENERATION = "phase2d-v2-20261019"' scripts/phase2e-harden-gateway-generation.py
          grep -F 'bare_allowed != 401' scripts/phase2e-harden-gateway-generation.py
          grep -F 'contextual_allowed != 200' scripts/phase2e-harden-gateway-generation.py
          grep -F 'contextual_denied != 403' scripts/phase2e-harden-gateway-generation.py
          grep -F 'PAIR_ACTIONS = {"insight.translation.pair", "insight.translation.unpair"}' scripts/phase2d-command-runner.py
          grep -F 'PAIR_PLAN_ID_RE = re.compile' scripts/phase2d-command-runner.py
          grep -F 'PAIR_OP_ID_RE = re.compile' scripts/phase2d-command-runner.py
          grep -F 'PAGE_KEY = "contact"' scripts/phase2d-command-runner.py
          grep -F 'PAGE_LANGUAGE = "en"' scripts/phase2d-command-runner.py
          grep -F 'PAGE_SLOT = "eyebrow"' scripts/phase2d-command-runner.py
          grep -F 'CAPABILITIES = ["site.read", "insights.write", "operations.rollback"]' scripts/phase2d-provision-github-principal.py
          grep -F 'PRINCIPAL_ID = "phase2d-github"' scripts/phase2d-provision-github-principal.py
          grep -F 'TOKEN_ENV = "PRINCIPAL_PHASE2D_GITHUB_TOKEN"' scripts/phase2d-provision-github-principal.py
          grep -F 'APPROVED_CAPABILITIES = ["pages.write", "translations.write"]' scripts/phase2e-expand-gateway-capabilities.py
          grep -F 'phase2d-github tenant allowlist is not the accepted single-tenant contract' scripts/phase2e-expand-gateway-capabilities.py
          grep -F "'add_capabilities': ['pages.write', 'translations.write']" .github/workflows/phase2e-expand-gateway-capabilities.yml
          grep -F 'group: phase2c-ovh-production' .github/workflows/phase2e-expand-gateway-capabilities.yml
          grep -F 'site_page_slots_rollback' scripts/phase2e-page-acceptance-restore.py
          grep -F 'EXPECTED_KEY = "contact"' scripts/phase2e-page-acceptance-restore.py
          grep -F 'EXPECTED_LANGUAGE = "en"' scripts/phase2e-page-acceptance-restore.py
          grep -F 'EXPECTED_SLOT = "eyebrow"' scripts/phase2e-page-acceptance-restore.py
          grep -F 'environment: phase2d-production' .github/workflows/phase2e-page-acceptance-restore.yml
          grep -F "'command_id': 'cmd-phase2e-page-slot-0001'" .github/workflows/phase2e-page-acceptance-restore.yml

          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/phase2d-command-gateway.yml').read_text(encoding='utf-8')
          pre_steps = text.split('    steps:', 1)[0]
          if 'PHASE2D_MCP_TOKEN:' in pre_steps:
              raise SystemExit('MCP bearer must not be job-wide')
          if text.count('PHASE2D_MCP_TOKEN:') != 2:
              raise SystemExit('MCP bearer must be scoped only to isolation + execution steps')
          rerun = text.index('- name: Reject historical workflow reruns')
          resolve = text.index('- name: Resolve exactly one trusted command')
          if rerun >= resolve:
              raise SystemExit('rerun guard must execute before command resolution')
          print('GATEWAY_WORKFLOW_HARDENING_OK')
          PY

      - name: Reject committed credential material
        shell: bash
        run: |
          set -euo pipefail
          files=(
            schemas/phase2d-command-v1.schema.json
            config/phase2d-command-registry.json
            scripts/phase2d-command-runner.py
            scripts/phase2d-command-runner-observable.py
            scripts/phase2d-command-guard.py
            scripts/phase2d-run-attempt-guard.py
            scripts/phase2d-provision-github-principal.py
            scripts/phase2e-expand-gateway-capabilities.py
            scripts/phase2e-page-acceptance-restore.py
            scripts/phase2e-harden-gateway-generation.py
            commands/phase2d/examples/hola-mundo.json
            commands/phase2d/examples/insight-update.json
            commands/phase2d/examples/page-slot-update.json
            commands/phase2d/examples/insight-translation-pair.json
            commands/phase2d/examples/insight-translation-unpair.json
            .github/workflows/phase2d-command-gateway.yml
            .github/workflows/phase2e-expand-gateway-capabilities.yml
            .github/workflows/phase2e-page-acceptance-restore.yml
            .github/workflows/phase2e-harden-gateway-generation.yml
          )
          ! grep -E '(erm1_|ermt1_|Bearer[[:space:]]+[A-Za-z0-9._-]{16,})' "${files[@]}"
