name: Research Theme Release Quality

on:
  pull_request:
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/scripts/test-theme-sitemap-provider.php'
      - '.github/workflows/research-theme-release-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/scripts/test-theme-sitemap-provider.php'
      - '.github/workflows/research-theme-release-quality.yml'

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Ensure WP-CLI is available
        shell: bash
        run: bash .github/scripts/ensure-wp-cli.sh

      - name: Verify 1.1.4 product metadata, governance and release assets
        shell: bash
        run: |
          set -euo pipefail
          THEME=wordpress/themes/eduardo-research
          grep -F 'Author: Emmake by Kairoseth' "$THEME/style.css"
          grep -F 'Author URI: https://kairoseth.com/' "$THEME/style.css"
          grep -F 'Version: 1.1.4' "$THEME/style.css"
          grep -F "'version' => 6" "$THEME/inc/research-preset.php" || grep -F "'version'=>6" "$THEME/inc/research-preset.php"
          grep -F "research-hardening.php" "$THEME/functions.php"
          grep -F "research-governance.php" "$THEME/functions.php"
          grep -F "research-navigation.css" "$THEME/functions.php"
          grep -F "research-navigation.js" "$THEME/functions.php"
          grep -F 'aria-controls="research-header-actions"' "$THEME/header.php"
          grep -F 'aria-expanded="false"' "$THEME/header.php"
          grep -F "eduardo_research_t('menu_open')" "$THEME/header.php"
          grep -F "eduardo_research_t('menu_close')" "$THEME/header.php"
          grep -F 'Escape' "$THEME/assets/research-navigation.js"
          grep -F "function eduardo_research_governance_contract" "$THEME/inc/research-governance.php"
          grep -F "function eduardo_research_ui_copy_contract" "$THEME/inc/research-language.php"
          grep -F "wordpress_editor_not_layout_authority" "$THEME/inc/research-governance.php"
          grep -F "arbitrary_php" "$THEME/inc/research-governance.php"
          grep -F "arbitrary_rest_route" "$THEME/inc/research-governance.php"
          grep -F "public const PROVIDER_NAME = 'researchlanguages';" "$THEME/inc/research-sitemap.php"
          grep -F "if ('users' === \$name) { return false; }" "$THEME/inc/research-sitemap.php"
          test -s "$THEME/assets/research-navigation.css"
          test -s "$THEME/inc/research-hardening.php"
          test -s "$THEME/inc/research-governance.php"
          test -s .github/scripts/test-theme-sitemap-provider.php
          php -l "$THEME/inc/research-hardening.php"
          php -l "$THEME/inc/research-governance.php"
          php -l "$THEME/inc/research-language.php"
          php -l "$THEME/inc/research-sitemap.php"
          php -l .github/scripts/test-theme-sitemap-provider.php
          php -l "$THEME/header.php"

      - name: Install clean WordPress and Theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-release-wp
          cd /tmp/research-release-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://release.test --title='Research Release Test' --admin_user=admin --admin_password='research-release-password' --admin_email=research@example.test --skip-email --allow-root
          wp option update permalink_structure '/%postname%/' --allow-root
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root

      - name: Verify installed Theme reports 1.1.4 governance and ownership
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-release-wp
          test "$(wp theme get eduardo-research --field=version --allow-root)" = "1.1.4"
          wp eval '$theme=wp_get_theme("eduardo-research"); if ("Emmake by Kairoseth" !== $theme->get("Author")) { fwrite(STDERR, $theme->get("Author") . "\n"); exit(1); } if ("https://kairoseth.com/" !== $theme->get("AuthorURI")) { exit(1); } $contract=eduardo_research_governance_contract(); if (1 !== (int)($contract["version"]??0)) { exit(1); } if (6 !== (int)($contract["theme"]["preset_version"]??0)) { exit(1); } foreach (["page_content","ui_copy","navigation","design","variants"] as $surface) { if (empty($contract["surfaces"][$surface]["available"])) { exit(1); } } if (empty($contract["constraints"]["wordpress_editor_not_layout_authority"]) || ! empty($contract["constraints"]["arbitrary_php"]) || ! empty($contract["constraints"]["arbitrary_rest_route"])) { exit(1); }' --allow-root

      - name: Verify localized sitemap provider routing
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-release-wp
          wp eval-file "$GITHUB_WORKSPACE/.github/scripts/test-theme-sitemap-provider.php" --allow-root

      - name: Verify bounded bilingual UI copy overrides
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-release-wp
          wp eval '$contract=eduardo_research_ui_copy_public_contract(); if (empty($contract["constraints"]["registered_keys_only"]) || ! empty($contract["constraints"]["html"]) || ! empty($contract["constraints"]["arbitrary_option"])) { exit(1); } update_option("eduardo_research_ui_copy", ["menu_open"=>["en"=>"Navigation"]], false); if ("Navigation" !== eduardo_research_t("menu_open","en")) { exit(1); } if ("Menú" !== eduardo_research_t("menu_open","es")) { exit(1); } update_option("eduardo_research_ui_copy", ["not_registered"=>["en"=>"Unsafe"]], false); $state=eduardo_research_ui_copy_state(); if (isset($state["not_registered"])) { exit(1); } delete_option("eduardo_research_ui_copy");' --allow-root

      - name: Verify public academic evidence gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-release-wp
          wp eval '
          $verified = wp_insert_post(["post_type"=>"research_output","post_status"=>"publish","post_title"=>"Verified paper"]);
          $unverified = wp_insert_post(["post_type"=>"research_output","post_status"=>"publish","post_title"=>"Unverified paper"]);
          foreach ([$verified,$unverified] as $id) {
              update_post_meta($id,"_research_language","en");
              update_post_meta($id,"_research_output_type","journal_article");
              update_post_meta($id,"_research_review_status","peer_reviewed");
          }
          update_post_meta($verified,"_research_output_type_verified","1");
          update_post_meta($verified,"_research_review_status_verified","1");
          update_post_meta($unverified,"_research_output_type_verified","0");
          update_post_meta($unverified,"_research_review_status_verified","0");

          if ("journal_article" !== get_post_meta($verified,"_research_output_type",true)) { exit(1); }
          if ("peer_reviewed" !== get_post_meta($verified,"_research_review_status",true)) { exit(1); }
          if ("" !== get_post_meta($unverified,"_research_output_type",true)) { exit(1); }
          if ("" !== get_post_meta($unverified,"_research_review_status",true)) { exit(1); }

          $q = new WP_Query([
              "post_type"=>"research_output",
              "post_status"=>"publish",
              "fields"=>"ids",
              "posts_per_page"=>20,
              "meta_query"=>[
                  "relation"=>"AND",
                  ["key"=>"_research_output_type","value"=>"journal_article","compare"=>"="],
                  ["key"=>"_research_review_status","value"=>"peer_reviewed","compare"=>"="],
              ],
          ]);
          if (! in_array($verified,$q->posts,true) || in_array($unverified,$q->posts,true)) {
              fwrite(STDERR, json_encode($q->posts) . "\n"); exit(1);
          }
          ' --allow-root

      - name: Verify exploration views are noindex follow
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-release-wp
          wp eval '
          $page = get_page_by_path("publications");
          if (! $page) { exit(1); }
          $_GET["output_type"] = "journal_article";
          $GLOBALS["wp_query"] = new WP_Query(["page_id"=>$page->ID]);
          if ("publications" !== eduardo_research_current_page_key()) { exit(1); }
          $robots = eduardo_research_exploration_robots(["index"=>true]);
          if (empty($robots["noindex"]) || empty($robots["follow"]) || isset($robots["index"])) { exit(1); }
          unset($_GET["output_type"]);
          wp_reset_query();
          ' --allow-root

      - name: Build deterministic Theme 1.1.4 candidate with source inventory
        shell: bash
        env:
          THEME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("wordpress/themes/eduardo-research")
          target = pathlib.Path("dist")
          target.mkdir(parents=True, exist_ok=True)
          name = "eduardo-research-1.1.4.zip"
          expected = {
              "style.css",
              "functions.php",
              "assets/research-navigation.css",
              "assets/visual-polish.css",
          }
          entries = []
          for path in sorted(source.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("Symlink forbidden in Theme candidate")
              if not path.is_file():
                  continue
              rel = path.relative_to(source).as_posix()
              if path.name == ".DS_Store" or path.suffix == ".map":
                  continue
              if any(p in (".git", "node_modules", "__pycache__") for p in path.parts):
                  raise SystemExit("Unexpected source directory in Theme candidate")
              if path.name in (".env", ".env.local", "wp-config.php") or path.suffix.lower() in (".pem", ".key", ".p12", ".pfx", ".sql"):
                  raise SystemExit("Secret or instance artifact in Theme candidate")
              entries.append((rel, path.read_bytes()))
          inventory = dict(entries)
          if not expected.issubset(inventory) or len(entries) < 30:
              raise SystemExit("Incomplete Theme distribution")
          header = inventory["style.css"].decode("utf-8")
          if not re.search(r"(?m)^Version: 1\.1\.4\s*$", header):
              raise SystemExit("Theme header does not declare 1.1.4")
          if "#536763" not in inventory["assets/visual-polish.css"].decode("utf-8"):
              raise SystemExit("Source contrast fix missing")
          nav_css = inventory["assets/research-navigation.css"].decode("utf-8")
          if "research-menu-toggle-label" not in nav_css or "clip-path" not in nav_css:
              raise SystemExit("Accessible mobile menu source fix missing")

          def make_zip():
              data = io.BytesIO()
              with zipfile.ZipFile(data, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for rel, content in entries:
                      info = zipfile.ZipInfo("eduardo-research/" + rel, (2024, 1, 1, 0, 0, 0))
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      zf.writestr(info, content, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
              return data.getvalue()

          first, second = make_zip(), make_zip()
          if first != second:
              raise SystemExit("Nondeterministic archive")
          digest = hashlib.sha256(first).hexdigest()
          (target / name).write_bytes(first)
          (target / (name + ".sha256")).write_text(f"{digest}  {name}\n")
          with zipfile.ZipFile(io.BytesIO(first)) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Corrupt candidate archive")
              names = set(archive.namelist())
              if len(names) != len(entries) or any(not n.startswith("eduardo-research/") for n in names):
                  raise SystemExit("Archive path escape or count mismatch")
          manifest = {
              "schema_version": 1,
              "product": "Eduardo Research Theme",
              "version": "1.1.4",
              "status": "candidate_not_deployed",
              "source_commit": os.environ["THEME_SOURCE_SHA"],
              "archive": {"filename": name, "sha256": digest, "file_count": len(entries)},
              "file_inventory": [
                  {"path": rel, "sha256": hashlib.sha256(content).hexdigest()}
                  for rel, content in entries
              ],
              "site_architect_plugin_included": False,
              "production_deployment_performed": False,
              "production_accessibility_certified": False,
          }
          (target / "eduardo-research-1.1.4.manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(f"THEME_114_CANDIDATE_REPRODUCIBLE files={len(entries)} sha256={digest}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-theme-1.1.4-candidate-not-deployed
          path: |
            dist/eduardo-research-1.1.4.zip
            dist/eduardo-research-1.1.4.zip.sha256
            dist/eduardo-research-1.1.4.manifest.json
          if-no-files-found: error
