name: Research Evidence Editor Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-evidence-editor-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-evidence-editor-quality.yml'

permissions:
  contents: read

jobs:
  evidence-editor:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Lint Evidence editor service
        run: php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-evidence-editor.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-evidence-editor-wp
          mkdir -p /tmp/research-evidence-editor-wp
          cd /tmp/research-evidence-editor-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Eduardo Jose Yauri Luna' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root

      - name: Enforce verified academic identity workflow
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-evidence-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::evidence_editor();
          if (! $editor instanceof Eduardo_Research_Manager_Evidence_Editor) { exit(1); }
          $expected_groups = ["profile","affiliations","identifiers","research_questions","methods","experience","education","awards","contact"];
          if (array_keys($editor->groups()) !== $expected_groups) { fwrite(STDERR, wp_json_encode(array_keys($editor->groups()))); exit(1); }

          $blocked = $editor->preview_identity("Eduardo Jose Yauri Luna");
          if (is_wp_error($blocked) || empty($blocked["apply_allowed"]) || "already-matching" !== ($blocked["status"] ?? "")) {
              // The WordPress title already matches and no stored identity mutation is necessary.
              fwrite(STDERR, wp_json_encode($blocked)); exit(1);
          }

          $changed = $editor->preview_identity("Eduardo Jose Yauri Luna — Research");
          if (is_wp_error($changed) || ! empty($changed["apply_allowed"]) || "evidence-required" !== ($changed["risk"] ?? "") || empty($changed["apply_blocker"])) { fwrite(STDERR, wp_json_encode($changed)); exit(1); }
          $blocked_apply = $editor->apply_preview($changed);
          if (! is_wp_error($blocked_apply) || "research_manager_evidence_apply_blocked" !== $blocked_apply->get_error_code()) { exit(1); }

          $prepared = $editor->preview_identity("Eduardo Jose Yauri Luna — Research", true, "CI verified identity source");
          if (is_wp_error($prepared) || empty($prepared["apply_allowed"]) || "evidence-required" !== ($prepared["risk"] ?? "")) { fwrite(STDERR, wp_json_encode($prepared)); exit(1); }
          $applied = $editor->apply_preview($prepared);
          if (is_wp_error($applied) || empty($applied["verified"]) || empty($applied["snapshot_id"])) { fwrite(STDERR, is_wp_error($applied) ? $applied->get_error_message() : wp_json_encode($applied)); exit(1); }
          $identity = $editor->identity();
          if (is_wp_error($identity) || "Eduardo Jose Yauri Luna — Research" !== $identity["name"] || "CI verified identity source" !== $identity["evidence_reference"] || "" === $identity["verified_at"]) { exit(1); }
          $noop = $editor->preview_identity("Eduardo Jose Yauri Luna — Research");
          if (is_wp_error($noop) || "already-matching" !== ($noop["status"] ?? "") || empty($noop["apply_allowed"])) { exit(1); }
          $rollback = $editor->rollback((string) $applied["snapshot_id"]);
          if (is_wp_error($rollback)) { exit(1); }
          $restored = $editor->identity();
          if (is_wp_error($restored) || "Eduardo Jose Yauri Luna" !== $restored["name"]) { exit(1); }
          ' --allow-root

      - name: Create bilingual verified evidence with provenance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-evidence-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::evidence_editor();
          $data = [
              "status"=>"verified",
              "title"=>"Applied digital systems research profile",
              "summary"=>"Evidence-backed research profile for controlled public surfaces.",
              "url"=>"https://eduardoyauriluna.com/",
              "translations"=>["es"=>[
                  "title"=>"Perfil de investigación en sistemas digitales aplicados",
                  "summary"=>"Perfil de investigación basado en evidencia para superficies públicas controladas."
              ]]
          ];
          $blocked = $editor->preview_record("profile", "", $data);
          if (is_wp_error($blocked) || ! empty($blocked["apply_allowed"]) || "evidence-required" !== ($blocked["risk"] ?? "") || "create" !== ($blocked["operation"] ?? "")) { fwrite(STDERR, wp_json_encode($blocked)); exit(1); }
          $record_id = (string) $blocked["record_id"];

          $prepared = $editor->preview_record("profile", "", $data, true, "CI verified profile source");
          if (is_wp_error($prepared) || empty($prepared["apply_allowed"]) || "create" !== ($prepared["operation"] ?? "")) { fwrite(STDERR, wp_json_encode($prepared)); exit(1); }
          $record_id = (string) $prepared["record_id"];
          $applied = $editor->apply_preview($prepared);
          if (is_wp_error($applied) || empty($applied["verified"]) || empty($applied["snapshot_id"])) { fwrite(STDERR, is_wp_error($applied) ? $applied->get_error_message() : wp_json_encode($applied)); exit(1); }
          update_option("research_evidence_fixture_id", $record_id, false);
          update_option("research_evidence_fixture_snapshot", (string) $applied["snapshot_id"], false);
          $record = $editor->inspect_record("profile", $record_id);
          if (is_wp_error($record) || "verified" !== $record["status"] || "CI verified profile source" !== $record["evidence_reference"] || "Perfil de investigación en sistemas digitales aplicados" !== ($record["translations"]["es"]["title"] ?? "")) { fwrite(STDERR, wp_json_encode($record)); exit(1); }
          $verified_public = eduardo_research_verified_evidence("profile");
          if (1 !== count($verified_public) || "Applied digital systems research profile" !== ($verified_public[0]["title"] ?? "")) { exit(1); }
          $spanish = eduardo_research_localize_record($verified_public[0], "es");
          if ("Perfil de investigación en sistemas digitales aplicados" !== ($spanish["title"] ?? "")) { exit(1); }
          ' --allow-root

      - name: Require evidence for updates and reject stale Preview
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-evidence-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::evidence_editor();
          $id = (string) get_option("research_evidence_fixture_id", "");
          $record = $editor->inspect_record("profile", $id);
          $changes = $record;
          unset($changes["record_id"], $changes["index"], $changes["id"], $changes["evidence_reference"], $changes["verified_at"]);
          $changes["summary"] = "Updated verified profile summary.";
          $blocked = $editor->preview_record("profile", $id, $changes);
          if (is_wp_error($blocked) || ! empty($blocked["apply_allowed"]) || "update" !== ($blocked["operation"] ?? "")) { fwrite(STDERR, wp_json_encode($blocked)); exit(1); }
          $prepared = $editor->preview_record("profile", $id, $changes, true, "CI verified profile update");
          if (is_wp_error($prepared) || empty($prepared["apply_allowed"])) { exit(1); }
          $store = get_option("eduardo_research_evidence", []);
          $store["methods"] = [["id"=>"concurrent-method","status"=>"unverified","title"=>"Concurrent method record"]];
          update_option("eduardo_research_evidence", $store, false);
          $stale = $editor->apply_preview($prepared);
          if (! is_wp_error($stale) || "research_manager_evidence_stale_preview" !== $stale->get_error_code()) { exit(1); }
          unset($store["methods"]); update_option("eduardo_research_evidence", $store, false);
          $fresh = $editor->preview_record("profile", $id, $changes, true, "CI verified profile update");
          $applied = $editor->apply_preview($fresh);
          if (is_wp_error($applied) || empty($applied["verified"]) || empty($applied["snapshot_id"])) { exit(1); }
          $updated = $editor->inspect_record("profile", $id);
          if (is_wp_error($updated) || "Updated verified profile summary." !== $updated["summary"] || "CI verified profile update" !== $updated["evidence_reference"]) { exit(1); }
          update_option("research_evidence_update_snapshot", (string) $applied["snapshot_id"], false);
          ' --allow-root

      - name: Delete verified evidence only through gated Preview and rollback it
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-evidence-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::evidence_editor();
          $id = (string) get_option("research_evidence_fixture_id", "");
          $blocked = $editor->preview_delete_record("profile", $id);
          if (is_wp_error($blocked) || ! empty($blocked["apply_allowed"]) || "delete" !== ($blocked["operation"] ?? "")) { exit(1); }
          $prepared = $editor->preview_delete_record("profile", $id, true, "CI verified evidence removal");
          if (is_wp_error($prepared) || empty($prepared["apply_allowed"])) { exit(1); }
          $deleted = $editor->apply_preview($prepared);
          if (is_wp_error($deleted) || empty($deleted["verified"]) || empty($deleted["snapshot_id"])) { exit(1); }
          $missing = $editor->inspect_record("profile", $id);
          if (! is_wp_error($missing) || "research_manager_evidence_record_missing" !== $missing->get_error_code()) { exit(1); }
          $rollback = $editor->rollback((string) $deleted["snapshot_id"]);
          if (is_wp_error($rollback)) { exit(1); }
          $restored = $editor->inspect_record("profile", $id);
          if (is_wp_error($restored) || "Updated verified profile summary." !== $restored["summary"]) { exit(1); }
          ' --allow-root
