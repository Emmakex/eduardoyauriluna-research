name: Site Architect 475 Relationship Phases Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-greenfield-relationship-phase.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-pairing.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-relations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield-pipeline.php'
      - 'wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php'
      - 'scripts/site-architect-475-relationship-phases-contract-test.php'
      - '.github/workflows/site-architect-475-relationship-phases-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-greenfield-relationship-phase.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-pairing.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-relations.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield-pipeline.php'
      - 'wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php'
      - 'scripts/site-architect-475-relationship-phases-contract-test.php'
      - '.github/workflows/site-architect-475-relationship-phases-quality.yml'

permissions:
  contents: read

jobs:
  vertical-relations:
    name: Theme-bound relationship phases PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax and isolated relationship authority
        shell: bash
        run: |
          set -euo pipefail
          ROOT=wordpress/plugins/eduardo-research-manager
          for path in includes/class-site-architect-greenfield-relationship-phase.php \
                      includes/class-research-manager-blueprint-pairing.php \
                      includes/class-research-manager-blueprint-relations.php \
                      includes/class-research-manager-greenfield-pipeline.php \
                      eduardo-research-manager.php; do
            php -l "$ROOT/$path"
          done
          php -l scripts/site-architect-475-relationship-phases-contract-test.php
          php scripts/site-architect-475-relationship-phases-contract-test.php
      - name: Protect Research behavior and legacy plugin identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('wordpress/plugins/eduardo-research-manager')
          contract = (root/'includes/class-site-architect-greenfield-relationship-phase.php').read_text()
          pipeline = (root/'includes/class-research-manager-greenfield-pipeline.php').read_text()
          pair = (root/'includes/class-research-manager-blueprint-pairing.php').read_text()
          rel = (root/'includes/class-research-manager-blueprint-relations.php').read_text()
          plugin = (root/'eduardo-research-manager.php').read_text()
          assert 'research_line' not in contract and 'eduardo_research' not in contract
          assert 'Site_Architect_Greenfield_Relationship_Phase $pairing' in pipeline
          assert 'Site_Architect_Greenfield_Relationship_Phase $relations' in pipeline
          assert pipeline.count('$this->relationship_authority()') == 3
          assert 'implements Site_Architect_Greenfield_Relationship_Phase' in pair
          assert 'implements Site_Architect_Greenfield_Relationship_Phase' in rel
          assert "return 'research';" in pair and "return 'research';" in rel
          assert 'research_manager_blueprint_pairing_verification_failed' in pair
          assert 'research_manager_blueprint_relation' in rel
          assert 'Plugin Name: Site Architect' in plugin
          assert 'Version: 0.11.1' in plugin
          print('PASS: exact Research vertical authority and 0.11.1 compatibility retained')
          PY
