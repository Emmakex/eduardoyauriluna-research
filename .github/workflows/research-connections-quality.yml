name: Research Connections Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - '.github/workflows/research-connections-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - '.github/workflows/research-connections-quality.yml'

permissions:
  contents: read

jobs:
  connections:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Lint academic connections files
        shell: bash
        run: |
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-connections.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-connections-admin.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-orcid-adapter.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-connections-wp
          mkdir -p /tmp/research-connections-wp
          cd /tmp/research-connections-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Connections' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root

      - name: Verify normalized provider registry without network access
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-connections-wp
          wp eval '
          $service = Eduardo_Research_Manager::connections();
          if (! $service instanceof Eduardo_Research_Manager_Connections) { exit(1); }
          $providers = $service->providers();
          $expected = ["orcid","google_scholar","crossref","zenodo","openalex","github"];
          if ($expected !== array_keys($providers)) { fwrite(STDERR,"provider registry mismatch\n"); exit(1); }
          foreach ($providers as $provider=>$definition) {
              if (! empty($definition["write_enabled"])) { fwrite(STDERR,"writes unexpectedly enabled: {$provider}\n"); exit(1); }
          }
          $statuses = $service->statuses();
          $expected_states = [
              "orcid"=>"disconnected",
              "google_scholar"=>"disconnected",
              "crossref"=>"available",
              "zenodo"=>"disconnected",
              "openalex"=>"available",
              "github"=>"disconnected"
          ];
          foreach ($expected_states as $provider=>$state) {
              if ($state !== (string)($statuses[$provider]["status"] ?? "")) { fwrite(STDERR,"unexpected {$provider} state\n"); exit(1); }
          }
          $orcid_config = $service->validate_configuration("orcid");
          if (is_wp_error($orcid_config) || ! empty($orcid_config["configured"]) || 3 !== count($orcid_config["missing"] ?? [])) { exit(1); }
          if (! empty($orcid_config["secrets_exposed"])) { exit(1); }
          $overview = $service->overview();
          if (6 !== (int)($overview["provider_count"] ?? 0) || ! empty($overview["writes_enabled"])) { exit(1); }
          ' --allow-root

      - name: Resolve verified identifier evidence without claiming OAuth
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-connections-wp
          wp eval '
          update_option("eduardo_research_evidence",[
              "identifiers"=>[[
                  "id"=>"orcid-test-fixture",
                  "status"=>"verified",
                  "label"=>"ORCID",
                  "value"=>"0000-0000-0000-0000",
                  "url"=>"https://orcid.org/0000-0000-0000-0000",
                  "evidence_reference"=>"CI synthetic identifier fixture",
                  "verified_at"=>gmdate(DATE_W3C)
              ]]
          ],false);
          $status = Eduardo_Research_Manager::connections()->status("orcid");
          if (is_wp_error($status)) { exit(1); }
          if ("linked" !== (string)$status["status"]) { fwrite(STDERR,"verified ORCID evidence was not linked\n"); exit(1); }
          if ("0000-0000-0000-0000" !== (string)$status["identifier"]) { exit(1); }
          if (! empty($status["write_enabled"])) { exit(1); }
          if ("oauth" !== (string)$status["mode"]) { exit(1); }
          ' --allow-root

      - name: Render Academic Connections and workspace navigation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-connections-wp
          wp eval '
          wp_set_current_user(1);
          ob_start(); (new Eduardo_Research_Manager_Connections_Admin())->render(); $connections=(string)ob_get_clean();
          foreach ([
              "Academic Connections","Read before write","ORCID","Google Scholar","Crossref","Zenodo","OpenAlex","GitHub",
              "LINKED","AVAILABLE","0000-0000-0000-0000","Manage verified academic identifiers",
              "EDUARDO_RESEARCH_ORCID_CLIENT_ID","no Scholar scraping dependency"
          ] as $needle) {
              if (false===strpos($connections,$needle)) { fwrite(STDERR,"missing connections marker: {$needle}\n"); exit(1); }
          }
          if (false!==strpos($connections,"CLIENT_SECRET=")) { fwrite(STDERR,"secret material leaked\n"); exit(1); }

          ob_start(); (new Eduardo_Research_Manager_Workspace())->render(); $workspace=(string)ob_get_clean();
          foreach (["Academic Connections","admin.php?page=eduardo-research-connections","ready or linked providers"] as $needle) {
              if (false===strpos($workspace,$needle)) { fwrite(STDERR,"missing workspace connection marker: {$needle}\n"); exit(1); }
          }

          (new Eduardo_Research_Manager_Workspace())->menu();
          global $submenu;
          $slugs=[];
          foreach ((array)($submenu["eduardo-research-workspace"] ?? []) as $item) { if (isset($item[2])) { $slugs[]=(string)$item[2]; } }
          if (! in_array("eduardo-research-connections",$slugs,true)) { fwrite(STDERR,"Academic Connections submenu missing\n"); exit(1); }
          ' --allow-root

      - name: Exercise secure ORCID OAuth and read-only sync preview with mocked HTTP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-connections-wp
          wp eval '
          wp_set_current_user(1);
          define("EDUARDO_RESEARCH_ORCID_CLIENT_ID","APP-CI-ORCID");
          define("EDUARDO_RESEARCH_ORCID_CLIENT_SECRET","ci-secret-never-render");
          define("EDUARDO_RESEARCH_ORCID_REDIRECT_URI","https://example.test/wp-admin/admin-post.php?action=eduardo_research_orcid_callback");
          define("EDUARDO_RESEARCH_ORCID_ENVIRONMENT","sandbox");

          $adapter = Eduardo_Research_Manager::orcid();
          if (! $adapter instanceof Eduardo_Research_Manager_Orcid_Adapter) { exit(1); }
          $caps = $adapter->capabilities();
          if (empty($caps["oauth"]) || empty($caps["profile_read"]) || empty($caps["works_read"]) || ! empty($caps["external_write"])) { exit(1); }
          $config = $adapter->configuration();
          if (empty($config["configured"]) || "sandbox" !== $config["environment"] || ! empty($config["secrets_exposed"])) { exit(1); }
          if (array_key_exists("client_secret",$config)) { fwrite(STDERR,"ORCID secret leaked from configuration model\n"); exit(1); }

          $begin = $adapter->begin_authorization();
          if (is_wp_error($begin) || false===strpos($begin["authorization_url"],"https://sandbox.orcid.org/oauth/authorize")) { exit(1); }
          parse_str((string)wp_parse_url($begin["authorization_url"],PHP_URL_QUERY),$query);
          if ("/authenticate" !== (string)($query["scope"] ?? "") || empty($query["state"])) { exit(1); }
          $invalid = $adapter->exchange_code("ci-code","wrong-state");
          if (! is_wp_error($invalid) || "research_manager_orcid_oauth_state_invalid" !== $invalid->get_error_code()) { exit(1); }

          $begin = $adapter->begin_authorization();
          parse_str((string)wp_parse_url($begin["authorization_url"],PHP_URL_QUERY),$query);
          $state=(string)$query["state"];

          add_filter("pre_http_request",static function($pre,$args,$url){
              if (str_contains($url,"/oauth/token")) {
                  return ["headers"=>[],"body"=>wp_json_encode([
                      "access_token"=>"ci-access-token","token_type"=>"bearer","refresh_token"=>"ci-refresh-token",
                      "scope"=>"/authenticate","orcid"=>"0000-0002-1825-0097","name"=>"Eduardo Jose Yauri Luna"
                  ]),"response"=>["code"=>200,"message"=>"OK"],"cookies"=>[]];
              }
              if (str_contains($url,"/person")) {
                  return ["headers"=>[],"body"=>wp_json_encode([
                      "name"=>[
                          "given-names"=>["value"=>"Eduardo Jose"],
                          "family-name"=>["value"=>"Yauri Luna"],
                          "credit-name"=>["value"=>"Eduardo Jose Yauri Luna"]
                      ],
                      "biography"=>["content"=>"Synthetic ORCID profile fixture"]
                  ]),"response"=>["code"=>200,"message"=>"OK"],"cookies"=>[]];
              }
              if (str_contains($url,"/works")) {
                  return ["headers"=>[],"body"=>wp_json_encode([
                      "group"=>[["work-summary"=>[[]]]]
                  ]),"response"=>["code"=>200,"message"=>"OK"],"cookies"=>[]];
              }
              return $pre;
          },10,3);

          $connected = $adapter->exchange_code("ci-code",$state);
          if (is_wp_error($connected) || "connected" !== $connected["status"] || "0000-0002-1825-0097" !== $connected["identifier"]) { exit(1); }
          $status = Eduardo_Research_Manager::connections()->status("orcid");
          if (is_wp_error($status) || "connected" !== $status["status"] || false!==strpos(wp_json_encode($status),"ci-access-token")) { exit(1); }

          $evidence_before = wp_json_encode(get_option("eduardo_research_evidence",[]));
          $profile = $adapter->profile();
          if (is_wp_error($profile) || "Eduardo Jose Yauri Luna" !== (string)($profile["profile"]["display_name"] ?? "")) { exit(1); }
          $preview = $adapter->sync_preview();
          if (is_wp_error($preview) || "preview" !== $preview["status"] || empty($preview["identifier_matches"])) { exit(1); }
          if (empty($preview["requires_reconciliation"]) || ! empty($preview["automatic_local_apply"]) || ! empty($preview["external_write"])) { exit(1); }
          if ($evidence_before !== wp_json_encode(get_option("eduardo_research_evidence",[]))) { fwrite(STDERR,"ORCID preview mutated Academic Evidence\n"); exit(1); }

          $disconnect = $adapter->disconnect();
          if (is_wp_error($disconnect) || empty($disconnect["token_removed"]) || "linked" !== $disconnect["status"]) { exit(1); }
          if (false !== get_option("eduardo_research_orcid_token",false)) { fwrite(STDERR,"ORCID token was not removed\n"); exit(1); }
          ' --allow-root
