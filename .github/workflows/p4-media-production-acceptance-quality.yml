name: Phase 4 Media Production Acceptance Orchestrator Quality

on:
  pull_request:
    paths:
      - 'scripts/p4-media-production-acceptance.sh'
      - 'scripts/p4-media-production-closeout.php'
      - '.github/workflows/p4-media-production-acceptance-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p4-media-production-acceptance.sh'
      - 'scripts/p4-media-production-closeout.php'
      - '.github/workflows/p4-media-production-acceptance-quality.yml'

concurrency:
  group: p4-media-production-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  orchestrator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          bash -n scripts/p4-media-production-acceptance.sh
          php -l scripts/p4-media-production-closeout.php

      - name: Help paths require no credential
        run: |
          bash scripts/p4-media-production-acceptance.sh --help
          php scripts/p4-media-production-closeout.php --help

      - name: Enforce bounded child-client orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-production-acceptance.sh').read_text()
          required = [
              'p4-media-production-preflight.php',
              'p4-media-metadata-production-acceptance.php',
              'p4-media-assignment-production-acceptance.php',
              'p4-media-production-closeout.php',
              'p4-media-revocation-probe.php',
              '--preflight-only',
              '--apply',
              '--confirm-production',
              '--revocation-proof',
              'REVOCATION_REQUIRED.txt',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing orchestrator contract token: {token}')

          forbidden = [
              'curl ', 'wget ', 'Authorization: Bearer', 'printenv',
              'set -x', 'wp credential', 'wp-cli', '/wp-json/',
              'git add', 'git commit', 'git push',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'orchestrator must delegate network/local mutation work: {token}')
          PY

      - name: Enforce Preview first and explicit Apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-production-acceptance.sh').read_text()
          preflight = text.index('run_php "P4.2 read-only production preflight"')
          metadata = text.index('run_php "P4.3 metadata lifecycle ${MODE}"')
          assignment = text.index('run_php "P4.4 assignment lifecycle ${MODE}"')
          closeout = text.index('run_php "P4.5 read-only production closeout"')
          if not preflight < metadata < assignment < closeout:
              raise SystemExit('production acceptance order changed')
          if '"$MODE" == "apply" && "$CONFIRM_PRODUCTION" -ne 1' not in text:
              raise SystemExit('explicit production confirmation guard missing')
          if 'No production mutation was executed.' not in text:
              raise SystemExit('Preview non-mutation operator signal missing')
          if 'revoke the temporary Media credential locally' not in text:
              raise SystemExit('local revocation boundary missing')
          PY

      - name: Enforce closeout against declared Media capability shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-production-closeout.php').read_text()
          required = [
              "true !== ($mediaControl['inventory'] ?? null)",
              "true !== ($mediaControl['inspection'] ?? null)",
              "$mediaControl['write_available']",
              "$mediaControl['write_scope']",
              "$mediaControl['operations']",
              "$mediaControl['metadata_transport']",
              "$mediaControl['assignment']",
              "$mediaControl['diagnostics']",
              "stale_attachment_revision_protection",
              "dual_resource_stale_protection",
              "rendered_verification",
              "filesystem_paths_exposed",
              "arbitrary_upload_proxy",
              "destructive_delete",
              "arbitrary_wordpress_proxy",
              "arbitrary_post_meta",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing closeout Media contract guard: {token}')
          if "['inventory']['available']" in text or "['metadata']['available']" in text:
              raise SystemExit('closeout must not assume obsolete nested available flags')
          PY

      - name: Enforce token non-disclosure boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          for path in [
              'scripts/p4-media-production-acceptance.sh',
              'scripts/p4-media-production-closeout.php',
          ]:
              text = pathlib.Path(path).read_text()
              for number, line in enumerate(text.splitlines(), start=1):
                  if re.search(r'\b(?:echo|printf|cat)\b.*\$\{?ERM_TOKEN', line):
                      raise SystemExit(f'possible token value disclosure in {path} on line {number}')
                  if re.search(r'\bexport\s+ERM_TOKEN=', line):
                      raise SystemExit(f'possible token rebinding in {path} on line {number}')
          wrapper = pathlib.Path('scripts/p4-media-production-acceptance.sh').read_text()
          if 'The wrapper never stores or prints ERM_TOKEN.' not in wrapper:
              raise SystemExit('operator secrecy statement missing')
          PY
