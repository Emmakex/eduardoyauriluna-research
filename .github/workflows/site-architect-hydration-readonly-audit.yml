name: Site Architect Hydration Read-Only Delta Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/site-architect-hydration-readonly-audit.py'

permissions:
  contents: read

concurrency:
  group: phase2c-ovh-production
  cancel-in-progress: false

jobs:
  inspect:
    name: Compare 24 live Theme language slots to accepted Blueprint without Apply
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic read-only audit and existing canonical Preview contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/site-architect-hydration-readonly-audit.py
          python3 scripts/site-architect-hydration-readonly-audit.py --self-test
          python3 scripts/site-architect-greenfield-protected-preview.py --self-test

      - name: Prepare existing strictly pinned SSH trust
        shell: bash
        env:
          OVH_MCP_SSH_KEY: ${{ secrets.OVH_MCP_SSH_KEY }}
          OVH_MCP_SSH_KNOWN_HOSTS: ${{ secrets.OVH_MCP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${OVH_MCP_SSH_KEY:?required SSH key missing}"
          : "${OVH_MCP_SSH_KNOWN_HOSTS:?required pinned host missing}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_MCP_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$OVH_MCP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Execute read-only bounded Theme inventory comparison on OVH
        shell: bash
        env:
          OVH_MCP_HOST: ${{ secrets.OVH_MCP_HOST }}
          OVH_MCP_USER: ${{ secrets.OVH_MCP_USER }}
        run: |
          set -euo pipefail
          : "${OVH_MCP_HOST:?protected OVH host missing}"
          : "${OVH_MCP_USER:?protected OVH user missing}"
          TARGET="${OVH_MCP_USER}@${OVH_MCP_HOST}"
          DIR="/tmp/site-architect-hydration-460-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SCP=(scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          cleanup() { "${SSH[@]}" "$TARGET" "rm -rf -- '$DIR'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${SSH[@]}" "$TARGET" "umask 077; mkdir -m 700 -- '$DIR'"
          "${SCP[@]}" \
            scripts/site-architect-hydration-readonly-audit.py \
            scripts/site-architect-greenfield-protected-preview.py \
            scripts/site-architect-greenfield-authz-preflight.py \
            scripts/research-gateway-v2-greenfield-plan.py \
            scripts/phase2d-command-runner.py \
            "$TARGET:$DIR/"
          "${SCP[@]}" \
            wordpress/plugins/eduardo-research-manager/blueprints/eduardo-research.json \
            "$TARGET:$DIR/eduardo-research-blueprint-audit.json"
          "${SSH[@]}" "$TARGET" "python3 '$DIR/site-architect-hydration-readonly-audit.py' --inspect-live"

      - name: Verify public MCP health without any content writes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://mcp.kairoseth.com/healthz \
            | jq -e '.ok == true and .routing == "shared" and .persistent_telemetry == true' >/dev/null
          echo 'HYDRATION_READONLY_PUBLIC_HEALTH_OK public_site_apply=not_executed'
