name: Research Manager Remote M1 Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-manager-remote-m1-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-manager-remote-m1-quality.yml'

permissions:
  contents: read

jobs:
  remote-m1:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Ensure WP-CLI
        shell: bash
        run: bash .github/scripts/ensure-wp-cli.sh

      - name: Lint M1 bridge
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-credentials.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-audit.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-request-guard.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-rest.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-admin.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-resource-inventory.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-resource-inventory-rest.php
          python3 - <<'PY'
          from pathlib import Path

          source = Path('wordpress/plugins/eduardo-research-manager/includes/class-research-manager-remote-resource-inventory-rest.php').read_text(encoding='utf-8')
          duplicated = 'pages|insights|lines|outputs|projects|software|datasets'
          if duplicated in source:
              raise SystemExit('Remote Resource Inventory REST must not duplicate the inventory type alternation')
          if 'array_keys($this->inventory->types())' not in source:
              raise SystemExit('Remote Resource Inventory REST must derive route type membership from Resource Inventory')
          if '$type_pattern=$this->type_route_pattern();' not in source:
              raise SystemExit('Remote Resource Inventory REST routes must share the derived type pattern')
          PY

      - name: Install clean Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-manager-remote-m1
          mkdir -p /tmp/research-manager-remote-m1
          cd /tmp/research-manager-remote-m1
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp config set WP_ENVIRONMENT_TYPE development --type=constant --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Manager Remote M1' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Verify M1 security, independent credentials and read API
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/research-manager-remote-m1-test.php <<'PHP'
          <?php
          wp_set_current_user(1);
          $credentials = Eduardo_Research_Manager::remote_credentials();
          $audit = Eduardo_Research_Manager::remote_audit();

          function fail_m1(string $message, mixed $context = null): never {
              fwrite(STDERR, "M1 FAIL: {$message}\n");
              if (null !== $context) { fwrite(STDERR, wp_json_encode($context, JSON_PRETTY_PRINT) . "\n"); }
              exit(1);
          }

          function remote_request(string $route, string $token = '', ?string $nonce = null, ?string $request_id = null, ?int $timestamp = null): WP_REST_Response {
              $request = new WP_REST_Request('GET', '/research-manager/v1/' . ltrim($route, '/'));
              if ('' !== $token) { $request->set_header('Authorization', 'Bearer ' . $token); }
              $request->set_header('X-Research-Manager-Request-Id', $request_id ?: 'req-' . wp_generate_uuid4());
              $request->set_header('X-Research-Manager-Nonce', $nonce ?: 'nonce-' . str_replace('-', '', wp_generate_uuid4()));
              $request->set_header('X-Research-Manager-Timestamp', (string) ($timestamp ?? time()));
              return rest_do_request($request);
          }

          function normalise_scopes(array $scopes): array {
              $scopes = array_values(array_unique(array_map('strval', $scopes)));
              sort($scopes);
              return $scopes;
          }

          rest_get_server();
          $routes = rest_get_server()->get_routes();
          foreach (array('status','versions','capabilities','readiness','diagnostics') as $endpoint) {
              $route = '/research-manager/v1/' . $endpoint;
              if (! isset($routes[$route])) { fail_m1('route not registered: ' . $route); }
          }

          $inventory = new Eduardo_Research_Manager_Resource_Inventory();
          $route_types = array_keys($inventory->types());
          $escaped_route_types = array_map(static fn(string $type): string => preg_quote($type, '/'), $route_types);
          $resource_type_pattern = implode('|', $escaped_route_types);
          foreach (array(
              '/research-manager/v1/resources',
              '/research-manager/v1/resources/(?P<type>' . $resource_type_pattern . ')',
              '/research-manager/v1/resources/(?P<type>' . $resource_type_pattern . ')/(?P<identifier>[A-Za-z0-9._:-]+)',
          ) as $route) {
              if (! isset($routes[$route])) { fail_m1('resource inventory route did not follow inventory type authority: ' . $route); }
          }

          $unauth = remote_request('status');
          if (401 !== $unauth->get_status() || 'authentication_failed' !== (string) ($unauth->get_data()['code'] ?? '')) {
              fail_m1('unauthenticated request was not rejected', $unauth->get_data());
          }

          $primaryScopes = array('site.read','site.diagnostics');
          $issued = $credentials->issue_token($primaryScopes, 1, 'CI Primary Bridge');
          if (is_wp_error($issued) || empty($issued['token'])) { fail_m1('primary token issuance failed', is_wp_error($issued) ? $issued->get_error_message() : $issued); }
          $token1 = (string) $issued['token'];
          $stored = get_option('eduardo_research_manager_remote_connection', array());
          $stored_json = wp_json_encode($stored);
          if (false !== strpos($stored_json, $token1) || isset($stored['token'])) { fail_m1('raw primary token persisted in connection state', $stored); }
          if (empty($stored['token_hash'])) { fail_m1('hashed primary credential missing'); }

          foreach (array('status','versions','capabilities','readiness','diagnostics') as $endpoint) {
              $response = remote_request($endpoint, $token1);
              if (200 !== $response->get_status()) { fail_m1($endpoint . ' did not return 200', $response->get_data()); }
              $json = wp_json_encode($response->get_data());
              if (false !== strpos($json, $token1) || false !== strpos($json, 'token_hash')) { fail_m1($endpoint . ' leaked credential material', $response->get_data()); }
              if (empty($response->get_data()['request_id'])) { fail_m1($endpoint . ' omitted request_id'); }
          }

          $capabilities = remote_request('capabilities', $token1)->get_data();
          $cap_data = $capabilities['data'] ?? array();
          if (normalise_scopes($primaryScopes) !== normalise_scopes((array) ($cap_data['granted_scopes'] ?? array()))) {
              fail_m1('primary capabilities omitted or broadened granted scopes', $cap_data);
          }
          if ('primary' !== (string) ($credentials->state()['kind'] ?? '')) {
              fail_m1('authenticated primary state did not report primary kind', $credentials->state());
          }
          if (empty($cap_data['mutation_transport']) || ! array_key_exists('available', $cap_data['mutation_transport'])) {
              fail_m1('capabilities omitted mutation transport declaration', $cap_data);
          }

          $credentials->set_scopes(array('site.read'));
          $denied = remote_request('readiness', $token1);
          if (403 !== $denied->get_status() || 'scope_denied' !== (string) ($denied->get_data()['code'] ?? '')) {
              fail_m1('scope denial failed', $denied->get_data());
          }
          $credentials->set_scopes($primaryScopes);

          $replay_nonce = 'nonce-replay-1234567890';
          $first = remote_request('status', $token1, $replay_nonce, 'req-replay-first');
          if (200 !== $first->get_status()) { fail_m1('first replay control request failed', $first->get_data()); }
          $replay = remote_request('status', $token1, $replay_nonce, 'req-replay-second');
          if (409 !== $replay->get_status() || 'validation_failed' !== (string) ($replay->get_data()['code'] ?? '')) {
              fail_m1('nonce replay was not rejected', $replay->get_data());
          }

          $expired = remote_request('status', $token1, null, null, time() - 1000);
          if (401 !== $expired->get_status() || 'validation_failed' !== (string) ($expired->get_data()['code'] ?? '')) {
              fail_m1('expired request timestamp was not rejected', $expired->get_data());
          }

          $disabled_state = $credentials->set_enabled(false);
          if (is_wp_error($disabled_state)) { fail_m1('disable failed', $disabled_state->get_error_message()); }
          $disabled = remote_request('status', $token1);
          if (401 !== $disabled->get_status() || 'authentication_failed' !== (string) ($disabled->get_data()['code'] ?? '')) {
              fail_m1('disabled primary connection still authenticated', $disabled->get_data());
          }
          $enabled_state = $credentials->set_enabled(true);
          if (is_wp_error($enabled_state)) { fail_m1('re-enable failed', $enabled_state->get_error_message()); }
          if (200 !== remote_request('status', $token1)->get_status()) { fail_m1('re-enabled primary connection did not authenticate'); }

          $rotated = $credentials->rotate(1);
          if (is_wp_error($rotated) || empty($rotated['token'])) { fail_m1('primary rotation failed'); }
          $token2 = (string) $rotated['token'];
          if ($token1 === $token2) { fail_m1('primary rotation reused the previous token'); }
          $old = remote_request('status', $token1);
          if (401 !== $old->get_status() || 'authentication_failed' !== (string) ($old->get_data()['code'] ?? '')) {
              fail_m1('old primary token remained valid after rotation', $old->get_data());
          }
          if (200 !== remote_request('status', $token2)->get_status()) { fail_m1('rotated primary token is not valid'); }

          // Independent temporary credential: this must never replace or broaden primary state.
          $primaryBeforeTemporary = get_option('eduardo_research_manager_remote_connection', array());
          $temporaryScopes = array(
              'site.read',
              'site.diagnostics',
              'media.read',
              'media.write',
              'insights.read',
              'insights.write',
              'operations.apply',
              'operations.rollback',
          );
          $temporaryIssued = $credentials->issue_temporary_token($temporaryScopes, 1, 'CI Phase 4 Media');
          if (is_wp_error($temporaryIssued) || empty($temporaryIssued['token']) || empty($temporaryIssued['connection']['connection_id'])) {
              fail_m1('temporary credential issuance failed', is_wp_error($temporaryIssued) ? $temporaryIssued->get_error_message() : $temporaryIssued);
          }
          $temporaryToken = (string) $temporaryIssued['token'];
          $temporaryConnectionId = (string) $temporaryIssued['connection']['connection_id'];
          if (! str_starts_with($temporaryConnectionId, 'rmt_')) { fail_m1('temporary connection id is not namespaced', $temporaryIssued['connection']); }
          if ('temporary' !== (string) ($temporaryIssued['connection']['kind'] ?? '')) { fail_m1('temporary connection kind missing', $temporaryIssued['connection']); }

          $primaryAfterTemporary = get_option('eduardo_research_manager_remote_connection', array());
          foreach (array('connection_id','token_hash','token_prefix','scopes','generation','enabled') as $field) {
              if (($primaryBeforeTemporary[$field] ?? null) !== ($primaryAfterTemporary[$field] ?? null)) {
                  fail_m1('temporary issuance mutated primary field: ' . $field, array('before'=>$primaryBeforeTemporary[$field] ?? null, 'after'=>$primaryAfterTemporary[$field] ?? null));
              }
          }

          $temporaryStored = get_option('eduardo_research_manager_remote_temporary_connections', array());
          $temporaryStoredJson = wp_json_encode($temporaryStored);
          if (false !== strpos($temporaryStoredJson, $temporaryToken) || isset($temporaryStored[$temporaryConnectionId]['token'])) {
              fail_m1('raw temporary token persisted', $temporaryStored[$temporaryConnectionId] ?? array());
          }
          if (empty($temporaryStored[$temporaryConnectionId]['token_hash'])) { fail_m1('temporary token hash missing'); }

          $temporaryCapabilities = remote_request('capabilities', $temporaryToken);
          if (200 !== $temporaryCapabilities->get_status()) { fail_m1('temporary credential could not authenticate', $temporaryCapabilities->get_data()); }
          $temporaryData = (array) ($temporaryCapabilities->get_data()['data'] ?? array());
          if ($temporaryConnectionId !== (string) ($temporaryData['connection_id'] ?? '')) {
              fail_m1('temporary capabilities returned wrong connection id', $temporaryData);
          }
          if (normalise_scopes($temporaryScopes) !== normalise_scopes((array) ($temporaryData['granted_scopes'] ?? array()))) {
              fail_m1('temporary capabilities scope profile drifted', $temporaryData);
          }
          if ('temporary' !== (string) ($credentials->state()['kind'] ?? '')) {
              fail_m1('authenticated temporary state did not report temporary kind', $credentials->state());
          }

          // The stable token must continue to authenticate with its original narrow scope set.
          $primaryCapabilitiesAfterTemporary = remote_request('capabilities', $token2);
          if (200 !== $primaryCapabilitiesAfterTemporary->get_status()) { fail_m1('primary token stopped working after temporary issuance'); }
          $primaryDataAfterTemporary = (array) ($primaryCapabilitiesAfterTemporary->get_data()['data'] ?? array());
          if (normalise_scopes($primaryScopes) !== normalise_scopes((array) ($primaryDataAfterTemporary['granted_scopes'] ?? array()))) {
              fail_m1('temporary issuance broadened primary capabilities', $primaryDataAfterTemporary);
          }

          $temporaryConnections = $credentials->temporary_connections();
          $temporaryIds = array_map(static fn(array $connection): string => (string) ($connection['connection_id'] ?? ''), $temporaryConnections);
          if (! in_array($temporaryConnectionId, $temporaryIds, true)) { fail_m1('temporary connection not listed'); }

          $revokedTemporary = $credentials->revoke_temporary($temporaryConnectionId);
          if (is_wp_error($revokedTemporary) || ! empty($revokedTemporary['enabled']) || ! empty($revokedTemporary['credential_present'])) {
              fail_m1('temporary revocation did not clear only the temporary credential', $revokedTemporary);
          }
          $temporaryDenied = remote_request('status', $temporaryToken);
          if (401 !== $temporaryDenied->get_status() || 'authentication_failed' !== (string) ($temporaryDenied->get_data()['code'] ?? '')) {
              fail_m1('revoked temporary credential still authenticated', $temporaryDenied->get_data());
          }
          if (200 !== remote_request('status', $token2)->get_status()) {
              fail_m1('temporary revocation affected the primary credential');
          }
          $primaryAfterTemporaryRevoke = get_option('eduardo_research_manager_remote_connection', array());
          foreach (array('connection_id','token_hash','token_prefix','scopes','generation','enabled') as $field) {
              if (($primaryBeforeTemporary[$field] ?? null) !== ($primaryAfterTemporaryRevoke[$field] ?? null)) {
                  fail_m1('temporary lifecycle mutated primary field: ' . $field);
              }
          }

          // Primary revocation remains independent and backward-compatible.
          $credentials->revoke();
          $revoked = remote_request('status', $token2);
          if (401 !== $revoked->get_status() || 'authentication_failed' !== (string) ($revoked->get_data()['code'] ?? '')) {
              fail_m1('revoked primary token remained valid', $revoked->get_data());
          }

          $audit_json = wp_json_encode(get_option('eduardo_research_manager_remote_audit', array()));
          foreach (array($token1, $token2, $temporaryToken) as $secret) {
              if (false !== strpos($audit_json, $secret)) { fail_m1('audit log leaked credential material'); }
          }
          if (false !== strpos($audit_json, 'token_hash')) { fail_m1('audit log leaked token hash'); }
          if (count($audit->recent(200)) < 12) { fail_m1('expected audit events were not recorded'); }

          ob_start();
          (new Eduardo_Research_Manager_Remote_Admin($credentials, $audit))->render();
          $admin_html = (string) ob_get_clean();
          foreach (array('Research Manager Remote','Primary production connection','Primary connection controls','Primary scopes','Temporary scoped sessions','Recent remote audit') as $needle) {
              if (false === strpos($admin_html, $needle)) { fail_m1('remote admin marker missing: ' . $needle); }
          }
          if (false !== strpos($admin_html, 'token_hash') || false !== strpos($admin_html, $token1) || false !== strpos($admin_html, $token2) || false !== strpos($admin_html, $temporaryToken)) {
              fail_m1('remote admin leaked credential material');
          }

          echo "M1 remote Manager primary + temporary credential acceptance OK\n";
          PHP

          cd /tmp/research-manager-remote-m1
          wp eval-file /tmp/research-manager-remote-m1-test.php --allow-root
