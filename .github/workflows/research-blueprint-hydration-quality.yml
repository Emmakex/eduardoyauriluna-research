name: Research Blueprint Hydration Quality

on:
  pull_request:
    paths:
      - 'config/research-site-blueprint.json'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-bootstrap.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-hydrator.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-page-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-identity-profile.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-line-resource.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-plan.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-snapshots.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-contract.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager.php'
      - 'wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php'
      - 'wordpress/themes/eduardo-research/functions.php'
      - 'wordpress/themes/eduardo-research/inc/research-preset.php'
      - 'wordpress/themes/eduardo-research/inc/research-install.php'
      - 'wordpress/themes/eduardo-research/inc/research-language.php'
      - 'wordpress/themes/eduardo-research/inc/research-content-language.php'
      - 'wordpress/themes/eduardo-research/inc/research-model.php'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-blueprint-hydration-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - 'config/research-site-blueprint.json'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-blueprint-hydration-quality.yml'

concurrency:
  group: research-blueprint-hydration-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hydration-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Ensure WP-CLI
        shell: bash
        run: bash .github/scripts/ensure-wp-cli.sh

      - name: Guard legacy Identity language-storage authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-hydrator.php')
          source = path.read_text(encoding='utf-8')
          forbidden = (
              "$slots['en']",
              "$slots['es']",
              "$seed['headline']",
              "$seed['headline_es']",
          )
          leaked = [token for token in forbidden if token in source]
          if leaked:
              raise SystemExit('Blueprint Hydrator reconstructs legacy language storage directly: ' + ', '.join(leaked))
          if '$contract->identity_headline_field($language)' not in source:
              raise SystemExit('Blueprint Hydrator must resolve Identity headline storage through the Greenfield Theme Contract')
          PY

      - name: Install WordPress, Theme and Manager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-hydration-wp
          mkdir -p /tmp/research-hydration-wp
          cd /tmp/research-hydration-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Eduardo Research Hydration' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Bootstrap and hydrate canonical EN ES blueprint
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-hydration-wp
          wp eval '
          wp_set_current_user(1);
          $path = getenv("GITHUB_WORKSPACE") . "/config/research-site-blueprint.json";
          $blueprint = json_decode((string) file_get_contents($path), true);
          if (! is_array($blueprint)) { fwrite(STDERR, "Blueprint JSON invalid\n"); exit(1); }

          // Theme activation owns preset-page installation; Manager bootstrap creates the 8 evidence-backed Research Lines.
          $boot_preview = Eduardo_Research_Manager::bootstrap()->preview($blueprint);
          if (is_wp_error($boot_preview) || empty($boot_preview["apply_allowed"]) || 8 !== (int) $boot_preview["operation_count"] || 12 !== (int) $boot_preview["skipped_count"]) {
              fwrite(STDERR, is_wp_error($boot_preview) ? $boot_preview->get_error_message() : wp_json_encode($boot_preview)); exit(1);
          }
          $boot = Eduardo_Research_Manager::bootstrap()->apply($blueprint);
          if (is_wp_error($boot) || empty($boot["verified"]) || 8 !== (int) $boot["operation_count"] || 12 !== (int) $boot["skipped_count"]) {
              fwrite(STDERR, is_wp_error($boot) ? $boot->get_error_message() : wp_json_encode($boot)); exit(1);
          }
          $lines = get_posts(["post_type"=>"research_line","post_status"=>"publish","posts_per_page"=>20,"suppress_filters"=>true]);
          if (8 !== count($lines)) { fwrite(STDERR, "Expected 8 Research Lines\n"); exit(1); }
          foreach ($lines as $line) {
              if (! $line instanceof WP_Post || "verified" !== (string) get_post_meta($line->ID, "_research_evidence_status", true)) { exit(1); }
          }

          $repeat_boot = Eduardo_Research_Manager::bootstrap()->preview($blueprint);
          if (is_wp_error($repeat_boot) || 0 !== (int) $repeat_boot["operation_count"] || 20 !== (int) $repeat_boot["skipped_count"]) {
              fwrite(STDERR, is_wp_error($repeat_boot) ? $repeat_boot->get_error_message() : wp_json_encode($repeat_boot)); exit(1);
          }

          // Initial hydration contains one canonical Identity operation plus 24 bilingual Page hydration operations.
          $preview = Eduardo_Research_Manager::hydrator()->preview($blueprint);
          if (is_wp_error($preview) || empty($preview["apply_allowed"]) || 25 !== (int) $preview["operation_count"] || ! empty($preview["requires_legacy_discovery"]) || ! empty($preview["requires_legacy_mapping"]) || ! empty($preview["requires_gutenberg_layout"])) {
              fwrite(STDERR, is_wp_error($preview) ? $preview->get_error_message() : wp_json_encode($preview)); exit(1);
          }
          if ("identity-profile" !== (string) ($preview["operations"][0]["resource"] ?? "")) { fwrite(STDERR, "Canonical Identity seed missing from hydration Preview\n"); exit(1); }

          $hydrated = Eduardo_Research_Manager::hydrator()->apply($blueprint);
          if (is_wp_error($hydrated) || empty($hydrated["verified"]) || 25 !== (int) $hydrated["operation_count"]) {
              fwrite(STDERR, is_wp_error($hydrated) ? $hydrated->get_error_message() : wp_json_encode($hydrated)); exit(1);
          }

          // Identity is now a first-class canonical resource, not a free Page slot.
          $identity = (new Eduardo_Research_Manager_Identity_Profile())->inspect();
          if (is_wp_error($identity)
              || "Eduardo Jose Yauri Luna" !== (string) ($identity["name"] ?? "")
              || "Artificial Intelligence, Digital Transformation and Autonomous Systems for Business Processes" !== (string) ($identity["headline"] ?? "")
              || "Inteligencia Artificial, Transformación Digital y Sistemas Autónomos para Procesos Empresariales" !== (string) ($identity["headline_es"] ?? "")
              || "Greenfield canonical blueprint v1" !== (string) ($identity["evidence_reference"] ?? "")
              || "" === (string) ($identity["verified_at"] ?? "")) {
              fwrite(STDERR, is_wp_error($identity) ? $identity->get_error_message() : wp_json_encode($identity)); exit(1);
          }
          $legacy_identity_slot = Eduardo_Research_Manager::pages()->verify_hydration("home", "en", ["researcher-name"=>"Eduardo Jose Yauri Luna"]);
          if (! is_wp_error($legacy_identity_slot)) { fwrite(STDERR, "Canonical identity unexpectedly remained writable as a Page slot\n"); exit(1); }

          // Once Identity exists, only the 24 Page hydration operations remain and all must already match.
          $second_preview = Eduardo_Research_Manager::hydrator()->preview($blueprint);
          if (is_wp_error($second_preview) || 24 !== (int) $second_preview["operation_count"]) { fwrite(STDERR, is_wp_error($second_preview) ? $second_preview->get_error_message() : wp_json_encode($second_preview)); exit(1); }
          foreach ($second_preview["operations"] as $operation) {
              if ("already-matching" !== (string) $operation["status"] || empty($operation["apply_allowed"])) { fwrite(STDERR, wp_json_encode($operation)); exit(1); }
          }

          $rollback = Eduardo_Research_Manager::hydrator()->rollback($hydrated["snapshot_ids"]);
          if (is_wp_error($rollback) || 25 !== count($hydrated["snapshot_ids"]) || count($hydrated["snapshot_ids"]) !== (int) $rollback["snapshot_count"]) { exit(1); }
          $home_state = Eduardo_Research_Manager::pages()->inspect("home", "en");
          if (is_wp_error($home_state) || ! empty($home_state["stored_slots"])) { fwrite(STDERR, wp_json_encode($home_state)); exit(1); }
          $identity_after = get_option("eduardo_research_identity", null);
          if (null !== $identity_after && false !== $identity_after) { fwrite(STDERR, "Canonical Identity seed survived hydration rollback\n"); exit(1); }

          // Canonical site.identity is authoritative even when legacy Home aliases conflict.
          $canonical_conflict = $blueprint;
          foreach ($canonical_conflict["pages"] as &$record) {
              if ("home" !== (string) ($record["key"] ?? "")) { continue; }
              $record["slots"]["en"]["researcher-name"] = "Legacy Wrong EN";
              $record["slots"]["es"]["researcher-name"] = "Legacy Wrong ES";
              $record["slots"]["en"]["researcher-headline"] = "Legacy Wrong English Headline";
              $record["slots"]["es"]["researcher-headline"] = "Legacy Wrong Spanish Headline";
              break;
          }
          unset($record);
          $conflict_preview = Eduardo_Research_Manager::hydrator()->preview($canonical_conflict);
          if (is_wp_error($conflict_preview) || 25 !== (int) $conflict_preview["operation_count"]) {
              fwrite(STDERR, is_wp_error($conflict_preview) ? $conflict_preview->get_error_message() : wp_json_encode($conflict_preview)); exit(1);
          }
          $conflict_hydrated = Eduardo_Research_Manager::hydrator()->apply($canonical_conflict);
          if (is_wp_error($conflict_hydrated) || empty($conflict_hydrated["verified"]) || 25 !== (int) $conflict_hydrated["operation_count"]) {
              fwrite(STDERR, is_wp_error($conflict_hydrated) ? $conflict_hydrated->get_error_message() : wp_json_encode($conflict_hydrated)); exit(1);
          }
          $conflict_identity = (new Eduardo_Research_Manager_Identity_Profile())->inspect();
          if (is_wp_error($conflict_identity)
              || "Eduardo Jose Yauri Luna" !== (string) ($conflict_identity["name"] ?? "")
              || "Artificial Intelligence, Digital Transformation and Autonomous Systems for Business Processes" !== (string) ($conflict_identity["headline"] ?? "")
              || "Inteligencia Artificial, Transformación Digital y Sistemas Autónomos para Procesos Empresariales" !== (string) ($conflict_identity["headline_es"] ?? "")) {
              fwrite(STDERR, is_wp_error($conflict_identity) ? $conflict_identity->get_error_message() : wp_json_encode($conflict_identity)); exit(1);
          }
          $conflict_rollback = Eduardo_Research_Manager::hydrator()->rollback($conflict_hydrated["snapshot_ids"]);
          if (is_wp_error($conflict_rollback) || 25 !== (int) $conflict_rollback["snapshot_count"]) { exit(1); }

          // Legacy v1 blueprints without site.identity still seed Identity from the old Home aliases.
          $legacy_blueprint = $blueprint;
          unset($legacy_blueprint["site"]["identity"]);
          foreach ($legacy_blueprint["pages"] as &$record) {
              if ("home" !== (string) ($record["key"] ?? "")) { continue; }
              $record["slots"]["en"]["researcher-name"] = "Eduardo Jose Yauri Luna";
              $record["slots"]["es"]["researcher-name"] = "Eduardo Jose Yauri Luna";
              $record["slots"]["en"]["researcher-headline"] = "Legacy English Headline";
              $record["slots"]["es"]["researcher-headline"] = "Legacy Spanish Headline";
              break;
          }
          unset($record);
          $legacy_preview = Eduardo_Research_Manager::hydrator()->preview($legacy_blueprint);
          if (is_wp_error($legacy_preview) || 25 !== (int) $legacy_preview["operation_count"]) {
              fwrite(STDERR, is_wp_error($legacy_preview) ? $legacy_preview->get_error_message() : wp_json_encode($legacy_preview)); exit(1);
          }
          $legacy_hydrated = Eduardo_Research_Manager::hydrator()->apply($legacy_blueprint);
          if (is_wp_error($legacy_hydrated) || empty($legacy_hydrated["verified"]) || 25 !== (int) $legacy_hydrated["operation_count"]) {
              fwrite(STDERR, is_wp_error($legacy_hydrated) ? $legacy_hydrated->get_error_message() : wp_json_encode($legacy_hydrated)); exit(1);
          }
          $legacy_identity = (new Eduardo_Research_Manager_Identity_Profile())->inspect();
          if (is_wp_error($legacy_identity)
              || "Eduardo Jose Yauri Luna" !== (string) ($legacy_identity["name"] ?? "")
              || "Legacy English Headline" !== (string) ($legacy_identity["headline"] ?? "")
              || "Legacy Spanish Headline" !== (string) ($legacy_identity["headline_es"] ?? "")) {
              fwrite(STDERR, is_wp_error($legacy_identity) ? $legacy_identity->get_error_message() : wp_json_encode($legacy_identity)); exit(1);
          }
          $legacy_rollback = Eduardo_Research_Manager::hydrator()->rollback($legacy_hydrated["snapshot_ids"]);
          if (is_wp_error($legacy_rollback) || 25 !== (int) $legacy_rollback["snapshot_count"]) { exit(1); }
          ' --allow-root
