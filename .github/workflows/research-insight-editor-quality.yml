name: Research Insight Editor Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-insight-editor-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/research-insight-editor-quality.yml'

permissions:
  contents: read

jobs:
  insight-editor:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli

      - name: Lint Insight editor service
        run: php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-insight-editor.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-insight-editor-wp
          mkdir -p /tmp/research-insight-editor-wp
          cd /tmp/research-insight-editor-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research Insight Editor' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root
          wp rewrite structure '/%postname%/' --hard --allow-root
          wp rewrite flush --hard --allow-root

      - name: Create update verify stale-protect and rollback Insight
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-insight-editor-wp
          wp eval '
          wp_set_current_user(1);
          $editor = Eduardo_Research_Manager::insight_editor();
          if (! $editor instanceof Eduardo_Research_Manager_Insight_Editor) { exit(1); }

          $created_preview = $editor->preview_create([
              "title"=>"CI Research Insight",
              "slug"=>"ci-research-insight",
              "excerpt"=>"Initial structured excerpt.",
              "content"=>"<p>Initial structured Insight body.</p>",
              "language"=>"en",
              "insight_type"=>"research_note",
              "status"=>"publish",
          ]);
          if (is_wp_error($created_preview) || "create" !== ($created_preview["status"] ?? "") || empty($created_preview["apply_allowed"]) || empty($created_preview["creation_token"])) {
              fwrite(STDERR, is_wp_error($created_preview) ? $created_preview->get_error_message() : wp_json_encode($created_preview)); exit(1);
          }
          $created = $editor->apply_preview($created_preview);
          if (is_wp_error($created) || empty($created["verified"]) || empty($created["post_id"]) || empty($created["snapshot_id"])) {
              fwrite(STDERR, is_wp_error($created) ? $created->get_error_message() : wp_json_encode($created)); exit(1);
          }
          $post_id = (int) $created["post_id"];
          $record = $editor->inspect($post_id);
          if (is_wp_error($record) || "CI Research Insight" !== $record["title"] || "publish" !== $record["status"] || "research_note" !== $record["insight_type"]) { exit(1); }
          $listed = $editor->list("en");
          if (is_wp_error($listed) || 1 !== count(array_filter($listed, static fn(array $row): bool => $post_id === (int) $row["post_id"]))) { exit(1); }

          $changes = ["excerpt"=>"Updated structured excerpt.","content"=>"<p>Updated structured body.</p>","insight_type"=>"method_note"];
          $update_preview = $editor->preview_update($post_id, $changes);
          if (is_wp_error($update_preview) || "change" !== ($update_preview["status"] ?? "") || empty($update_preview["apply_allowed"]) || empty($update_preview["baseline_checksum"])) { exit(1); }
          $updated = $editor->apply_preview($update_preview);
          if (is_wp_error($updated) || empty($updated["verified"]) || empty($updated["snapshot_id"])) { exit(1); }
          $steady = $editor->preview_update($post_id, $changes);
          if (is_wp_error($steady) || "already-matching" !== ($steady["status"] ?? "") || empty($steady["verification"]["verified"])) { exit(1); }

          $rollback_update = $editor->rollback((string) $updated["snapshot_id"]);
          if (is_wp_error($rollback_update)) { fwrite(STDERR, $rollback_update->get_error_message()); exit(1); }
          $restored = $editor->inspect($post_id);
          if (is_wp_error($restored) || "Initial structured excerpt." !== $restored["excerpt"] || "research_note" !== $restored["insight_type"]) { exit(1); }

          $stale = $editor->preview_update($post_id, ["title"=>"Stale candidate title"]);
          if (is_wp_error($stale) || empty($stale["baseline_checksum"])) { exit(1); }
          wp_update_post(["ID"=>$post_id,"post_excerpt"=>"External concurrent edit"]);
          $stale_result = $editor->apply_preview($stale);
          if (! is_wp_error($stale_result) || "research_manager_insight_editor_stale_preview" !== $stale_result->get_error_code()) { exit(1); }
          wp_update_post(["ID"=>$post_id,"post_excerpt"=>"Initial structured excerpt."]);

          $rollback_create = $editor->rollback((string) $created["snapshot_id"]);
          if (is_wp_error($rollback_create)) { fwrite(STDERR, $rollback_create->get_error_message()); exit(1); }
          if (get_post($post_id) instanceof WP_Post && "trash" !== get_post_status($post_id)) { exit(1); }
          ' --allow-root
