name: Research Manager Greenfield

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'docs/11-greenfield-runtime-contract.md'
      - 'docs/12-greenfield-next-microphases.md'
      - 'docs/13-greenfield-acceptance.md'
      - 'docs/14-greenfield-site-blueprint-contract.md'
      - 'docs/15-greenfield-implementation-notes.md'
      - 'docs/16-greenfield-milestone-summary.md'
      - 'docs/17-greenfield-blueprint-status-vocabulary.md'
      - '.github/workflows/research-manager-greenfield.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - '.github/workflows/research-manager-greenfield.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-mode.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager.php
          php -l wordpress/plugins/eduardo-research-manager/eduardo-research-manager.php
          for test_file in wordpress/plugins/eduardo-research-manager/tests/*.php; do php -l "$test_file"; done
      - name: Greenfield is explicit default
        run: |
          grep -F "public const GREENFIELD = 'greenfield';" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-mode.php
          grep -F "get_option('eduardo_research_manager_mode', self::GREENFIELD)" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-mode.php
          grep -F "'legacy_discovery' => false" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-mode.php
          grep -F "'legacy_mapping' => false" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-mode.php
          grep -F "'requires_legacy_discovery' => false" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield.php
          grep -F "'requires_legacy_mapping' => false" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield.php
          grep -F "'requires_gutenberg_layout' => false" wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint.php
