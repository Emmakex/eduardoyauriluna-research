name: Manager Portable Package Quality

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'bridge/research-manager-mcp/**'
      - 'scripts/test-manager-portability-contract.sh'
      - '.github/workflows/manager-portable-package-quality.yml'
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'bridge/research-manager-mcp/**'
      - 'scripts/test-manager-portability-contract.sh'
      - '.github/workflows/manager-portable-package-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-portable-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint portable Manager PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/plugins/eduardo-research-manager -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/tmp/manager-php-lint.log
          tail -20 /tmp/manager-php-lint.log

      - name: Validate portability contract
        shell: bash
        run: bash scripts/test-manager-portability-contract.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck and test MCP bridge
        working-directory: bridge/research-manager-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Build installable Manager ZIP and handoff manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/manager-package
          mkdir -p dist/manager-package/eduardo-research-manager
          cp -a wordpress/plugins/eduardo-research-manager/. dist/manager-package/eduardo-research-manager/
          (
            cd dist/manager-package
            zip -qr ../research-manager-0.11.0.zip eduardo-research-manager
          )
          test -s dist/research-manager-0.11.0.zip
          PLUGIN_SHA256="$(sha256sum dist/research-manager-0.11.0.zip | awk '{print $1}')"
          printf '%s  %s\n' "$PLUGIN_SHA256" 'research-manager-0.11.0.zip' > dist/research-manager-0.11.0.zip.sha256
          unzip -l dist/research-manager-0.11.0.zip | grep -F 'eduardo-research-manager/eduardo-research-manager.php'
          jq -n \
            --arg plugin_version '0.11.0' \
            --arg plugin_file 'research-manager-0.11.0.zip' \
            --arg plugin_sha256 "$PLUGIN_SHA256" \
            --arg source_commit "$GITHUB_SHA" \
            --arg tenant_profile 'generic-wordpress' \
            --arg manager_scopes 'site.read,site.diagnostics' \
            --arg mcp_capabilities 'site.read,diagnostics.read' \
            '{
              schema_version: 1,
              plugin: {version:$plugin_version,file:$plugin_file,sha256:$plugin_sha256},
              bridge: {repository:"Emmakex/eduardoyauriluna-research",source_commit:$source_commit},
              generic_wordpress: {
                tenant_profile:$tenant_profile,
                manager_scopes:($manager_scopes|split(",")),
                mcp_capabilities:($mcp_capabilities|split(",")),
                tools:["site_status","site_versions","site_capabilities","site_baseline_audit"],
                writes_enabled:false
              },
              external_acceptance_project:"Nueva web Emmake",
              external_acceptance_target:"emmake/nuevaweb"
            }' > dist/research-manager-0.11.0.manifest.json

      - name: Upload portable Manager package
        uses: actions/upload-artifact@v4
        with:
          name: research-manager-0.11.0
          path: |
            dist/research-manager-0.11.0.zip
            dist/research-manager-0.11.0.zip.sha256
            dist/research-manager-0.11.0.manifest.json
          if-no-files-found: error
          retention-days: 30
