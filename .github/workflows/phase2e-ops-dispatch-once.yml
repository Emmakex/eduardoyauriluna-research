name: Phase 2E Ops Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2e-ops-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current-main gateway replay proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase2d-command-gateway.yml/dispatches" \
            -f ref=main \
            -f 'inputs[command_path]=commands/phase2d/pending/cmd-phase2e-media-metadata-0001.json'
          echo 'DISPATCHED_ISSUE_281_REPLAY=cmd-phase2e-media-metadata-0001'
