name: Phase 2E Ops Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2e-ops-dispatch-once.yml'

permissions:
  contents: read

jobs:
  retired:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: echo 'PHASE2E_OPS_DISPATCH_RETIRED=1'
