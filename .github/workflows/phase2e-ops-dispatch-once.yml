name: Phase 2E Ops Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2e-ops-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor == 'Emmakex'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch strict gateway generation activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase2e-harden-gateway-generation.yml/dispatches" \
            -f ref=main
          echo 'DISPATCHED_PHASE2E_GATEWAY_GENERATION_RETRY=phase2d-v2-20261019'
