name: Site Architect 475 Blueprint Resource Provider Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-blueprint-resource-provider.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-blueprint-resources.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield.php'
      - 'scripts/site-architect-475-blueprint-resource-provider-contract-test.php'
      - '.github/workflows/site-architect-475-blueprint-resource-provider-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-blueprint-resource-provider.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-blueprint-resources.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-blueprint-compiler.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-greenfield.php'
      - 'scripts/site-architect-475-blueprint-resource-provider-contract-test.php'
      - '.github/workflows/site-architect-475-blueprint-resource-provider-quality.yml'

permissions:
  contents: read

jobs:
  blueprint-provider:
    name: Explicit Blueprint resource ownership PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Core and Research profile, then exercise two isolated Themes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=wordpress/plugins/eduardo-research-manager/includes
          for file in class-site-architect-blueprint-resource-provider.php \
                      class-research-manager-research-blueprint-resources.php \
                      class-research-manager-blueprint.php \
                      class-research-manager-blueprint-compiler.php \
                      class-research-manager-greenfield.php; do
            php -l "$ROOT/$file"
          done
          php -l scripts/site-architect-475-blueprint-resource-provider-contract-test.php
          php scripts/site-architect-475-blueprint-resource-provider-contract-test.php
      - name: Verify closed Core/provider separation and unchanged plugin version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('wordpress/plugins/eduardo-research-manager')
          files = {name: (root/'includes'/name).read_text() for name in (
              'class-site-architect-blueprint-resource-provider.php',
              'class-research-manager-research-blueprint-resources.php',
              'class-research-manager-blueprint.php',
              'class-research-manager-blueprint-compiler.php',
              'class-research-manager-greenfield.php',
          )}
          core = files['class-site-architect-blueprint-resource-provider.php']
          research = files['class-research-manager-research-blueprint-resources.php']
          for forbidden in ('eduardo_research', 'Eduardo_Research', 'research_line',
                            'Resource_Registry', 'wp_insert_post', 'wp_update_post',
                            'wp_delete_post', 'update_option', '$_POST', '$_REQUEST'):
              assert forbidden not in core, f'Generic provider is Research-coupled: {forbidden}'
          for name in ('theme_id', 'resource_keys', 'resource_label', 'services', 'existing_record'):
              assert 'public function ' + name + '(' in core
              assert 'public function ' + name + '(' in research
          assert "return 'research';" in research
          assert 'Eduardo_Research_Manager::research_services()' in research
          assert "if ('lines' !== $resource_key)" in research
          assert 'find_by_slug($slug, $language)' in research
          for cls in ('class-research-manager-blueprint.php','class-research-manager-blueprint-compiler.php',
                      'class-research-manager-greenfield.php'):
              body = files[cls]
              assert 'Resource_Registry::' not in body, f'Research registry leaked into generic Blueprint flow: {cls}'
          assert '$this->resource_provider->resource_keys()' in files['class-research-manager-blueprint.php']
          assert '$this->greenfield->resource_provider()->existing_record(' in files['class-research-manager-blueprint-compiler.php']
          assert '$this->resource_provider->services()' in files['class-research-manager-greenfield.php']
          assert '$this->resource_provider->theme_id()' in files['class-research-manager-greenfield.php']
          plugin = (root/'eduardo-research-manager.php').read_text()
          assert 'Plugin Name: Site Architect' in plugin
          assert 'Version: 0.11.1' in plugin
          assert "define('EDUARDO_RESEARCH_MANAGER_VERSION', '0.11.1')" in plugin
          print('PASS: Blueprint Core has no Research registry service dependence or new mutable grant')
          PY
