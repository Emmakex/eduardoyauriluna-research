name: Research Manager MCP Bridge Quality

on:
  pull_request:
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - 'docs/59-phase-2c-full-bounded-write-and-ovh.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - 'docs/59-phase-2c-full-bounded-write-and-ovh.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge/research-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Enforce bounded bridge surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F "| '/seo-geo/site' | '/seo-geo/indexability' | '/seo-geo/internal-links' | '/seo-geo/readiness'" src/manager-client.ts
          grep -F "| '/design' | '/design/variants' | '/design/readiness';" src/manager-client.ts
          grep -F "'site_seo_geo_site'" src/server.ts
          grep -F "'site_design_readiness'" src/server.ts
          grep -F "'site_page_slots_verify'" src/server.ts
          grep -F "'site_insight_create_plan'" src/server.ts
          grep -F "'site_insight_pair_plan'" src/server.ts
          grep -F "'site_research_line_create_plan'" src/research-write-tools.ts
          grep -F "'site_research_line_rollback'" src/research-write-tools.ts
          grep -F "'site_research_object_create_plan'" src/research-write-tools.ts
          grep -F "'site_research_object_rollback'" src/research-write-tools.ts
          grep -F "'site_translation_pair_plan'" src/a3-write-tools.ts
          grep -F "'site_translation_rollback'" src/a3-write-tools.ts
          grep -F "'site_evidence_create_plan'" src/a3-write-tools.ts
          grep -F "'site_evidence_delete_plan'" src/a3-write-tools.ts
          grep -F "'site_evidence_rollback'" src/a3-write-tools.ts
          grep -F "'site_identity_profile_update_plan'" src/a3-write-tools.ts
          grep -F "'site_identity_profile_rollback'" src/a3-write-tools.ts
          grep -F "withCapabilities(['identity.write','operations.rollback']" src/a3-write-tools.ts
          grep -F "'site_seo_geo_remediation_plan'" src/a4-write-tools.ts
          grep -F "'site_seo_geo_remediation_apply'" src/a4-write-tools.ts
          grep -F "'site_seo_geo_remediation_verify'" src/a4-write-tools.ts
          grep -F "'site_seo_geo_remediation_rollback'" src/a4-write-tools.ts
          grep -F "'site_media_ingest_plan'" src/a5-write-tools.ts
          grep -F "'site_media_ingest_cancel'" src/a5-write-tools.ts
          grep -F "'site_media_ingest_apply'" src/a5-write-tools.ts
          grep -F "'site_media_ingest_verify'" src/a5-write-tools.ts
          grep -F "'site_media_ingest_rollback'" src/a5-write-tools.ts
          grep -F "'site_media_metadata_update_plan'" src/a5-write-tools.ts
          grep -F "'site_media_metadata_apply'" src/a5-write-tools.ts
          grep -F "'site_media_metadata_verify'" src/a5-write-tools.ts
          grep -F "'site_media_metadata_rollback'" src/a5-write-tools.ts
          grep -F "'site_navigation_update_plan'" src/a6-write-tools.ts
          grep -F "'site_navigation_apply'" src/a6-write-tools.ts
          grep -F "'site_navigation_verify'" src/a6-write-tools.ts
          grep -F "'site_navigation_rollback'" src/a6-write-tools.ts
          grep -F "withCapability('navigation.write'" src/a6-write-tools.ts
          grep -F "withCapability('operations.rollback'" src/a6-write-tools.ts
          grep -F "TOOL_AUTHORIZATION" src/tool-authorization.ts
          grep -F "site_translation_apply: { commercialCapability:'translations.write', backendScopes:['translations.read','operations.apply','translations.write']" src/tool-authorization.ts
          grep -F "site_evidence_apply: { commercialCapability:'evidence.write', backendScopes:['evidence.read','operations.apply','evidence.write']" src/tool-authorization.ts
          grep -F "site_identity_profile_update_plan: { commercialCapability:'identity.write', backendScopes:['operations.apply','evidence.write','identity.write']" src/tool-authorization.ts
          grep -F "site_identity_profile_rollback: { commercialCapability:'identity.write', additionalCommercialCapabilities:['operations.rollback']" src/tool-authorization.ts
          grep -F "site_seo_geo_remediation_plan: { commercialCapability:'seo.write', backendScopes:['operations.apply','seo.write']" src/tool-authorization.ts
          grep -F "site_seo_geo_remediation_apply: { commercialCapability:'seo.write', backendScopes:['seo.read','operations.apply','seo.write']" src/tool-authorization.ts
          grep -F "site_seo_geo_remediation_verify: { commercialCapability:'seo.write', backendScopes:['seo.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_seo_geo_remediation_rollback: { commercialCapability:'operations.rollback', backendScopes:['seo.read','operations.rollback','seo.write']" src/tool-authorization.ts
          grep -F "site_media_ingest_plan: { commercialCapability:'media.write', backendScopes:['operations.apply','media.write']" src/tool-authorization.ts
          grep -F "site_media_ingest_apply: { commercialCapability:'media.write', backendScopes:['media.read','operations.apply','media.write']" src/tool-authorization.ts
          grep -F "site_media_ingest_verify: { commercialCapability:'media.write', backendScopes:['media.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_media_ingest_rollback: { commercialCapability:'operations.rollback', backendScopes:['media.read','operations.rollback','media.write']" src/tool-authorization.ts
          grep -F "site_media_metadata_update_plan: { commercialCapability:'media.write', backendScopes:['operations.apply','media.write']" src/tool-authorization.ts
          grep -F "site_media_metadata_rollback: { commercialCapability:'operations.rollback', backendScopes:['media.read','operations.rollback','media.write']" src/tool-authorization.ts
          grep -F "site_navigation_update_plan: { commercialCapability:'navigation.write', backendScopes:['operations.apply','pages.write']" src/tool-authorization.ts
          grep -F "site_navigation_apply: { commercialCapability:'navigation.write', backendScopes:['pages.read','operations.apply','pages.write']" src/tool-authorization.ts
          grep -F "site_navigation_verify: { commercialCapability:'navigation.write', backendScopes:['pages.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_navigation_rollback: { commercialCapability:'operations.rollback', backendScopes:['pages.read','operations.rollback','pages.write']" src/tool-authorization.ts
          grep -F "catalogEntries.length,88" test/tool-authorization.test.ts
          grep -F "registerResearchWriteTools(server,adapter)" src/extended-server.ts
          grep -F "registerA3WriteTools(server,adapter as SiteControlAdapter&A3WriteAdapter)" src/extended-server.ts
          grep -F "registerA4WriteTools(server,adapter as SiteControlAdapter&A4WriteAdapter)" src/extended-server.ts
          grep -F "registerA5WriteTools(server,adapter as SiteControlAdapter&A5WriteAdapter)" src/extended-server.ts
          grep -F "registerA6WriteTools(server,adapter as SiteControlAdapter&A6WriteAdapter)" src/extended-server.ts
          grep -F "from './extended-server.js'" src/http.ts
          grep -F "runWithAuthorizationContext" src/http.ts
          ! grep -R -E "wp-json/wp/v2|registerTool\([^)]*(proxy|route|request)" src
          BASE_TOOLS="$(grep -c "server.registerTool(" src/server.ts)"
          RESEARCH_WRITE_TOOLS="$(grep -c "server.registerTool(" src/research-write-tools.ts)"
          A3_WRITE_TOOLS="$(grep -c "server.registerTool(" src/a3-write-tools.ts)"
          A4_WRITE_TOOLS="$(grep -c "server.registerTool(" src/a4-write-tools.ts)"
          A5_WRITE_TOOLS="$(grep -c "server.registerTool(" src/a5-write-tools.ts)"
          A6_WRITE_TOOLS="$(grep -c "server.registerTool(" src/a6-write-tools.ts)"
          test "$(( BASE_TOOLS + RESEARCH_WRITE_TOOLS + A3_WRITE_TOOLS + A4_WRITE_TOOLS + A5_WRITE_TOOLS + A6_WRITE_TOOLS ))" -eq 88
