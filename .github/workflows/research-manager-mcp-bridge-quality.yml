name: Research Manager MCP Bridge Quality

on:
  pull_request:
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge/research-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Enforce bounded bridge surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'/research-translations'" src/manager-client.ts
          grep -F "'/research-evidence'" src/manager-client.ts
          grep -F "'/research-evidence/identity'" src/manager-client.ts
          grep -F "'site_translations_list'" src/server.ts
          grep -F "'site_translation_inspect'" src/server.ts
          grep -F "'site_evidence_inventory'" src/server.ts
          grep -F "'site_evidence_identity'" src/server.ts
          grep -F "'site_evidence_list'" src/server.ts
          grep -F "'site_evidence_inspect'" src/server.ts
          grep -F "withCapability('translations.read'" src/server.ts
          grep -F "withCapability('evidence.read'" src/server.ts
          grep -F "z.enum(['research_line','research_output','research_project','research_software','research_dataset'])" src/server.ts
          grep -F "z.enum(['profile','affiliations','identifiers','research_questions','methods','experience','education','awards','contact'])" src/server.ts
          grep -F "export interface SiteControlAdapter" src/adapters/site-control.ts
          grep -F "COMMERCIAL_CAPABILITIES" src/entitlements.ts
          grep -F "runWithAuthorizationContext" src/http.ts
          ! grep -R -E "wp-json/wp/v2|registerTool\([^)]*(proxy|route|request)" src
          test "$(grep -c "server.registerTool(" src/server.ts)" -eq 17
