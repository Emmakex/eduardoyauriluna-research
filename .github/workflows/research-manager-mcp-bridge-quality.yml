name: Research Manager MCP Bridge Quality

on:
  pull_request:
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge/research-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Enforce bounded bridge surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F "| '/research-objects'" src/manager-client.ts
          grep -F "| '/research-lines';" src/manager-client.ts
          grep -F "'site_research_objects_list'" src/server.ts
          grep -F "'site_research_object_inspect'" src/server.ts
          grep -F "'site_research_lines_list'" src/server.ts
          grep -F "'site_research_line_inspect'" src/server.ts
          grep -F "withCapability('research.read'" src/server.ts
          grep -F "z.enum(['output', 'project', 'software', 'dataset'])" src/server.ts
          grep -F "researchObjects(kind?: ResearchObjectKind" src/manager-client.ts
          grep -F "researchLine(postId: number)" src/manager-client.ts
          grep -F "export interface SiteControlAdapter" src/adapters/site-control.ts
          grep -F "class TenantRegistry" src/tenant-registry.ts
          grep -F "class PrincipalRegistry" src/access-control.ts
          grep -F "interface SecretResolver" src/secret-resolver.ts
          grep -F "COMMERCIAL_CAPABILITIES" src/entitlements.ts
          grep -F "runWithAuthorizationContext" src/http.ts
          ! grep -R -E "wp-json/wp/v2|registerTool\([^)]*(proxy|route|request)" src
          test "$(grep -c "server.registerTool(" src/server.ts)" -eq 11
