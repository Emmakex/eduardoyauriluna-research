name: Research Manager MCP Bridge Quality

on:
  pull_request:
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge/research-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Enforce bounded bridge surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F "| '/navigation' | '/media' | '/media/diagnostics';" src/manager-client.ts
          grep -F "'site_navigation_inspect'" src/server.ts
          grep -F "'site_media_list'" src/server.ts
          grep -F "'site_media_inspect'" src/server.ts
          grep -F "'site_media_diagnostics'" src/server.ts
          grep -F "'site_media_diagnostic_inspect'" src/server.ts
          grep -F "withCapability('navigation.read'" src/server.ts
          grep -F "withCapability('media.read'" src/server.ts
          grep -F "z.enum(['image','audio','video','pdf','application/pdf'])" src/server.ts
          grep -F "mediaInventory(options:" src/manager-client.ts
          grep -F "mediaDiagnostics(limit?:number)" src/manager-client.ts
          grep -F "inspectNavigation(): Promise<unknown>" src/adapters/site-control.ts
          grep -F "mediaDiagnostics(request: SiteMediaDiagnosticsRequest): Promise<unknown>" src/adapters/site-control.ts
          grep -F "COMMERCIAL_CAPABILITIES" src/entitlements.ts
          grep -F "'navigation.read'" src/entitlements.ts
          grep -F "'media.read'" src/entitlements.ts
          grep -F "runWithAuthorizationContext" src/http.ts
          ! grep -R -E "wp-json/wp/v2|registerTool\([^)]*(proxy|route|request)" src
          test "$(grep -c "server.registerTool(" src/server.ts)" -eq 22
