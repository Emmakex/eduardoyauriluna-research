name: Research Manager MCP Bridge Quality

on:
  pull_request:
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - 'docs/59-phase-2c-full-bounded-write-and-ovh.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/research-manager-mcp/**'
      - 'docs/57-chatgpt-mcp-bridge.md'
      - 'docs/58-commercial-mcp-platform.md'
      - 'docs/59-phase-2c-full-bounded-write-and-ovh.md'
      - '.github/workflows/research-manager-mcp-bridge-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge/research-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Enforce bounded bridge surface
        shell: bash
        run: |
          set -euo pipefail
          grep -F "| '/seo-geo/site' | '/seo-geo/indexability' | '/seo-geo/internal-links' | '/seo-geo/readiness'" src/manager-client.ts
          grep -F "| '/design' | '/design/variants' | '/design/readiness';" src/manager-client.ts
          grep -F "'site_seo_geo_site'" src/server.ts
          grep -F "'site_design_readiness'" src/server.ts
          grep -F "'site_page_slots_verify'" src/server.ts
          grep -F "'site_page_slots_rollback'" src/server.ts
          grep -F "'site_insight_create_plan'" src/server.ts
          grep -F "'site_insight_update_plan'" src/server.ts
          grep -F "'site_insight_apply'" src/server.ts
          grep -F "'site_insight_verify'" src/server.ts
          grep -F "'site_insight_rollback'" src/server.ts
          grep -F "'site_insight_pair_plan'" src/server.ts
          grep -F "'site_insight_unpair_plan'" src/server.ts
          grep -F "'site_insight_pairing_apply'" src/server.ts
          grep -F "'site_insight_pairing_verify'" src/server.ts
          grep -F "'site_insight_pairing_rollback'" src/server.ts
          grep -F "withCapability('seo.read'" src/server.ts
          grep -F "withCapability('design.read'" src/server.ts
          grep -F "withCapability('insights.write'" src/server.ts
          grep -F "withCapability('translations.write'" src/server.ts
          grep -F "withCapability('operations.rollback'" src/server.ts
          grep -F "TOOL_AUTHORIZATION" src/tool-authorization.ts
          grep -F "backendScopes:['site.diagnostics','seo.read']" src/tool-authorization.ts
          grep -F "site_navigation_inspect: { commercialCapability:'navigation.read', backendScopes:['pages.read']" src/tool-authorization.ts
          grep -F "site_page_slots_verify: { commercialCapability:'pages.write', backendScopes:['site.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_page_slots_rollback: { commercialCapability:'operations.rollback', backendScopes:['site.read','operations.rollback']" src/tool-authorization.ts
          grep -F "site_insight_create_plan: { commercialCapability:'insights.write', backendScopes:['operations.apply']" src/tool-authorization.ts
          grep -F "site_insight_verify: { commercialCapability:'insights.write', backendScopes:['site.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_insight_rollback: { commercialCapability:'operations.rollback', backendScopes:['site.read','operations.rollback']" src/tool-authorization.ts
          grep -F "site_insight_pair_plan: { commercialCapability:'translations.write', backendScopes:['operations.apply','insights.write','translations.write']" src/tool-authorization.ts
          grep -F "site_insight_pairing_verify: { commercialCapability:'translations.write', backendScopes:['site.read','site.diagnostics']" src/tool-authorization.ts
          grep -F "site_insight_pairing_rollback: { commercialCapability:'operations.rollback', backendScopes:['site.read','operations.rollback','insights.write','translations.write']" src/tool-authorization.ts
          grep -F "catalogEntries.length,46" test/tool-authorization.test.ts
          grep -F "runWithAuthorizationContext" src/http.ts
          ! grep -R -E "wp-json/wp/v2|registerTool\([^)]*(proxy|route|request)" src
          test "$(grep -c "server.registerTool(" src/server.ts)" -eq 46
