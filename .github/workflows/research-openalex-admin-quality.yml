name: Research OpenAlex Admin Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-openalex-admin-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/**'
      - 'wordpress/themes/eduardo-research/**'
      - '.github/scripts/ensure-wp-cli.sh'
      - '.github/workflows/research-openalex-admin-quality.yml'

permissions:
  contents: read

jobs:
  openalex-admin:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli
      - name: Ensure WP-CLI is available
        shell: bash
        run: bash .github/scripts/ensure-wp-cli.sh

      - name: Lint Academic Connections OpenAlex surface
        shell: bash
        run: |
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-connections-admin.php
          php -l wordpress/plugins/eduardo-research-manager/includes/class-research-manager-openalex-adapter.php

      - name: Install Research WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-openalex-admin-wp
          mkdir -p /tmp/research-openalex-admin-wp
          cd /tmp/research-openalex-admin-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title='Research OpenAlex Admin' --admin_user=admin --admin_password='research-manager-password' --admin_email=research@example.test --skip-email --allow-root
          mkdir -p wp-content/themes/eduardo-research wp-content/plugins/eduardo-research-manager
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          cp -R "$GITHUB_WORKSPACE/wordpress/plugins/eduardo-research-manager/." wp-content/plugins/eduardo-research-manager/
          wp theme activate eduardo-research --allow-root
          wp plugin activate eduardo-research-manager --allow-root

      - name: Seed verified ORCID and local Research Output
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-openalex-admin-wp
          wp eval '
          wp_set_current_user(1);
          update_option("eduardo_research_evidence",[
              "identifiers"=>[[
                  "id"=>"orcid-openalex-admin-ci",
                  "status"=>"verified",
                  "label"=>"ORCID",
                  "value"=>"0000-0002-1825-0097",
                  "url"=>"https://orcid.org/0000-0002-1825-0097",
                  "evidence_reference"=>"CI verified ORCID fixture",
                  "verified_at"=>gmdate(DATE_W3C)
              ]]
          ],false);
          $post_id=wp_insert_post([
              "post_type"=>"research_output",
              "post_status"=>"draft",
              "post_title"=>"Local OpenAlex DOI match",
              "post_name"=>"local-openalex-doi-match"
          ],true);
          if (is_wp_error($post_id)) { fwrite(STDERR,$post_id->get_error_message()); exit(1); }
          update_post_meta((int)$post_id,"_research_language","en");
          update_post_meta((int)$post_id,"_research_doi","10.5555/openalex.admin");
          update_option("openalex_admin_fixture_id",(int)$post_id,false);
          update_option("openalex_admin_before",wp_json_encode(Eduardo_Research_Manager::outputs()->inspect((int)$post_id)),false);
          ' --allow-root

      - name: Render OpenAlex Preview control from verified ORCID
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-openalex-admin-wp
          wp eval '
          wp_set_current_user(1);
          $admin=new Eduardo_Research_Manager_Connections_Admin();
          $admin->register();
          if (! has_action("admin_post_eduardo_research_openalex_preview",[$admin,"handle_openalex_preview"])) { fwrite(STDERR,"OpenAlex Preview action missing\n"); exit(1); }
          ob_start(); $admin->render(); $html=(string)ob_get_clean();
          foreach (["OpenAlex identity and works","EXACT VERIFIED ORCID","0000-0002-1825-0097","Preview OpenAlex identity and works","Name matching","Automatic local apply","DISABLED"] as $needle) {
              if (false===strpos($html,$needle)) { fwrite(STDERR,"missing OpenAlex admin marker: {$needle}\n"); exit(1); }
          }
          if (false!==strpos($html,"eduardo_research_openalex_apply") || false!==strpos($html,"Apply OpenAlex")) { fwrite(STDERR,"unexpected OpenAlex Apply control\n"); exit(1); }
          ' --allow-root

      - name: Run OpenAlex Preview handler with mocked exact identity reads
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-openalex-admin-wp
          wp eval '
          wp_set_current_user(1);
          add_filter("pre_http_request",static function($pre,$args,$url){
              if (str_contains($url,"api.openalex.org/authors")) {
                  return ["headers"=>[],"body"=>wp_json_encode([
                      "meta"=>["count"=>1],
                      "results"=>[[
                          "id"=>"https://openalex.org/A1234567890",
                          "display_name"=>"Eduardo Jose Yauri Luna",
                          "orcid"=>"https://orcid.org/0000-0002-1825-0097",
                          "observed_orcids"=>["https://orcid.org/0000-0002-1825-0097"],
                          "works_count"=>2,
                          "cited_by_count"=>11,
                          "summary_stats"=>["h_index"=>2,"i10_index"=>1,"2yr_mean_citedness"=>1.5],
                          "last_known_institutions"=>[["display_name"=>"Synthetic Research Lab","ror"=>"https://ror.org/00synthetic","country_code"=>"ES","type"=>"education"]],
                          "updated_date"=>"2026-10-10T00:00:00Z"
                      ]]
                  ]),"response"=>["code"=>200,"message"=>"OK"],"cookies"=>[]];
              }
              if (str_contains($url,"api.openalex.org/works")) {
                  return ["headers"=>[],"body"=>wp_json_encode([
                      "meta"=>["count"=>2],
                      "results"=>[
                          [
                              "id"=>"https://openalex.org/W1234567890",
                              "doi"=>"https://doi.org/10.5555/openalex.admin",
                              "title"=>"Local OpenAlex DOI match",
                              "publication_date"=>"2026-02-10",
                              "publication_year"=>2026,
                              "type"=>"article",
                              "primary_location"=>["source"=>["display_name"=>"Synthetic Journal"]],
                              "authorships"=>[["author"=>["display_name"=>"Eduardo Jose Yauri Luna"]]],
                              "cited_by_count"=>7,
                              "open_access"=>["is_oa"=>true,"oa_status"=>"gold"]
                          ],
                          [
                              "id"=>"https://openalex.org/W2234567890",
                              "doi"=>"https://doi.org/10.5555/openalex.remote.admin",
                              "title"=>"Remote only OpenAlex work",
                              "publication_date"=>"2025-08-20",
                              "publication_year"=>2025,
                              "type"=>"article",
                              "primary_location"=>["source"=>["display_name"=>"Remote Journal"]],
                              "authorships"=>[["author"=>["display_name"=>"Eduardo Jose Yauri Luna"]]],
                              "cited_by_count"=>4,
                              "open_access"=>["is_oa"=>false,"oa_status"=>"closed"]
                          ]
                      ]
                  ]),"response"=>["code"=>200,"message"=>"OK"],"cookies"=>[]];
              }
              return $pre;
          },10,3);
          $_POST=["_wpnonce"=>wp_create_nonce("erm_openalex_preview")]; $_REQUEST=$_POST;
          (new Eduardo_Research_Manager_Connections_Admin())->handle_openalex_preview();
          ' --allow-root

      - name: Render OpenAlex reconciliation and prove zero local mutation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-openalex-admin-wp
          wp eval '
          wp_set_current_user(1);
          $preview=get_transient("eduardo_research_openalex_preview_1");
          if (! is_array($preview) || "preview"!==($preview["status"] ?? "") || "exact_verified_orcid"!==($preview["identity_basis"] ?? "")) { fwrite(STDERR,wp_json_encode($preview)); exit(1); }
          if (1!==(int)($preview["local_doi_match_count"] ?? 0) || 2!==(int)($preview["remote_work_count"] ?? 0)) { exit(1); }
          ob_start(); (new Eduardo_Research_Manager_Connections_Admin())->render(); $html=(string)ob_get_clean();
          foreach (["OpenAlex reconciliation preview","Eduardo Jose Yauri Luna","A1234567890","Synthetic Research Lab","Local DOI matches","10.5555/openalex.admin","Remote only OpenAlex work","Preview only."] as $needle) {
              if (false===strpos($html,$needle)) { fwrite(STDERR,"missing rendered OpenAlex marker: {$needle}\n"); exit(1); }
          }
          if (false!==strpos($html,"eduardo_research_openalex_apply") || false!==strpos($html,"Apply OpenAlex")) { fwrite(STDERR,"OpenAlex Preview exposed an Apply control\n"); exit(1); }
          $post_id=(int)get_option("openalex_admin_fixture_id",0);
          $after=wp_json_encode(Eduardo_Research_Manager::outputs()->inspect($post_id));
          if ((string)get_option("openalex_admin_before","")!==$after) { fwrite(STDERR,"OpenAlex admin Preview mutated local Research Output\n"); exit(1); }
          delete_option("openalex_admin_fixture_id"); delete_option("openalex_admin_before");
          ' --allow-root
