name: Research Theme Quality

on:
  pull_request:
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/theme-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/theme-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify required Theme files
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress/themes/eduardo-research/style.css
          test -f wordpress/themes/eduardo-research/functions.php
          test -f wordpress/themes/eduardo-research/front-page.php
          test -f wordpress/themes/eduardo-research/index.php
          test -f wordpress/themes/eduardo-research/inc/research-evidence.php
          test -f wordpress/themes/eduardo-research/theme.json
      - name: Lint Theme PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/themes/eduardo-research -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate Theme JSON
        shell: bash
        run: |
          set -euo pipefail
          php -r 'json_decode(file_get_contents("wordpress/themes/eduardo-research/theme.json"), true, 512, JSON_THROW_ON_ERROR); echo "theme.json valid\n";'

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Install clean WordPress and activate Theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-wp
          cd /tmp/research-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://research.test --title='Research Test' --admin_user=admin --admin_password='research-test-password' --admin_email=research@example.test --skip-email --allow-root
          wp option update permalink_structure '/%postname%/' --allow-root
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
      - name: Verify Research bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          test "$(wp option get show_on_front --allow-root)" = "page"
          test "$(wp option get page_on_front --allow-root)" -gt 0
          test "$(wp option get wp_page_for_privacy_policy --allow-root)" -gt 0
          for slug in home about research publications projects software datasets cv insights contact privacy-policy legal-notice; do
            test -n "$(wp post list --post_type=page --name="$slug" --field=ID --format=ids --allow-root)"
          done
          wp eval 'foreach (["research_output","research_project","research_software","research_dataset"] as $type) { if (! post_type_exists($type)) { exit(1); } $object = get_post_type_object($type); if (! $object || $object->has_archive) { exit(1); } }' --allow-root
          wp eval '$page = get_page_by_path("publications"); if (! $page || "output-index" !== get_post_meta($page->ID, "_eduardo_research_role", true)) { exit(1); }' --allow-root
          wp eval 'if ("CreativeWork" !== eduardo_research_output_schema_type(0)) { exit(1); } foreach (["about","research","publications","projects","software","datasets","cv","insights","contact"] as $key) { if ("" === eduardo_research_page_url($key)) { exit(1); } }' --allow-root
      - name: Verify evidence visibility contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          wp option update eduardo_research_evidence '{"research_lines":[{"title":"Hidden line","status":"unverified"},{"title":"Visible line","summary":"Verified summary","status":"verified"}],"identifiers":[{"label":"Hidden profile","url":"https://example.test/hidden","status":"needs-review"},{"label":"Verified profile","url":"https://example.test/verified","status":"verified"}],"affiliations":[{"title":"Verified organisation","url":"https://example.test/org","status":"verified"}]}' --format=json --allow-root
          wp eval '$lines = eduardo_research_verified_evidence("research_lines"); if (1 !== count($lines) || "Visible line" !== $lines[0]["title"]) { exit(1); } $urls = eduardo_research_verified_identifier_urls(); if (["https://example.test/verified"] !== $urls) { exit(1); } $groups = eduardo_research_surface_evidence_groups("cv"); if (! isset($groups["education"]) || ! isset($groups["experience"])) { exit(1); }' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/themes
          zip -r ../../dist/eduardo-research.zip eduardo-research -x '*/.DS_Store' '*.map'
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-theme
          path: dist/eduardo-research.zip
          if-no-files-found: error
