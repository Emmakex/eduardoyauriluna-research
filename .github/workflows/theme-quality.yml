name: Research Theme Quality

on:
  pull_request:
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/theme-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/eduardo-research/**'
      - '.github/workflows/theme-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify required Theme files
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress/themes/eduardo-research/style.css
          test -f wordpress/themes/eduardo-research/functions.php
          test -f wordpress/themes/eduardo-research/front-page.php
          test -f wordpress/themes/eduardo-research/index.php
          test -f wordpress/themes/eduardo-research/inc/research-language.php
          test -f wordpress/themes/eduardo-research/inc/research-content-language.php
          test -f wordpress/themes/eduardo-research/inc/research-evidence.php
          test -f wordpress/themes/eduardo-research/inc/research-surface-layouts.php
          test -f wordpress/themes/eduardo-research/inc/research-sitemap.php
          test -f wordpress/themes/eduardo-research/assets/interior-surfaces.css
          test -f wordpress/themes/eduardo-research/theme.json
      - name: Lint Theme PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/themes/eduardo-research -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate Theme JSON
        shell: bash
        run: |
          set -euo pipefail
          php -r 'json_decode(file_get_contents("wordpress/themes/eduardo-research/theme.json"), true, 512, JSON_THROW_ON_ERROR); echo "theme.json valid\n";'

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli,mbstring
          coverage: none
          tools: wp-cli
      - name: Install clean WordPress and activate Theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-wp
          cd /tmp/research-wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://research.test --title='Research Test' --admin_user=admin --admin_password='research-test-password' --admin_email=research@example.test --skip-email --allow-root
          wp option update permalink_structure '/%postname%/' --allow-root
          mkdir -p wp-content/themes/eduardo-research
          cp -R "$GITHUB_WORKSPACE/wordpress/themes/eduardo-research/." wp-content/themes/eduardo-research/
          wp theme activate eduardo-research --allow-root
      - name: Verify Research bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          test "$(wp option get show_on_front --allow-root)" = "page"
          test "$(wp option get page_on_front --allow-root)" -gt 0
          test "$(wp option get wp_page_for_privacy_policy --allow-root)" -gt 0
          for slug in home about research publications projects software datasets cv insights contact privacy-policy legal-notice; do
            test -n "$(wp post list --post_type=page --name="$slug" --field=ID --format=ids --allow-root)"
          done
          wp eval 'foreach (["research_output","research_project","research_software","research_dataset"] as $type) { if (! post_type_exists($type)) { exit(1); } $object = get_post_type_object($type); if (! $object || $object->has_archive) { exit(1); } }' --allow-root
          wp eval '$page = get_page_by_path("publications"); if (! $page || "output-index" !== get_post_meta($page->ID, "_eduardo_research_role", true)) { exit(1); }' --allow-root
          wp eval 'if ("CreativeWork" !== eduardo_research_output_schema_type(0)) { exit(1); } foreach (["about","research","publications","projects","software","datasets","cv","insights","contact"] as $key) { if ("" === eduardo_research_page_url($key)) { exit(1); } }' --allow-root
      - name: Verify native EN ES contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          wp eval 'if ("en" !== eduardo_research_default_language()) { exit(1); } if ("http://research.test/es/investigacion/" !== eduardo_research_page_url("research", "es")) { exit(1); } if ("Investigación" !== eduardo_research_page_label("research", "es")) { exit(1); } $_SERVER["REQUEST_URI"]="/es/investigacion/"; if ("es" !== eduardo_research_request_language()) { exit(1); } if (false !== eduardo_research_preserve_localized_canonical("http://research.test/research/", "http://research.test/es/investigacion/")) { exit(1); } $model=eduardo_research_default_model("es"); if ("Agenda de investigación" !== $model["research-lines-heading"]) { exit(1); }' --allow-root
          wp eval '$provider = new Eduardo_Research_Language_Sitemap_Provider(); $urls = array_column($provider->get_url_list(1), "loc"); if (! in_array("http://research.test/es/investigacion/", $urls, true) || ! in_array("http://research.test/es/publicaciones/", $urls, true)) { exit(1); }' --allow-root
          wp rewrite list --allow-root --format=csv | grep -F '^es/investigacion/?$'
          wp rewrite list --allow-root --format=csv | grep -F '^es/llms\.txt$'
      - name: Verify translated Research record contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          wp eval '
          $en = wp_insert_post(["post_type"=>"research_output","post_status"=>"publish","post_title"=>"English paper","post_name"=>"english-paper"]);
          $es = wp_insert_post(["post_type"=>"research_output","post_status"=>"publish","post_title"=>"Artículo español","post_name"=>"articulo-es"]);
          if (! $en || ! $es) { exit(1); }
          update_post_meta($en, "_research_language", "en");
          update_post_meta($es, "_research_language", "es");
          update_post_meta($en, "_research_translation_es", $es);
          update_post_meta($es, "_research_translation_en", $en);
          $spanish_url = get_permalink($es);
          if ("http://research.test/es/publicaciones/articulo-es/" !== $spanish_url) { fwrite(STDERR, $spanish_url . "\n"); exit(1); }
          if ($spanish_url !== eduardo_research_record_translation_url($en, "es")) { exit(1); }
          if ((string) get_permalink($en) !== eduardo_research_record_translation_url($es, "en")) { exit(1); }
          $en_query = new WP_Query(eduardo_research_localized_query_args(["post_type"=>"research_output","post_status"=>"publish","fields"=>"ids","posts_per_page"=>20], "en"));
          $es_query = new WP_Query(eduardo_research_localized_query_args(["post_type"=>"research_output","post_status"=>"publish","fields"=>"ids","posts_per_page"=>20], "es"));
          if (! in_array($en, $en_query->posts, true) || in_array($es, $en_query->posts, true)) { exit(1); }
          if (! in_array($es, $es_query->posts, true) || in_array($en, $es_query->posts, true)) { exit(1); }
          ' --allow-root
          wp rewrite list --allow-root --format=csv | grep -F '^es/publicaciones/([^/]+)/?$'
      - name: Verify evidence visibility contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          wp option update eduardo_research_evidence '{"research_lines":[{"title":"Hidden line","status":"unverified"},{"title":"Visible line","title_es":"Línea visible","summary":"Verified summary","summary_es":"Resumen verificado","status":"verified"}],"identifiers":[{"label":"Hidden profile","url":"https://example.test/hidden","status":"needs-review"},{"label":"Verified profile","url":"https://example.test/verified","status":"verified"}],"affiliations":[{"title":"Verified organisation","url":"https://example.test/org","status":"verified"}]}' --format=json --allow-root
          wp eval '$lines = eduardo_research_verified_evidence("research_lines"); if (1 !== count($lines) || "Visible line" !== $lines[0]["title"]) { exit(1); } $localized = eduardo_research_localize_record($lines[0], "es"); if ("Línea visible" !== $localized["title"]) { exit(1); } $urls = eduardo_research_verified_identifier_urls(); if (["https://example.test/verified"] !== $urls) { exit(1); } $groups = eduardo_research_surface_evidence_groups("cv"); if (! isset($groups["education"]) || ! isset($groups["experience"])) { exit(1); }' --allow-root
      - name: Verify interior surface contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/research-wp
          wp eval '
          $about = eduardo_research_surface_layout("about", "en");
          $research = eduardo_research_surface_layout("research", "en");
          $about_groups = array_column($about["sections"], "group");
          $research_groups = array_column($research["sections"], "group");
          if (["profile","affiliations","identifiers"] !== $about_groups) { exit(1); }
          if (["research_lines","research_questions","methods"] !== $research_groups) { exit(1); }
          if ("ProfilePage" !== eduardo_research_page_schema_type("about")) { exit(1); }
          if ("CollectionPage" !== eduardo_research_page_schema_type("research")) { exit(1); }
          if ("WebPage" !== eduardo_research_page_schema_type("cv")) { exit(1); }
          ob_start(); eduardo_research_render_structured_surface("about"); $html = ob_get_clean();
          if (false === strpos($html, "Verified organisation") || false !== strpos($html, "Hidden profile")) { exit(1); }
          ' --allow-root

  package:
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/themes
          zip -r ../../dist/eduardo-research.zip eduardo-research -x '*/.DS_Store' '*.map'
      - uses: actions/upload-artifact@v4
        with:
          name: eduardo-research-theme
          path: dist/eduardo-research.zip
          if-no-files-found: error
