name: Phase 2D Command Gateway

on:
  push:
    branches: [main]
    paths:
      - 'commands/phase2d/pending/*.json'
  workflow_dispatch:
    inputs:
      command_path:
        description: 'Existing commands/phase2d/pending/*.json command to execute'
        required: true
        type: string
  workflow_run:
    workflows: ["Research Manager Remote M4 Aggregate Quality"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: phase2d-command-gateway
  cancel-in-progress: false

jobs:
  execute:
    if: >
      (github.event_name != 'workflow_run' && github.actor == 'Emmakex') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.id == 39604098242 &&
       github.event.workflow_run.run_attempt == 2 &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.triggering_actor.login == 'Emmakex')
    runs-on: ubuntu-latest
    environment: phase2d-production
    env:
      PHASE2D_MCP_BASE_URL: https://mcp.kairoseth.com/mcp
      PHASE2D_GATEWAY_GENERATION: phase2d-v2-20261019
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reject historical workflow reruns
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2d-run-attempt-guard.py

      - name: Resolve exactly one trusted command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            command_path='${{ inputs.command_path }}'
            files=("$command_path")
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            command_path='commands/phase2d/pending/cmd-home-profiles-es-20261021-r4.json'
            files=("$command_path")
          else
            mapfile -t files < <(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" -- 'commands/phase2d/pending/*.json')
            mapfile -t deleted < <(git diff-tree --no-commit-id --name-only --diff-filter=D -r "$GITHUB_SHA" -- 'commands/phase2d/pending/*.json')
            if [[ ${#files[@]} -eq 0 && ${#deleted[@]} -gt 0 ]]; then
              echo "mode=cleanup" >> "$GITHUB_OUTPUT"
              echo "cleanup_count=${#deleted[@]}" >> "$GITHUB_OUTPUT"
              echo "Cleanup-only pending command deletion detected; no command will execute"
              exit 0
            fi
          fi

          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one added/modified Phase 2D pending command; found ${#files[@]}" >&2
            exit 1
          fi

          command_path="${files[0]}"
          if [[ ! "$command_path" =~ ^commands/phase2d/pending/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "Command path is outside the trusted pending namespace" >&2
            exit 1
          fi
          if [[ ! -f "$command_path" ]]; then
            echo "Command file does not exist" >&2
            exit 1
          fi

          command_id="$(python3 - "$command_path" <<'PY'
          import json, re, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          command_id = value.get('command_id', '')
          if not isinstance(command_id, str) or re.fullmatch(r'cmd-[a-z0-9][a-z0-9-]{7,63}', command_id) is None:
              raise SystemExit('invalid command_id')
          print(command_id)
          PY
          )"
          echo "mode=execute" >> "$GITHUB_OUTPUT"
          echo "path=$command_path" >> "$GITHUB_OUTPUT"
          echo "id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Guard command identity and replay
        id: guard
        if: ${{ steps.command.outputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-command-guard.py guard \
            '${{ steps.command.outputs.path }}' \
            --result-dir commands/phase2d/results

      - name: Verify dedicated principal tenant isolation
        id: isolation
        if: ${{ steps.command.outputs.mode == 'execute' }}
        shell: bash
        env:
          PHASE2D_MCP_TOKEN: ${{ format('{0}.phase2d-v2-20261019', secrets.PHASE2D_MCP_TOKEN) }}
        run: |
          set -euo pipefail
          python3 scripts/phase2e-command-guard.py isolation \
            --tenant 'eduardo-research'

      - name: Execute bounded MCP lifecycle
        id: execute
        if: ${{ steps.command.outputs.mode == 'execute' && steps.guard.outputs.decision == 'new' }}
        shell: bash
        env:
          PHASE2D_MCP_TOKEN: ${{ format('{0}.phase2d-v2-20261019', secrets.PHASE2D_MCP_TOKEN) }}
        run: |
          set +e
          python3 scripts/phase2e-command-runner-observable.py \
            '${{ steps.command.outputs.path }}' \
            --result-dir commands/phase2d/results
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fingerprint sanitized execution result
        id: stamp
        if: ${{ always() && steps.command.outputs.mode == 'execute' && steps.guard.outcome == 'success' && steps.guard.outputs.decision == 'new' && steps.execute.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2e-command-guard.py stamp \
            '${{ steps.command.outputs.path }}' \
            --result-dir commands/phase2d/results

      - name: Upload sanitized execution result
        if: ${{ always() && steps.command.outputs.mode == 'execute' && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-command-${{ steps.command.outputs.id }}
          path: commands/phase2d/results/${{ steps.command.outputs.id }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist sanitized result for ChatGPT readback
        if: ${{ always() && steps.command.outputs.mode == 'execute' && steps.guard.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          result="commands/phase2d/results/${{ steps.command.outputs.id }}.json"
          if [[ ! -f "$result" ]]; then
            echo "No sanitized result was produced; nothing to persist"
            exit 0
          fi

          cp "$result" /tmp/phase2d-result.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$result")"
          cp /tmp/phase2d-result.json "$result"

          git config user.name 'kairoseth-command-gateway[bot]'
          git config user.email 'kairoseth-command-gateway[bot]@users.noreply.github.com'
          git add "$result"
          if git diff --cached --quiet; then
            echo "Result already persisted"
            exit 0
          fi
          git commit -m "phase2d: record command result ${{ steps.command.outputs.id }}"
          git push origin HEAD:main

      - name: Enforce execution success
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mode='${{ steps.command.outputs.mode }}'
          if [[ "$mode" == 'cleanup' ]]; then
            [[ '${{ steps.guard.outcome }}' == 'skipped' ]]
            [[ '${{ steps.isolation.outcome }}' == 'skipped' ]]
            [[ '${{ steps.execute.outcome }}' == 'skipped' ]]
            echo 'Cleanup-only pending command deletion accepted without MCP mutation'
            exit 0
          fi
          if [[ "$mode" != 'execute' ]]; then
            echo "Unsupported command resolution mode: $mode" >&2
            exit 1
          fi

          if [[ '${{ steps.guard.outcome }}' != 'success' ]]; then
            echo 'Command replay/idempotency guard failed closed' >&2
            exit 1
          fi
          if [[ '${{ steps.isolation.outcome }}' != 'success' ]]; then
            echo 'Tenant isolation probe failed closed' >&2
            exit 1
          fi

          decision='${{ steps.guard.outputs.decision }}'
          if [[ "$decision" == 'replay_success' ]]; then
            echo 'Exact successful command replay accepted without MCP mutation'
            exit 0
          fi
          if [[ "$decision" != 'new' ]]; then
            echo "Unsupported guard decision: $decision" >&2
            exit 1
          fi

          [[ '${{ steps.execute.outcome }}' == 'success' ]]
          [[ '${{ steps.stamp.outcome }}' == 'success' ]]
          [[ '${{ steps.execute.outputs.exit_code }}' == '0' ]]
