name: Research Theme Media Render Quality

on:
  pull_request:
    paths:
      - 'wordpress/themes/eduardo-research/single-post.php'
      - 'wordpress/themes/eduardo-research/inc/research-media.php'
      - '.github/workflows/research-theme-media-render-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/eduardo-research/single-post.php'
      - 'wordpress/themes/eduardo-research/inc/research-media.php'
      - '.github/workflows/research-theme-media-render-quality.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Insight primary Media render contract
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE='wordpress/themes/eduardo-research/single-post.php'
          MEDIA='wordpress/themes/eduardo-research/inc/research-media.php'
          grep -F 'eduardo_research_render_primary_media($post_id);' "$TEMPLATE"
          grep -F 'data-research-media-slot="primary"' "$MEDIA"
          grep -F 'data-attachment-id=' "$MEDIA"
          php -l "$TEMPLATE"
          php -l "$MEDIA"
