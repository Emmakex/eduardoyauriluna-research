name: Site Architect 475 Mutation Contract Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-mutation-policy.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-mutation-policy.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-plan.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-executor.php'
      - 'scripts/site-architect-475-mutation-policy-contract-test.php'
      - '.github/workflows/site-architect-475-mutation-policy-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-mutation-policy.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-mutation-policy.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-plan.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-executor.php'
      - 'scripts/site-architect-475-mutation-policy-contract-test.php'
      - '.github/workflows/site-architect-475-mutation-policy-quality.yml'

permissions:
  contents: read

jobs:
  mutation-policy:
    name: Explicit mutation-policy boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint policy, Plan and Executor; verify two explicit profiles
        run: |
          set -euo pipefail
          ROOT=wordpress/plugins/eduardo-research-manager/includes
          php -l "$ROOT/class-site-architect-mutation-policy.php"
          php -l "$ROOT/class-research-manager-research-mutation-policy.php"
          php -l "$ROOT/class-research-manager-plan.php"
          php -l "$ROOT/class-research-manager-executor.php"
          php -l scripts/site-architect-475-mutation-policy-contract-test.php
          php scripts/site-architect-475-mutation-policy-contract-test.php
      - name: Enforce exact authorization and unchanged 0.11.1 entrypoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('wordpress/plugins/eduardo-research-manager')
          generic = (root/'includes/class-site-architect-mutation-policy.php').read_text()
          vertical = (root/'includes/class-research-manager-research-mutation-policy.php').read_text()
          plan = (root/'includes/class-research-manager-plan.php').read_text()
          executor = (root/'includes/class-research-manager-executor.php').read_text()
          bootstrap = (root/'eduardo-research-manager.php').read_text()
          for forbidden in ('eduardo_research', 'Research_Manager', 'update_option(', 'wp_insert_post(', 'delete_option(', '$_REQUEST', '$_POST'):
              assert forbidden not in generic, f'Generic policy contains instance or execution coupling: {forbidden}'
          assert 'private const ALLOWED_OPTIONS' not in plan
          assert '$policy->allowed_option_keys()' in plan
          assert '$policy->allowed_action_types()' in plan
          assert '$policy->allowed_meta_keys()' in plan
          assert 'public function allowed_meta_keys(): array;' in generic
          assert 'public function allowed_meta_keys(): array' in vertical
          assert 'public function risk_for_action(array $action, callable $is_theme_owned_page): string;' in generic
          assert 'public function evidence_blocker_message(string $reason): string;' in generic
          assert 'public function risk_for_action(array $action, callable $is_theme_owned_page): string' in vertical
          assert 'public function evidence_blocker_message(string $reason): string' in vertical
          risk = plan.split('public static function action_risk', 1)[1].split('private static function evidence_blocker_message', 1)[0]
          assert '$policy->risk_for_action(' in risk and "'evidence-required'" in risk
          assert 'Eduardo_Research_Manager_Resource_Registry' not in risk
          assert 'str_contains($key' not in risk
          assert "if (empty($plan['evidence_confirmed']))" in plan
          assert "trim((string) $plan['evidence_reference'])" in plan
          assert "self::evidence_blocker_message($policy, 'confirmation')" in plan
          assert "self::evidence_blocker_message($policy, 'reference')" in plan
          assert "action_risk($action, $this->mutation_policy, $this->theme_contract)" in executor
          meta_gate = plan.split('private static function allowed_meta_key', 1)[1].split('private static function sanitize_post_field_value', 1)[0]
          assert 'in_array($key, $policy->allowed_meta_keys(), true)' in meta_gate
          assert 'Resource_Registry::all()' not in meta_gate
          assert 'str_starts_with' not in meta_gate
          assert "if ('create_dataset' === $type)" in plan
          assert "if ('create_insight' === $type)" in plan
          assert 'Eduardo_Research_Manager_Plan::apply_gate($plan, $this->mutation_policy, $this->theme_contract)' in executor
          assert 'Eduardo_Research_Manager_Plan::validate($plan, $this->mutation_policy, $this->theme_contract)' in executor
          for key in ('eduardo_research_evidence','eduardo_research_model','eduardo_research_identity',
                      'create_line','create_dataset','show_on_front','page_on_front'):
              assert "'"+key+"'" in vertical
          assert 'Plugin Name: Site Architect' in bootstrap
          assert 'Version: 0.11.1' in bootstrap
          print('PASS: explicit code-owned allowlists and existing Site Architect version')
          PY
