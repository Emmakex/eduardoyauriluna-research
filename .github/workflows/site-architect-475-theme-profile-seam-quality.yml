name: Site Architect 475 Theme Profile Seam Quality

on:
  pull_request:
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-theme-profile.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-theme-profile.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-contract.php'
      - 'scripts/site-architect-475-theme-profile-contract-test.php'
      - '.github/workflows/site-architect-475-theme-profile-seam-quality.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/plugins/eduardo-research-manager/includes/class-site-architect-theme-profile.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-research-theme-profile.php'
      - 'wordpress/plugins/eduardo-research-manager/includes/class-research-manager-contract.php'
      - 'scripts/site-architect-475-theme-profile-contract-test.php'
      - '.github/workflows/site-architect-475-theme-profile-seam-quality.yml'

permissions:
  contents: read

jobs:
  theme-profile:
    name: Theme contract profile compatibility PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax and exact Research profile behavior
        shell: bash
        run: |
          set -euo pipefail
          ROOT=wordpress/plugins/eduardo-research-manager
          php -l "$ROOT/includes/class-site-architect-theme-profile.php"
          php -l "$ROOT/includes/class-research-manager-research-theme-profile.php"
          php -l "$ROOT/includes/class-research-manager-contract.php"
          php -l scripts/site-architect-475-theme-profile-contract-test.php
          php scripts/site-architect-475-theme-profile-contract-test.php
      - name: Verify Core interface has no Research assumptions or new write surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('wordpress/plugins/eduardo-research-manager')
          generic = (root / 'includes/class-site-architect-theme-profile.php').read_text(encoding='utf-8')
          vertical = (root / 'includes/class-research-manager-research-theme-profile.php').read_text(encoding='utf-8')
          contract = (root / 'includes/class-research-manager-contract.php').read_text(encoding='utf-8')
          bootstrap = (root / 'eduardo-research-manager.php').read_text(encoding='utf-8')
          for forbidden in ('eduardo_research', 'Eduardo_Research', 'Research_Manager', 'Site Manager',
                            'wp_insert_post', 'update_option', 'add_option', 'delete_option'):
              assert forbidden not in generic, f'Core interface contains a vertical/mutation coupling: {forbidden}'
          for phrase in ('implements Site_Architect_Theme_Profile',
                         "return 'research';", "return 'eduardo-research';",
                         "'es'=>array('suffix'=>'_es','identity_headline_field'=>'headline_es')"):
              assert phrase in vertical, f'Research profile missing accepted contract: {phrase}'
          for phrase in ('new Eduardo_Research_Manager_Research_Theme_Profile()',
                         '$this->theme_profile->preset()', '$this->theme_profile->language_storage()',
                         '$this->theme_profile->page_option_key($key, $suffix)'):
              assert phrase in contract, f'Contract did not delegate to Theme profile: {phrase}'
          for phrase in ("'home' === $key", "'eduardo_research_model' . $suffix",
                         "'eduardo_research_surface_' . $key . $suffix"):
              assert phrase in vertical, f'Research-only option storage rule missing: {phrase}'
              assert phrase not in contract, f'Research option storage leaked back into generic Contract: {phrase}'
          assert 'public function page_option_key(string $key, string $suffix): string;' in generic
          assert "if ('' === $key)" in contract
          assert '$this->language_storage($language)' in contract
          assert "Plugin Name: Site Architect" in bootstrap
          assert "Version: 0.11.1" in bootstrap
          assert "define('EDUARDO_RESEARCH_MANAGER_VERSION', '0.11.1')" in bootstrap
          print('PASS: Theme profile interface is generic and Research 0.11.1 remains authoritative')
          PY
