name: Phase 4 Media Metadata Production Acceptance Quality

on:
  pull_request:
    paths:
      - 'scripts/p4-media-metadata-production-acceptance.php'
      - '.github/workflows/p4-media-metadata-production-acceptance-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p4-media-metadata-production-acceptance.php'
      - '.github/workflows/p4-media-metadata-production-acceptance-quality.yml'

concurrency:
  group: p4-media-metadata-production-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: PHP lint
        run: php -l scripts/p4-media-metadata-production-acceptance.php

      - name: Help path requires no credential
        run: php scripts/p4-media-metadata-production-acceptance.php --help

      - name: Enforce bounded route allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('scripts/p4-media-metadata-production-acceptance.php').read_text()
          required = [
              '#^/capabilities$#',
              '#^/media/\\d+$#',
              '#^/media/metadata/plan$#',
              '#^/media/metadata/plans/[A-Za-z0-9._:-]+/apply$#',
              '#^/media/metadata/operations/[A-Za-z0-9._:-]+/verify$#',
              '#^/media/metadata/operations/[A-Za-z0-9._:-]+/rollback$#',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing required bounded route: {token}')
          forbidden_surfaces = ['/wp/v2/', '/upload', '/delete', '/filesystem', '/plugins', '/themes']
          for token in forbidden_surfaces:
              if token in text:
                  raise SystemExit(f'forbidden direct mutation surface detected: {token}')
          dangerous_calls = re.findall(r'(?<![A-Za-z0-9_])(shell_exec|exec|system|passthru|proc_open|popen)\s*\(', text)
          if dangerous_calls:
              raise SystemExit(f'forbidden shell/process call detected: {dangerous_calls!r}')
          for token in ('wp_update_post(', 'update_post_meta('):
              if token in text:
                  raise SystemExit(f'forbidden direct WordPress mutation detected: {token}')
          PY

      - name: Enforce exact temporary acceptance scope profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('scripts/p4-media-metadata-production-acceptance.php').read_text()
          match = re.search(r'\$expectedScopes\s*=\s*\$normaliseSet\(array\((.*?)\)\);', text, re.S)
          if not match:
              raise SystemExit('expected scope profile not found')
          scopes = re.findall(r"'([a-z.]+)'", match.group(1))
          expected = sorted([
              'site.read', 'site.diagnostics', 'media.read', 'media.write',
              'insights.read', 'insights.write', 'operations.apply', 'operations.rollback',
          ])
          if sorted(scopes) != expected:
              raise SystemExit(f'unexpected scope profile: {scopes!r}')
          PY

      - name: Enforce guaranteed reversible Apply boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-metadata-production-acceptance.php').read_text()
          required = [
              "if (! $apply)",
              "array('confirm' => true)",
              "array('rendered' => false)",
              "finally {",
              "apply-reconcile-plan",
              "ambiguous_apply_reconciled",
              "rollback_restored_source_revision",
              "post_rollback_value_restored",
              "CRITICAL: Media metadata rollback failed after Apply",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing guaranteed reversible acceptance guard: {token}')
          if "CURLOPT_FOLLOWLOCATION => false" not in text:
              raise SystemExit('redirect blocking missing')
          if "CURLOPT_SSL_VERIFYPEER => true" not in text or "CURLOPT_SSL_VERIFYHOST => 2" not in text:
              raise SystemExit('TLS verification contract missing')
          PY

      - name: Enforce bounded metadata fields and secret handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/p4-media-metadata-production-acceptance.php').read_text()
          if "const P4_MEDIA_FIELDS = array('title', 'alt_text', 'caption', 'description');" not in text:
              raise SystemExit('bounded Media field contract changed')
          if "getenv('ERM_TOKEN')" not in text:
              raise SystemExit('ERM_TOKEN environment-only contract missing')
          if "'token'" not in text or "'[redacted]'" not in text:
              raise SystemExit('evidence secret redaction contract missing')
          PY
